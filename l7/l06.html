<style>

/* =====================================================
   INTRO
===================================================== */

.lesson-intro{

  padding:18px;

}

.lesson-kicker{

}

.lesson-intro h1{

/* =====================================================
   STARTAUSWAHL
===================================================== */

.start-choice{

}

.start-buttons{

}

.start-btn{

.start-btn small{

/* =====================================================

===================================================== */

.teach-card,

.teach-head h2,

.teach-body,

.teach-body strong,

.teach-example{

}

  font-weight:700;
}

/* =====================================================
   TABELLEN
===================================================== */

.rule-table{

.rule-table th{

}

}

.rule-table tr:last-child td{

}

.rule-highlight{
  color:#694A06 !important;

}

/* =====================================================
   TRAINING
===================================================== */

.training-intro{

}

.training-intro p{

}

.question-card{

}

@keyframes slideUp{
  from{
    opacity:0;
    transform:translateY(14px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.q-theme{
  color:var(--gold);
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:2px;
  margin-bottom:8px;
}

.q-type-badge{

  background:rgba(201,168,76,.14);

  font-size:12px;
  margin-bottom:12px;
}

.q-prompt{
  font-size:17px;

.q-sentence{

.options{

.option-btn{

.option-btn.correct{

  color:#9FE7BD;
}

.option-btn.wrong{

  border-color:var(--red-wrong);
  color:#FFB6B6;
}

.option-letter{

  height:28px;
  flex:0 0 28px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  background:rgba(201,168,76,.15);
  color:var(--gold-light);
  font-size:12px;
  font-weight:800;
}

.feedback{
  display:none;
  margin-top:14px;
  padding:14px;
  border-radius:14px;
  font-size:14px;
}

.feedback.correct{
  display:block;
  background:rgba(76,175,125,.12);
  border:1px solid rgba(76,175,125,.3);
  color:#91E2B3;
}

.feedback.wrong{
  display:block;
  background:rgba(224,80,80,.09);
  border:1px solid rgba(224,80,80,.28);
  color:#F2B0B0;
}

.feedback-title{
  font-weight:800;
  margin-bottom:5px;
}

/* =====================================================
   BUTTONS
===================================================== */

.continue-btn,
.next-btn{
  width:calc(100% - 32px);
  margin:12px 16px 16px;
  padding:15px;
  border:none;
  border-radius:14px;
  background:linear-gradient(
    135deg,
    var(--gold-dark),
    var(--gold)
  );
  color:var(--ink);
  font-weight:800;
  cursor:pointer;
}

.next-btn{
  width:100%;
  margin:14px 0 0;
  display:none;
}

.next-btn.visible{
  display:block;
}

/* =====================================================

===================================================== */

.completion{

.completion.visible{

.completion-main{

}

.completion-symbol{

.completion-title{

.completion-score{

.completion-stars{

  margin-bottom:18px;

}

.completion-msg{

}

.diagnosis{
  max-width:760px;
  margin:28px auto 0;
}

.diagnosis-title{
  color:var(--gold-light);
  font-size:21px;
  margin-bottom:6px;
  text-align:left;
}

.diagnosis-sub{
  color:var(--stone);
  font-size:14px;
  text-align:left;
  margin-bottom:14px;
}

.skill-result{

  justify-content:space-between;
  gap:10px;
  padding:10px 12px;
  margin-bottom:7px;
  border-radius:10px;
  background:rgba(255,255,255,.04);
  font-size:14px;
}

.skill-result.good{
  border-left:4px solid var(--green-ok);
}

.skill-result.weak{
  border-left:4px solid var(--red-wrong);
}

.skill-name{
  color:var(--parchment);
}

.skill-score{
  color:var(--stone);
  font-weight:700;
}

.review-heading{
  color:var(--gold-light);
  text-align:left;
  font-size:20px;
  margin:26px 0 5px;
}

.review-explanation{
  color:var(--stone);
  text-align:left;
  font-size:14px;
  margin-bottom:8px;
}

.mastered-box{
  padding:16px;
  border-radius:14px;
  background:rgba(76,175,125,.1);
  border:1px solid rgba(76,175,125,.3);
  color:#A6EAC1;
  text-align:left;
  margin-top:18px;
}

.home-btn{
  display:inline-block;
  margin-top:28px;
  padding:14px 25px;
  border-radius:14px;
  background:linear-gradient(
    135deg,
    var(--gold-dark),
    var(--gold)
  );
  color:var(--ink);
  font-weight:800;
  text-decoration:none;
}

button:focus-visible,
a:focus-visible{
  outline:3px solid #FFF1A8;
  outline-offset:3px;
}

@media(max-width:520px){

  .lesson-goals,
  .start-buttons{
    grid-template-columns:1fr;
  }

  .rule-table{
    font-size:12px;
  }

  .rule-table th,
  .rule-table td{
    padding:6px 4px;
  }

}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}

const TEACHING=[
{title:'Genitiv: wessen?',body:'<p>Substantive werden dekliniert. Ihre Form zeigt den Kasus (Fall) und den Numerus (Einzahl oder Mehrzahl). Verben werden konjugiert.</p><p>Der Genitiv ist der 2. Fall. Er beschreibt oft, zu wem oder wozu etwas gehört: verba uxōris – die Worte der Ehefrau. Wir fragen: Wessen Worte?</p><p>Ein Attribut beschreibt ein anderes Wort genauer. uxōris ist hier ein Attribut zu verba. Es ist ein Satzgliedteil: Es kann zum Subjekt, Objekt oder Adverbiale gehören.</p><p>Orpheus verba uxōris nōn audit. – Orpheus hört die Worte der Ehefrau nicht.</p>'},
{title:'Genitivformen und Wortstamm',body:'<p>Eine Deklination ist eine Gruppe mit ähnlichen Endungen. Lerne ab jetzt den Genitiv mit. Entfernst du seine Endung, erhältst du den Stamm: patris → patr-, agrī → agr-.</p>'+table([['Gruppe','Genitiv Singular','Genitiv Plural'],['a-Deklination','servae – der Sklavin','servārum – der Sklavinnen'],['o-Deklination, m','servī – des Sklaven','servōrum – der Sklaven'],['o-Deklination, n','forī – des Marktplatzes','forōrum – der Marktplätze'],['3. Deklination','victōris – des Siegers','victōrum – der Sieger']])+'<p>Die 3. Deklination hat im Genitiv Plural meist -um. Ein abweichendes -ium wird im Wortschatz angegeben: pars, partis → partium (der Teile).</p><p>Bei Eigennamen auf -ius kann der Genitiv verkürzt sein: amīcus Pūblī (= Pūbliī) – ein Freund des Publius. Beide Genitivformen sind möglich.</p>'},
{title:'puer, ager und vir',body:'<p>puer und ager gehören zur o-Deklination. Sie sind männlich. Außer im Nominativ und Vokativ Singular haben sie dieselben Endungen wie Substantive auf -us. Der Vokativ ist die Anrede.</p><p>Bei puer bleibt das e: puerī. Bei ager entfällt es: agrī. Deshalb immer den Genitiv mitlernen. Auch vir (Mann) wird nach der o-Deklination dekliniert.</p>'+table([['Form','puer','ager'],['Nominativ Singular','puer – der Junge','ager – der Acker'],['Genitiv Singular','puerī – des Jungen','agrī – des Ackers'],['Nominativ Plural','puerī – die Jungen','agrī – die Äcker'],['Genitiv Plural','puerōrum – der Jungen','agrōrum – der Äcker']])},
{title:'Gleiche Endung, verschiedene Aufgaben',body:'<p>servae kann Genitiv Singular oder Nominativ Plural sein. Ebenso servī und puerī. Ein isoliertes Wort lässt sich deshalb nicht immer eindeutig bestimmen.</p><p>Fīlius servae venit. – Der Sohn der Sklavin kommt: servae ist Genitiv Singular.<br>Servae veniunt. – Die Sklavinnen kommen: servae ist Nominativ Plural.</p><p>Auch -is muss sorgfältig gelesen werden: senātōris ist Genitiv Singular der 3. Deklination, servīs ist Ablativ Plural der o-Deklination. Beachte Wortstamm, Deklination und Satz. Der Dativ ist noch kein L06-Trainingsstoff.</p>'},
{title:'Genitivus partitivus: ein Teil des Ganzen',body:'<p>Der Genitivus partitivus nennt das Ganze, von dem ein Teil gemeint ist. Er steht oft bei Mengen, Teilen oder Fragewörtern.</p>'+table([['Latein','Deutsch'],['cōpia frūmentī','eine Menge Getreide'],['pars forī','ein Teil des Marktplatzes'],['quis amīcōrum?','wer von den Freunden?']])+'<p>Bei pars forī ist pars der Teil und forī das Ganze: der Marktplatz.</p>'},
{title:'Genitivus obiectivus: auf wen richtet sich das Gefühl?',body:'<p>Bei Gefühlen kann der Genitiv die Person oder Sache nennen, auf die sich das Gefühl richtet. amor patris kann „die Liebe zum Vater“ bedeuten. Der Vater ist dann das Ziel der Liebe.</p><p>Ohne Zusammenhang ist auch „die Liebe des Vaters“ möglich: Der Vater empfindet die Liebe. Ebenso cūra patris: die Sorge des Vaters oder die Sorge um den Vater.</p><p>Ein Kind liebt seinen Vater: amor patris = Liebe zum Vater. Der Vater liebt sein Kind: amor patris = Liebe des Vaters. Wir entscheiden nach dem Zusammenhang.</p>'},
{title:'Wörter in sinnvollen Sätzen',body:'<p>dēlectāre heißt erfreuen: Rōma mē dēlectat. – Rom erfreut mich. gaudēre heißt sich freuen und steht hier mit Ablativ: Cōpiā aquae gaudeō. – Ich freue mich über die Menge Wasser.</p><p>Auram probō. – Ich finde die Luft gut. probāre kann auch prüfen oder beweisen heißen: iniūriam probāre – das Unrecht beweisen.</p><p>Īnsulam cōgnōscō. – Ich erkenne eine Insel.<br>Tē cōgnōscere volō. – Ich will dich kennenlernen.<br>Puer gladium attingit. – Der Junge berührt das Schwert.</p><p>Cūr dē auxiliō dubitās? – Warum zweifelst du an der Hilfe?<br>Cūr venīre dubitās? – Warum zögerst du zu kommen?</p><p>Unterscheide ähnliche Wörter: patrem → pater (Vater), partem → pars (Teil), parēns (Vater oder Mutter). parāre = vorbereiten, pārēre = gehorchen, portāre = tragen.</p><p>Für Abläufe: statim – sofort; semper – immer; numquam – niemals; tandem – endlich; tum – dann; dēnique – schließlich.</p>'},
{title:'Wiederholen und Eselsbrücken nutzen',body:'<p>Verteile Wiederholungen über mehrere Tage. Der Vorschlag im Heft: am ersten Abend, am nächsten Tag, nach weiteren zwei Tagen, am Wochenende und vor der Klassenarbeit. Fünf Wiederholungen helfen; sie sind keine Garantie, dass ein Wort für immer sitzt.</p><p>Bei einer Vokabelkartei wandern gewusste Wörter ein Fach weiter; vergessene zurück in Fach 1. Lege Fach 1 zuerst beiseite, übe dann Fach 4, 3 und 2 und zum Schluss Fach 1. Plane täglich etwa 10–15 Minuten für ältere Wörter ein.</p><p>Eselsbrücken aus Seite 120: Impuls → impellere; transportieren → portāre; Filiale → fīlia; Kur → cūra.</p><p>Sprachenvergleich: parentēs – französisch les parents; exspectāre – englisch to expect; accēdere – to access; intrāre – to enter; amāre – französisch aimer; laudāre – englisch to laud; salūs – französisch le salut; contendere – englisch to contend; respondēre – französisch répondre.</p>'}
].map(x=>({...x,kicker:'Erklärung → Beispiel'}));
const SKILL_INFO={vocab:{name:'L06-Wortschatz'},genitive:{name:'Genitiv bilden'},er:{name:'puer, ager und vir'},ambiguous:{name:'Formen im Kontext'},attribute:{name:'Genitivattribut'},partitive:{name:'Teil und Gesamtheit'},objective:{name:'Genitiv bei Gefühlen'},context:{name:'Wörter im Satz'}};
function question(skill,prompt,sentence,answer,wrong,explanation,reviewKeys,input=false){let options=shuffle([answer,...wrong]);return {skill,prompt,sentence,options,correct:options.indexOf(answer),success:explanation,wrong:'',reviewKeys,input,helper:input?'Längezeichen sind freiwillig.':'Wähle eine Antwort.',theme:SKILL_INFO[skill].name};}
function vocabQuestion(v=one(VOCAB)){return {...question('vocab','Welche Bedeutungen gehören zum Lernwort?',v.lat+' · '+v.info,v.de,shuffle(VOCAB.filter(w=>w.de!==v.de)).slice(0,3).map(w=>w.de),v.lat+' bedeutet: '+v.de+'.',[]),vocabLat:v.lat};}
const CONTEXT=[['Templa deōrum et vīllae mē ___.','dēlectant',['dēlectat','gaudent'],'Die Tempel und Häuser erfreuen mich. Das Subjekt steht im Plural.'],['Cōpiā aquae ___. – Ich freue mich über die Menge Wasser.','gaudeō',['dēlectō','probō'],'gaudēre mit Ablativ: sich über etwas freuen.'],['Auram ___. – Ich finde die Luft gut.','probō',['gaudeō','dubitō'],'probāre bedeutet hier gut finden.'],['Rōma mē ___. – Rom erfreut mich.','dēlectat',['gaudet','probant'],'Rom ist Singular: dēlectat.'],['Īnsulam ___. – Ich erkenne eine Insel.','cōgnōscō',['cōgnōscere','attingit'],'Die Personalform cōgnōscō heißt ich erkenne.'],['Tē ___ volō. – Ich will dich kennenlernen.','cōgnōscere',['cōgnōscō','attingit'],'Nach volō ergänzt der Infinitiv die Aussage.'],['Puer gladium ___. – Der Junge berührt das Schwert.','attingit',['attingō','attingere'],'Der Junge: 3. Person Singular.'],['Cūr venīre ___? – Warum zögerst du zu kommen?','dubitās',['dubitō','dēlectās'],'dubitāre mit Infinitiv: zögern, etwas zu tun.'],['Das Wasser darf ___ ausgehen: niemals.','numquam',['semper','dēnique'],'numquam heißt nie, niemals.'],['___ bürste ich das Pferd: schließlich.','dēnique',['semper','numquam'],'dēnique heißt schließlich, zuletzt.']];
function grammar(skill,input=false){
 if(skill==='genitive'||skill==='er'){let n=one(skill==='er'?NOUNS.filter(n=>['puer','ager','vir'].includes(n[0])):NOUNS),i=Math.random()<.5?1:2;return question(skill,'Bilde den Genitiv '+(i===1?'Singular':'Plural')+'.',n[0]+(i===2?' · Genitiv Singular: '+n[1]:' · Deklination: '+n[3]),n[i],[],n[0]+' → '+n[i]+'. '+(n[0]==='pars'?'Der Genitiv Plural lautet ausdrücklich partium.':'Nutze den Stamm aus dem Genitiv und die passende Endung.'),[skill==='er'?2:1],true);}
 if(skill==='ambiguous'){let x=one([['servae (ohne Satz)','Genitiv Singular oder Nominativ Plural',['nur Genitiv Singular','nur Nominativ Plural']],['puerī (ohne Satz)','Genitiv Singular oder Nominativ Plural',['nur Genitiv Singular','nur Nominativ Plural']],['Fīlius servae venit. · servae','Genitiv Singular',['Nominativ Plural','Akkusativ Singular']],['Servae veniunt. · servae','Nominativ Plural',['Genitiv Singular','Akkusativ Singular']],['cum servīs · servīs','Ablativ Plural',['Genitiv Singular','Nominativ Plural']],['verba senātōris · senātōris','Genitiv Singular',['Ablativ Plural','Nominativ Plural']]]);return question(skill,'Bestimme die markierte bzw. genannte Form im L06-Stoff.',x[0],x[1],x[2],'Wortstamm, Deklination und Zusammenhang helfen. Ohne Kontext können mehrere Lösungen möglich sein.',[3]);}
 if(skill==='attribute'){let x=one([['Orpheus verba uxōris nōn audit.','uxōris','Wessen Worte? Die Worte der Ehefrau.'],['Fīlius patris verba audit.','patris','Wessen Worte? Die Worte des Vaters.'],['Templum deī vidēmus.','deī','Wessen Tempel? Der Tempel des Gottes.']]);return question(skill,'Welches Wort ist das Genitivattribut?',x[0],x[1],x[0].replace(/[.]/g,'').split(' ').filter(w=>w!==x[1]).slice(0,2),x[2]+' Das Attribut beschreibt ein anderes Substantiv.',[0]);}
 if(skill==='partitive'){let x=one([['pars forī','ein Teil des Marktplatzes','forī nennt das Ganze, pars den Teil.'],['cōpia frūmentī','eine Menge Getreide','frūmentī nennt, wovon die Menge vorhanden ist.'],['quis amīcōrum?','wer von den Freunden?','amīcōrum nennt die gesamte Gruppe.']]);return question(skill,'Übersetze den Ausdruck.',x[0],x[1],['die Liebe zum Vater','die Worte der Ehefrau'],x[2],[4]);}
 if(skill==='objective'){let x=one([['Ein Kind sorgt sich um seinen Vater: cūra patris','die Sorge um den Vater','Der Vater ist das Ziel der Sorge.'],['Der Vater sorgt sich um sein Kind: cūra patris','die Sorge des Vaters','Der Vater empfindet die Sorge selbst.'],['Ein Kind liebt seinen Vater: amor patris','die Liebe zum Vater','Der Vater ist das Ziel der Liebe.'],['amor patris – ohne weiteren Zusammenhang','die Liebe des Vaters oder die Liebe zum Vater','Ohne Zusammenhang sind beide Deutungen möglich.']]);return question(skill,'Welche Antwort nennt alle im angegebenen Zusammenhang passenden Deutungen?',x[0],x[1],['die Sorge um den Vater','die Sorge des Vaters','die Liebe zum Vater','die Liebe des Vaters','die Liebe des Vaters oder die Liebe zum Vater'].filter(a=>a!==x[1] && (x[0].includes('cūra')?a.includes('Sorge'):a.includes('Liebe'))),x[2],[5]);}
 let x=one(CONTEXT);return question('context','Ergänze passend zum Satz und zur Bedeutung.',x[0],x[1],x[2],x[3],[6]);
}
function buildSession(){return [...shuffle(VOCAB).slice(0,5).map(vocabQuestion),grammar('attribute'),grammar('ambiguous'),grammar('genitive'),grammar('genitive'),grammar('er'),grammar('partitive'),grammar('objective'),grammar('ambiguous'),grammar('attribute'),grammar('context'),grammar('context'),grammar('context'),grammar('objective')];}
function buildPractice(result){return result.wrongAnswers.map(e=>{let old=e.question;if(old.skill==='vocab'){let v=VOCAB.find(v=>v.lat===old.vocabLat);return {...question('vocab','Welches Lernwort bedeutet das?',v.de,v.lat,shuffle(VOCAB.filter(w=>w.lat!==v.lat)).slice(0,3).map(w=>w.lat),v.lat+' · '+v.info+' – '+v.de,[]),vocabLat:v.lat};}let q;for(let i=0;i<150;i++){q=grammar(old.skill,old.input);if(q.sentence!==old.sentence||q.prompt!==old.prompt)break;}return q;});}

// Full training and practice have independent state; completed results are snapshots.
let currentSession=null;
let practiceSession=null;
let lastFullResult=null;
const HISTORY_KEY="magistrella-l06-history-v1";
const BEST_KEY="magistrella-l06-best";
let storageMessage="";
function readStored(key){try{return localStorage.getItem(key);}catch{return null;}}
function writeStored(key,value){try{localStorage.setItem(key,value);return true;}catch{storageMessage="Dein Browser kann den Verlauf gerade nicht speichern. Dieses Ergebnis bleibt während dieser geöffneten Seite sichtbar.";return false;}}
function readHistory(){
  try {const data=JSON.parse(readStored(HISTORY_KEY)||"[]");
    return Array.isArray(data)?data.filter(r=>r && r.lesson==="L06" && Number.isInteger(r.total) && r.total>0 && Number.isInteger(r.correct) && r.correct>=0 && r.correct<=r.total && r.percentage===Math.round(r.correct/r.total*100) && Number.isFinite(Date.parse(r.completedAt))):[];
  }catch{return [];}
}
let history=readHistory();
function activeSession(){return practiceSession || currentSession;}
function newSession(type,questions){
  if(!questions.length || questions.some(q=>!SKILL_INFO[q.skill])) throw new Error("Frage ohne Diagnose");
  return {type,startedAt:new Date().toISOString(),questions,current:0,score:0,total:questions.length,skillStats:{},wrongAnswers:[],answered:false,completed:false};
}
function recordAnswer(q,answer,ok){
  const run=activeSession();
  if(run.answered || run.completed) return false;
  run.answered=true;
  const stats=run.skillStats[q.skill] ||= {attempts:0,correct:0};
  stats.attempts++;
  if(ok){stats.correct++;run.score++;}
  else run.wrongAnswers.push({skill:q.skill,prompt:q.prompt,sentence:plainText(q.sentence)+(q.sentence.includes("<strong")?" · Markiert: "+q.helper:""),answer,correctAnswer:q.options[q.correct],explanation:q.success+" "+q.wrong,question:JSON.parse(JSON.stringify(q))});
  return true;
}
function escapeHTML(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normalizeAnswer(value){return value.normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase();}
function renderIntro(){
 document.getElementById('progressLabel').textContent='Start';
 document.getElementById('mainContent').innerHTML=`<div class="lesson-intro"><div class="lesson-kicker">Magistrella · L06</div><h1>Ikarus und der Traum vom Fliegen</h1><p>Genitiv · Zugehörigkeit · Teil und Ganzes</p><p>18 Aufgaben pro Volltraining. 100 % beschreibt diesen Durchlauf, nicht den gesamten Wortschatz.</p></div><section class="start-choice"><h2>Wie möchtest du starten?</h2><div class="start-buttons"><button class="start-btn learn" id="learnBtn">Regeln lernen<small>Alle Erklärungen Schritt für Schritt</small></button><button class="start-btn training" id="trainingBtn">Direkt zum Training<small>Regeln überspringen und Wissen testen</small></button></div></section>${vocabularyHTML()}${historyHTML()}`;
 document.getElementById('learnBtn').onclick=()=>renderTeaching(0);document.getElementById('trainingBtn').onclick=startTraining;
}

/* =====================================================
   TRAININGSSTART
===================================================== */

function startTraining(){
  practiceSession=null;
  currentSession=newSession("full",buildSession());
  openTraining();
}
function startPractice(){
  if(!lastFullResult || !lastFullResult.wrongAnswers.length) return;
  practiceSession=newSession("practice",buildPractice(lastFullResult));
  openTraining();
}
function openTraining(){
  document.getElementById("mainContent").style.display="block";
  document.getElementById("completionScreen").classList.remove("visible");
  renderQuestion();window.scrollTo({top:0,behavior:"smooth"});
}
function renderQuestion(){
  const run=activeSession();
  if(run.current>=run.total){showCompletion();return;}
  run.answered=false;
  const q=run.questions[run.current];
  document.getElementById("progressLabel").textContent=(run.type==="practice"?"Üben ":"")+(run.current+1)+"/"+run.total;
  const main=document.getElementById("mainContent");
  main.innerHTML=`${run.type==="practice"?'<div class="training-intro"><h2>Nur meine Fehler trainieren</h2><p>Diese Übungsrunde verändert dein vollständiges Training nicht.</p><button class="start-btn training" id="returnResult">Zum vollständigen Ergebnis</button></div>':''}<div class="question-card"><div class="q-theme">${q.theme}</div><div class="q-type-badge">Aufgabe ${run.current+1}</div><div class="q-prompt">${q.prompt}</div><div class="q-sentence">${q.sentence}</div><div class="q-helper">${q.helper}</div><div class="options"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><button type="button" id="nextBtn" class="next-btn">${run.current===run.total-1?'Auswertung anzeigen ✓':'Weiter →'}</button></div>`;
  if(run.type==="practice") document.getElementById("returnResult").onclick=()=>renderFullResult();
  const card=main.querySelector(".question-card"), wrap=card.querySelector(".options");
  function submit(answer,ok){
    if(!recordAnswer(q,answer,ok)) return;
    wrap.querySelectorAll("button,input").forEach(el=>el.disabled=true);
    wrap.querySelectorAll(".option-btn").forEach((el,i)=>{if(i===q.correct) el.classList.add("correct");else if(el.textContent===answer) el.classList.add("wrong");});
    showFeedback(card,q,ok);
  }
  if(q.input){
    wrap.innerHTML='<form><label for="formAnswer">Deine Form</label><input id="formAnswer" autocomplete="off" autocapitalize="none" spellcheck="false" required><button class="start-btn learn" type="submit">Antwort prüfen</button></form>';
    wrap.querySelector("form").onsubmit=e=>{e.preventDefault();const value=wrap.querySelector("input").value;if(value.trim()) submit(value,normalizeAnswer(value)===normalizeAnswer(q.options[q.correct]));};
  }else q.options.forEach((option,i)=>{
    const btn=document.createElement("button");btn.type="button";btn.className="option-btn";btn.textContent=option;
    btn.onclick=()=>submit(option,i===q.correct);wrap.appendChild(btn);
  });
  document.getElementById("nextBtn").onclick=()=>{if(!run.answered)return;run.current++;renderQuestion();window.scrollTo({top:0,behavior:"smooth"});};
}

/* =====================================================
   FEEDBACK
===================================================== */

function showFeedback(
  card,
  q,
  ok
){

  const feedback=
    card.querySelector(
      "#feedback"
    );


  feedback.className=
    "feedback "+
    (
      ok
      ?
      "correct"
      :
      "wrong"
    );


  feedback.innerHTML=`

    <div class="feedback-title">
      ${
        ok
        ?
        "Richtig."
        :
        "Noch nicht richtig."
      }
    </div>

    <div>
      ${
        ok
        ?
        q.success
        :
        escapeHTML(q.options[q.correct])+". "+q.success+" "+q.wrong
      }
    </div>

  `;


  card
    .querySelector(
      "#nextBtn"
    )
    .classList.add(
      "visible"
    );

}


/* =====================================================
   DIAGNOSE
===================================================== */

function completeFullSession(){
  const run=currentSession;
  if(run.completed) return lastFullResult;
  const stats=Object.values(run.skillStats);
  if(run.current!==run.total || stats.reduce((n,s)=>n+s.attempts,0)!==run.total || stats.reduce((n,s)=>n+s.correct,0)!==run.score || run.wrongAnswers.length!==run.total-run.score) throw new Error("Unvollständige Trainingsdiagnose");
  const completedAt=new Date().toISOString();
  const result=JSON.parse(JSON.stringify({id:globalThis.crypto?.randomUUID?.() || completedAt+"-"+Math.random().toString(36).slice(2),lesson:"L06",startedAt:run.startedAt,completedAt,correct:run.score,total:run.total,percentage:Math.round(run.score/run.total*100),skillStats:run.skillStats,wrongAnswers:run.wrongAnswers}));
  run.completed=true;lastFullResult=result;
  // Re-read to retain completed runs from another open tab when possible.
  const existing=readHistory();
  history=[...existing,...history.filter(r=>!existing.some(e=>e.id===r.id)),result];
  writeStored(HISTORY_KEY,JSON.stringify(history));
  const best=Math.max(Number(readStored(BEST_KEY))||0,...history.map(r=>r.percentage));
  writeStored(BEST_KEY,String(best));
  return result;
}
function buildDiagnosis(result){
  const rows=Object.entries(result.skillStats).map(([skill,s])=>`<div class="skill-result ${s.correct===s.attempts?'good':'weak'}"><span>${escapeHTML(SKILL_INFO[skill].name)}</span><span class="skill-score">${s.correct===s.attempts?'✓':'Üben'} · ${s.correct}/${s.attempts}</span></div>`).join('');
  const errors=result.wrongAnswers.map(e=>`<article class="correction"><strong>${escapeHTML(SKILL_INFO[e.skill].name)}</strong><p>${escapeHTML(e.prompt)}</p><p>${escapeHTML(e.sentence)}</p><p>Deine Antwort: ${escapeHTML(e.answer)}</p><p><strong>Richtig: ${escapeHTML(e.correctAnswer)}</strong></p><p>${escapeHTML(e.explanation)}</p></article>`).join('');
  const grammar=[...new Set(result.wrongAnswers.flatMap(e=>e.question.reviewKeys || []))];
  const cards=grammar.map(index=>`<article class="review-card"><div class="review-head"><h3>${TEACHING[index].title.replace(/^\d+\. /,'')}</h3></div><div class="review-body">${TEACHING[index].body}</div></article>`).join('');
  return `<section class="result-section"><h2>Deine Diagnose</h2><p>Alle ${result.total} Antworten aus diesem Training.</p>${rows}${errors?'<h3 class="review-heading">Deine Antworten verbessern</h3>'+errors:'<p class="mastered-box">✓ Alle Antworten richtig!</p>'}${cards?'<h3 class="review-heading">Diese Regeln helfen dir weiter</h3>'+cards:''}</section>`;
}
function historyHTML(){
  if(!history.length)return `<section class="result-section"><h2>Dein Verlauf</h2><p>Noch kein Volltraining gespeichert.</p><p>Bestwert: ${Number(readStored(BEST_KEY))||0} %</p></section>`;
  const recent=history.slice().sort((a,b)=>Date.parse(b.completedAt)-Date.parse(a.completedAt));
  const best=Math.max(Number(readStored(BEST_KEY))||0,...history.map(r=>r.percentage));
  return `<section class="result-section"><h2>Dein Verlauf</h2><p>Letztes Training: <strong>${recent[0].percentage} %</strong><br>Bestwert: <strong>${best} %</strong><br>Vollständige Trainings: <strong>${history.length}</strong></p><ul class="history-list">${recent.map(r=>`<li>${escapeHTML(new Date(r.completedAt).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'}))} · <strong>${r.correct}/${r.total} · ${r.percentage} %</strong></li>`).join('')}</ul></section>`;
}
function showCompletion(){
  if(activeSession().type==='practice'){
    practiceSession.completed=true;
    renderFullResult(`Übungsrunde beendet: ${practiceSession.score}/${practiceSession.total} richtig. Dein vollständiges Ergebnis bleibt unverändert.`);
  }else{completeFullSession();renderFullResult();}
}
function renderFullResult(practiceMessage=''){
  const r=lastFullResult;if(!r)return;
  document.getElementById('mainContent').style.display='none';
  document.getElementById('progressLabel').textContent='Fertig';
  const screen=document.getElementById('completionScreen');screen.classList.add('visible');
  screen.innerHTML=`${practiceMessage?`<p class="training-intro" role="status">${escapeHTML(practiceMessage)}</p>`:''}<section class="result-section completion-main"><h2>Dieses Training</h2><div class="completion-title">${r.percentage===100?'PERFECTUM!':'L06 geschafft!'}</div><div class="completion-score">${r.correct} / ${r.total}<br>${r.percentage} %</div><p>Genitiv · Familie · Zugehörigkeit</p><div class="result-actions"><button class="start-btn learn" id="shareResult">Ergebnis teilen</button><button class="start-btn training" id="saveResult">Bild speichern</button></div><p id="shareStatus" role="status"></p></section>${buildDiagnosis(r)}<section class="result-section"><h2>Wie möchtest du weiterlernen?</h2><div class="result-actions">${r.wrongAnswers.length?'<button class="start-btn learn" id="practiceErrors">Nur meine Fehler trainieren</button>':''}<button class="start-btn training" id="restartFull">Alles noch einmal trainieren</button></div><a class="home-btn" href="../index.html">← Zurück zur Übersicht</a></section>${historyHTML()}${storageMessage?`<p role="status">${escapeHTML(storageMessage)}</p>`:''}`;
  document.querySelector('.completion-main').appendChild(createShareCanvas(r));
  document.getElementById('restartFull').onclick=startTraining;
  if(r.wrongAnswers.length)document.getElementById('practiceErrors').onclick=startPractice;
  document.getElementById('shareResult').onclick=()=>shareResult(r);
  document.getElementById('saveResult').onclick=()=>saveResult(r);
  window.scrollTo({top:0,behavior:'smooth'});
}
// Local Canvas only: no learner data, external artwork, fonts or requests.
function createShareCanvas(result){
  const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1080;
  const ctx=canvas.getContext('2d');if(!ctx)throw new Error('Canvas nicht verfügbar');
  ctx.fillStyle='#1A1208';ctx.fillRect(0,0,1080,1080);
  ctx.strokeStyle='#C9A84C';ctx.lineWidth=3;ctx.strokeRect(40,40,1000,1000);ctx.strokeRect(54,54,972,972);
  ctx.textAlign='center';ctx.fillStyle='#E8C96A';
  ctx.font='bold 58px Georgia, serif';ctx.fillText('MAGISTRELLA',540,170);
  ctx.fillStyle='#F5EDD6';ctx.font='32px sans-serif';ctx.fillText('Latein-Training',540,230);
  ctx.font='bold 52px Georgia, serif';ctx.fillText('L06 geschafft!',540,350);
  ctx.fillStyle='#E8C96A';ctx.font='bold 130px sans-serif';ctx.fillText(`${result.correct} / ${result.total}`,540,535);
  ctx.font='bold 100px sans-serif';ctx.fillText(`${result.percentage} %`,540,675);
  if(result.percentage===100){ctx.font='bold 36px Georgia, serif';ctx.fillText('PERFECTUM!',540,760);}
  ctx.fillStyle='#F5EDD6';ctx.font='30px sans-serif';ctx.fillText('Genitiv · Familie · Zugehörigkeit',540,860);
  ctx.font='28px sans-serif';ctx.fillText(new Date(result.completedAt).toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'}),540,945);
  return canvas;
}
function shareBlob(r){return new Promise((resolve,reject)=>{try{createShareCanvas(r).toBlob(blob=>blob?resolve(blob):reject(new Error('PNG konnte nicht erstellt werden')),'image/png');}catch(e){reject(e);}});}
function downloadBlob(blob,r){
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Magistrella-L06-${r.completedAt.slice(0,10)}.png`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
}
async function saveResult(r){try{downloadBlob(await shareBlob(r),r);document.getElementById('shareStatus').textContent='Dein Ergebnisbild wurde zum Speichern bereitgestellt.';}catch{document.getElementById('shareStatus').textContent='Das Bild konnte nicht erstellt werden. Bitte versuche es erneut.';}}
async function shareResult(r){
  try{
    const blob=await shareBlob(r);
    const file=typeof File==='function'?new File([blob],'Magistrella-L06.png',{type:'image/png'}):null;
    if(file && navigator.share && navigator.canShare?.({files:[file]})){
      try{await navigator.share({files:[file],title:'Magistrella · L06'});return;}catch(e){if(e.name==='AbortError')return;}
    }
    downloadBlob(blob,r);document.getElementById('shareStatus').textContent='Teilen ist hier nicht verfügbar. Dein Bild wurde zum Speichern bereitgestellt.';
  }catch{document.getElementById('shareStatus').textContent='Bitte nutze „Bild speichern“ oder versuche es erneut.';}
}



renderIntro();
</script>
