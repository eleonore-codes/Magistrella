function shuffle(arr){

  const a = arr.slice();

  for(let i=a.length-1;i>0;i--){

    const j =
      Math.floor(
        Math.random()*(i+1)
      );

    [a[i],a[j]] =
      [a[j],a[i]];

  }

  return a;
}


function one(arr){

  return arr[
    Math.floor(
      Math.random()*arr.length
    )
  ];

}


function unique(arr){

  return arr.filter(
    (value,index,array) =>
      array.indexOf(value)===index
  );

}


function distractors(
  correct,
  values,
  amount=2
){

  return shuffle(
    unique(values)
      .filter(
        value =>
          value!==correct
      )
  ).slice(0,amount);

function makeQuestion(
  theme,
  prompt,
  sentence,
  helper,
  options,
  correct,
  success,
  wrong
){

  return{
    theme,
    prompt,
    sentence,
    helper,
    options,
    correct,
    success,
    wrong
  };

}


function qMeaningNoun(){

  const n = one(NOUNS);

  const wrong =
    distractors(
      n.deSg,
      NOUNS.map(x=>x.deSg),
      2
    );

  const opts =
    shuffle([
      n.deSg,
      ...wrong
    ]);

  return makeQuestion(
    "Vokabel + Substantiv",
    "Was bedeutet dieses lateinische Wort?",
    n.sg,
    "Bevor du die Form bestimmst: Weißt du noch, was das Wort bedeutet?",
    opts,
    opts.indexOf(n.deSg),
    n.sg+" bedeutet „"+n.deSg+"“.",
    "Die richtige Bedeutung ist „"+n.deSg+"“."
  );

}


function qPlural(){

  const n = one(NOUNS);

  const wrong =
    distractors(
      n.pl,
      NOUNS.map(x=>x.pl),
      2
    );

  const opts =
    shuffle([
      n.pl,
      ...wrong
    ]);

  return makeQuestion(
    "Singular → Plural",
    "Welche Pluralform gehört dazu?",
    n.sg+" = "+n.deSg,
    "Gesucht ist die Form für mehrere.",
    opts,
    opts.indexOf(n.pl),
    n.sg+" → "+n.pl+". Auf Deutsch: "+n.deSg+" → "+n.dePl+".",
    "Der passende Plural lautet "+n.pl+"."
  );

}


function qSingular(){

  const n = one(NOUNS);

  const wrong =
    distractors(
      n.sg,
      NOUNS.map(x=>x.sg),
      2
    );

  const opts =
    shuffle([
      n.sg,
      ...wrong
    ]);

  return makeQuestion(
    "Plural → Singular",
    "Welche Singularform gehört dazu?",
    n.pl+" = "+n.dePl,
    "Gesucht ist die Form für eine Person oder Sache.",
    opts,
    opts.indexOf(n.sg),
    n.pl+" → "+n.sg+".",
    "Der passende Singular lautet "+n.sg+"."
  );

}


function qDeclension(){

  const n = one(NOUNS);

  const opts =
    shuffle([
      "a-Deklination",
      "o-Deklination",
      "3. Deklination"
    ]);

  return makeQuestion(
    "Deklinationsklasse",
    "Zu welcher Formenfamilie gehört dieses Wort?",
    n.sg+" → "+n.pl,
    n.sg+" bedeutet „"+n.deSg+"“.",
    opts,
    opts.indexOf(n.decl),
    n.sg+" / "+n.pl+" gehört zur "+n.decl+".",
    "Dieses Wort gehört zur "+n.decl+"."
  );

}


function qGenus(){

  const n = one(NOUNS);

  const labels = {
    m:"maskulin (m)",
    f:"feminin (f)",
    n:"neutrum (n)"
  };

  const opts =
    shuffle([
      "maskulin (m)",
      "feminin (f)",
      "neutrum (n)"
    ]);

  return makeQuestion(
    "Genus",
    "Welches Genus hat dieses Wort?",
    n.sg+" = "+n.deSg,
    "m = maskulin · f = feminin · n = neutrum",
    opts,
    opts.indexOf(labels[n.genus]),
    n.sg+" ist "+labels[n.genus]+".",
    "Richtig ist: "+labels[n.genus]+"."
  );

}


function qVerbMeaning(){

  const v = one(VERBS);

  const wrong =
    distractors(
      v.de,
      VERBS.map(x=>x.de),
      2
    );

  const opts =
    shuffle([
      v.de,
      ...wrong
    ]);

  return makeQuestion(
    "Vokabel + Verb",
    "Was bedeutet dieser Infinitiv?",
    v.inf,
    "Der Infinitiv ist die Grundform.",
    opts,
    opts.indexOf(v.de),
    v.inf+" bedeutet „"+v.de+"“.",
    "Die richtige Bedeutung ist „"+v.de+"“."
  );

}


function qVerbNumber(){

  const v = one(VERBS);

  const plural =
    Math.random()>.5;

  const correct =
    plural
      ? v.pl
      : v.sg;

  const opts =
    shuffle([
      correct,
      plural ? v.sg : v.pl,
      v.inf
    ]);

  return makeQuestion(
    "3. Person",
    plural
      ? "Welche Form bedeutet hier: „sie "+v.de+"“?"
      : "Welche Form bedeutet hier: „er / sie "+v.de+"“?",
    v.inf+" = "+v.de,
    plural
      ? "Gesucht ist die 3. Person Plural."
      : "Gesucht ist die 3. Person Singular.",
    opts,
    opts.indexOf(correct),
    correct+" ist die richtige Form.",
    plural
      ? "Die 3. Person Plural lautet "+v.pl+"."
      : "Die 3. Person Singular lautet "+v.sg+"."
  );

}


function qEnding(){

  const v = one(VERBS);

  const plural =
    Math.random()>.5;

  const form =
    plural
      ? v.pl
      : v.sg;

  const answer =
    plural
      ? "mehrere handeln"
      : "eine Person handelt";

  const opts =
    shuffle([
      "eine Person handelt",
      "mehrere handeln"
    ]);

  return makeQuestion(
    "Endung lesen",
    "Was erkennst du an dieser Verbform?",
    form+" · "+v.de,
    plural
      ? "Achte besonders auf -nt."
      : "Achte besonders auf -t.",
    opts,
    opts.indexOf(answer),
    form+" zeigt hier: "+answer+".",
    "Merke: -t steht hier für Singular, -nt für Plural."
  );

}


function qKongruenz(){

  const n = one(NOUNS);
  const v = one(VERBS);

  const plural =
    Math.random()>.5;

  const subject =
    plural
      ? n.pl
      : n.sg;

  const correct =
    plural
      ? v.pl
      : v.sg;

  const wrongForm =
    plural
      ? v.sg
      : v.pl;

  const opts =
    shuffle([
      correct,
      wrongForm,
      v.inf
    ]);

  return makeQuestion(
    "Subjekt + Prädikat",
    "Welche Verbform passt?",
    subject+" _____",
    subject+" bedeutet „"+
      (plural ? n.dePl : n.deSg)+
      "“. Das Subjekt steht im "+
      (plural ? "Plural." : "Singular."),
    opts,
    opts.indexOf(correct),
    subject+" "+correct+" passt im Numerus zusammen.",
    "Das Subjekt steht im "+
      (plural ? "Plural" : "Singular")+
      ". Deshalb brauchst du "+correct+"."
  );

}


function qEsse(){

  const plural =
    Math.random()>.5;

  const sentence =
    plural
      ? "Dāvus et Fidus servī _____."
      : "Dāvus servus _____.";

  const correct =
    plural
      ? "sunt"
      : "est";

  const opts =
    shuffle([
      "est",
      "sunt",
      plural ? "adest" : "adsunt"
    ]);

  return makeQuestion(
    "esse = sein",
    "Welche Form passt?",
    sentence,
    plural
      ? "Mehrere Personen → sie sind."
      : "Eine Person → er ist.",
    opts,
    opts.indexOf(correct),
    correct+" ist richtig.",
    plural
      ? "Bei mehreren Personen heißt es sunt."
      : "Bei einer Person heißt es est."
  );

}


function qInfinitiv(){

  const v = one(VERBS);

  const opts =

    opts,
    opts.indexOf(v.inf),
    v.inf+" ist der Infinitiv und bedeutet „"+v.de+"“.",
    "Die Grundform lautet "+v.inf+"."
  );

}


function qDebere(){

  const plural =
    Math.random()>.5;

  const sentence =
    plural
      ? "Servī venīre _____."
      : "Servus venīre _____.";

  const correct =

      ? "dēbent"
      : "dēbet";

    shuffle([
      "dēbet",
      "dēbent",
      "venit"
    ]);

  return makeQuestion(
    "dēbēre + Infinitiv",

    sentence,
    "venīre = kommen · dēbēre = müssen / sollen",

    opts.indexOf(correct),
    plural

      ? "Servī steht im Plural. Deshalb: dēbent."

  );

}

      "button"
    );

  btn.type =
    "button";

  btn.className =
    "continue-btn";


  if(
    index ===
    TEACHING.length-1
  ){

    btn.textContent =
      "Jetzt üben →";

    btn.addEventListener(
      "click",
      function(){

        renderTrainingIntro();

        window.scrollTo({
          top:0,
          behavior:"smooth"
        });

      }
    );

  }

  else{

    btn.textContent =
      "Weiter →";

    btn.addEventListener(
      "click",
      function(){

        renderTeaching(
          index+1
        );

        window.scrollTo({
          top:0,
          behavior:"smooth"
        });

      }
    );

  }


  main.appendChild(btn);

}


/* =====================================================
   TRAININGSSTART
===================================================== */

function renderTrainingIntro(){

  const main =
    document.getElementById(
      "mainContent"
    );

  document.getElementById(
    "progressLabel"
  ).textContent =
    "Training";


  main.innerHTML = `

    <div class="training-intro">

      <h2>
        Jetzt trainierst du das Gelernte
      </h2>

      <p>
        Die Aufgaben beginnen leicht.
        Lateinische Formen werden möglichst zusammen
        mit ihrer deutschen Bedeutung gezeigt.
        Wenn etwas falsch ist, bekommst du direkt
        die richtige Erklärung.
      </p>

    </div>

  `;


  const btn =
    document.createElement(
      "button"
    );

  btn.type =
    "button";

  btn.className =
    "continue-btn";

  btn.textContent =
    "Training starten →";


  btn.addEventListener(
    "click",
    function(){

      current=0;

      renderQuestion();

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

    }
  );


  main.appendChild(btn);

}


/* =====================================================
   FRAGEN RENDERN
===================================================== */

function renderQuestion(){

  if(
    current >=
    session.length
  ){

    showCompletion();

    return;
  }


  const q =
    session[current];


  document.getElementById(
    "progressLabel"
  ).textContent =
    (current+1)+
    "/"+
    session.length;


  const main =
    document.getElementById(
      "mainContent"
    );


  main.innerHTML =
    "";


  const card =
    document.createElement(
      "div"
    );

  card.className =
    "question-card";


  card.innerHTML = `

    <div class="q-theme">
      ${q.theme}
    </div>

    <div class="q-type-badge">
      Aufgabe ${current+1}
    </div>

    <div class="q-prompt">
      ${q.prompt}
    </div>

    <div class="q-sentence">
      ${q.sentence}
    </div>

    ${
      q.helper
      ?
      `<div class="q-helper">
        ${q.helper}
      </div>`
      :
      ""
    }

  `;


  const optionWrap =
    document.createElement(
      "div"
    );

  optionWrap.className =
    "options";


  const letters =
    ["A","B","C","D"];


  let answered =
    false;


  q.options.forEach(
    function(option,index){

      const btn =
        document.createElement(
          "button"
        );

      btn.type =
        "button";

      btn.className =
        "option-btn";


      btn.innerHTML = `

        <span class="option-letter">
          ${letters[index]}
        </span>

        <span>
          ${option}
        </span>

      `;


      btn.addEventListener(
        "click",
        function(){

          if(answered){
            return;
          }

          answered =
            true;


          const buttons =
            optionWrap.querySelectorAll(
              ".option-btn"
            );


          const ok =
            index ===
            q.correct;


          if(ok){

            btn.classList.add(
              "correct"
            );

            score++;

          }

          else{

            btn.classList.add(
              "wrong"
            );

            buttons[
              q.correct
            ].classList.add(
              "correct"
            );

          }


          showFeedback(
            card,
            q,
            ok
          );

        }
      );


      optionWrap.appendChild(
        btn
      );

    }
  );


  card.appendChild(
    optionWrap
  );


  const feedback =
    document.createElement(
      "div"
    );

  feedback.id =
    "feedback";

  feedback.className =
    "feedback";


  card.appendChild(
    feedback
  );


  const next =
    document.createElement(
      "button"
    );

  next.type =
    "button";

  next.id =
    "nextBtn";

  next.className =
    "next-btn";


  next.textContent =
    current ===
    session.length-1
      ?
      "Lektion abschließen ✓"
      :
      "Weiter →";


  next.addEventListener(
    "click",
    function(){

      current++;

      renderQuestion();

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

    }
  );


  card.appendChild(
    next
  );


  main.appendChild(
    card
  );

}


/* =====================================================
   FEEDBACK
===================================================== */

function showFeedback(
  card,
  q,
  ok
){

  const feedback =
    card.querySelector(
      "#feedback"
    );


  feedback.className =
    "feedback "+
    (
      ok
      ?
      "correct"
      :
      "wrong"
    );


  feedback.innerHTML = `

    <div class="feedback-title">
      ${
        ok
        ?
        "Richtig."
        :
        "Noch nicht richtig."
      }
    </div>

    <div>
      ${
        ok
        ?
        q.success
        :
        q.wrong
      }
    </div>

    ${
      !ok
      ?
      `<div class="feedback-tip">
        Schau dir dabei nicht nur die Endung,
        sondern auch die deutsche Bedeutung an.
      </div>`
      :
      ""
    }

  `;


  card
    .querySelector(
      "#nextBtn"
    )
    .classList.add(
      "visible"
    );

}


/* =====================================================
   ABSCHLUSS
===================================================== */

function showCompletion(){

  document.getElementById(
    "mainContent"
  ).style.display =
    "none";


  const screen =
    document.getElementById(
      "completionScreen"
    );


  screen.classList.add(
    "visible"
  );


  const pct =
    Math.round(
      score /
      session.length *
      100
    );


  document.getElementById(
    "finalScore"
  ).textContent =
    score+
    "/"+
    session.length+
    " · "+
    pct+
    " %";


  document.getElementById(
    "finalStars"
  ).textContent =
    pct>=90
      ?
      "★★★"
      :
      pct>=70
        ?
        "★★"
        :
        "★";


  let msg;


  if(pct>=90){

    msg =
      "Sehr sicher. Du verstehst jetzt, was Singular, Plural und Deklination bedeuten, erkennst die ersten Formenfamilien und kannst wichtige Verbformen zuordnen.";

  }

  else if(pct>=70){

    msg =
      "Die Grundlage sitzt. Wiederhole L01 später noch einmal, damit die Endungsmuster und die Verbformen automatisch abrufbar werden.";

  }

  else{

    msg =
      "Gehe L01 noch einmal durch. Die Erklärungen kommen vor dem Training erneut. Konzentriere dich zuerst auf Singular und Plural und danach auf -t und -nt.";

  }


  document.getElementById(
    "finalMsg"
  ).textContent =
    msg;


  const oldBest =
    Number(
      localStorage.getItem(
        "magistrella-l01-best"
      ) || 0
    );


  if(pct>oldBest){

    localStorage.setItem(
      "magistrella-l01-best",
      pct
    );

  }

}


/* =====================================================
   START
===================================================== */

renderIntro();

</script>
