function shuffle(arr){
  const a = arr.slice();

  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }

  return a;
}

function one(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function wrongChoices(correct, source, amount=2){
  return shuffle(
    source.filter(x=>x!==correct)
  ).slice(0,amount);
}

/* --- Singular → Plural --- */

function qPlural(){
  const n = one(NOUNS);

  const alternatives = wrongChoices(
    n.pl,
    NOUNS.map(x=>x.pl),
    2
  );

  const opts = shuffle([n.pl,...alternatives]);

  return makeQuestion(
    "Singular → Plural",
    "Welche Pluralform gehört zu „"+n.sg+"“?",
    n.sg+" → ?",
    opts,
    opts.indexOf(n.pl),
    RULE_SUBSTANTIVE,
    "Richtig. "+n.sg+" → "+n.pl+".",
    n.sg+" steht im Singular. Der passende Plural lautet "+n.pl+"."
  );
}


/* --- Plural → Singular --- */

function qSingular(){
  const n = one(NOUNS);

  const alternatives = wrongChoices(
    n.sg,
    NOUNS.map(x=>x.sg),
    2
  );

  const opts = shuffle([n.sg,...alternatives]);

  return makeQuestion(
    "Plural → Singular",
    "Welche Singularform gehört zu „"+n.pl+"“?",
    n.pl+" → ?",
    opts,
    opts.indexOf(n.sg),
    RULE_SUBSTANTIVE,
    "Richtig. "+n.pl+" → "+n.sg+".",
    n.pl+" ist die Pluralform von "+n.sg+"."
  );
}


/* --- Deklinationsklasse --- */

function qDeclension(){
  const n = one(NOUNS);

  const opts = shuffle([
    "a-Deklination",
    "o-Deklination",
    "3. Deklination"
  ]);

  return makeQuestion(
    "Deklinationsklasse",
    "Zu welcher Deklinationsklasse gehört dieses Substantiv?",
    n.sg+" · "+n.pl,
    opts,
    opts.indexOf(n.decl),
    RULE_DEKLINATION,
    "Richtig. "+n.sg+" gehört zur "+n.decl+".",
    n.sg+" / "+n.pl+" gehört zur "+n.decl+"."
  );
}


/* --- Genus --- */

function qGenus(){
  const n = one(NOUNS);

  const labels = {
    m:"maskulin (m)",
    f:"feminin (f)",
    n:"neutrum (n)"
  };

  const opts = shuffle([
    "maskulin (m)",
    "feminin (f)",
    "neutrum (n)"
  ]);

  return makeQuestion(
    "Genus",
    "Welches grammatische Geschlecht hat dieses Wort?",
    n.sg+" – "+n.de,
    opts,
    opts.indexOf(labels[n.genus]),
    RULE_DEKLINATION,
    "Richtig. "+n.sg+" ist "+labels[n.genus]+".",
    n.sg+" ist "+labels[n.genus]+"."
  );
}


/* --- Verb Singular/Plural --- */

function qVerbNumber(){
  const v = one(VERBS);
  const askPlural = Math.random()>.5;

  const correct = askPlural ? v.pl : v.sg;
  const other = askPlural ? v.sg : v.pl;

  const extraPool = VERBS
    .map(x=>askPlural?x.pl:x.sg)
    .filter(x=>x!==correct);

  const opts = shuffle([
    correct,
    other,
    one(extraPool)
  ]);

  return makeQuestion(
    "3. Person",
    askPlural
      ? "Welche Form steht in der 3. Person Plural?"
      : "Welche Form steht in der 3. Person Singular?",
    v.inf+" – "+v.de,
    opts,
    opts.indexOf(correct),
    RULE_VERB,
    "Richtig. "+correct+" ist die gesuchte Form.",
    askPlural
      ? v.pl+" ist die Pluralform."
      : v.sg+" ist die Singularform."
  );
}


/* --- -t / -nt --- */

function qEnding(){
  const v = one(VERBS);
  const usePlural = Math.random()>.5;

  const form = usePlural ? v.pl : v.sg;
  const correct = usePlural
    ? "3. Person Plural"
    : "3. Person Singular";

  const opts = shuffle([
    "3. Person Singular",
    "3. Person Plural"
  ]);

  return makeQuestion(
    "Endung lesen",
    "Was verrät dir die Verbform?",
    form,
    opts,
    opts.indexOf(correct),
    RULE_VERB,
    "Richtig. "+form+" steht in der "+correct+".",
    form+" steht in der "+correct+"."
  );
}


/* --- Kongruenz --- */

function qKongruenz(){
  const n = one(NOUNS);
  const v = one(VERBS);
  const plural = Math.random()>.5;

  const subject = plural ? n.pl : n.sg;
  const correctVerb = plural ? v.pl : v.sg;
  const wrongVerb = plural ? v.sg : v.pl;

  const other = one(
    VERBS
      .filter(x=>x.inf!==v.inf)
      .map(x=>plural?x.pl:x.sg)
  );

  const opts = shuffle([
    correctVerb,
    wrongVerb,
    other
  ]);

  return makeQuestion(
    "Kongruenz",
    "Welche Verbform passt zum Subjekt?",
    subject+" _____ .",
    opts,
    opts.indexOf(correctVerb),
    RULE_KONGRUENZ,
    "Richtig. "+subject+" "+correctVerb+".",
    "Das Subjekt ist "+(plural?"Plural":"Singular")+
    ". Deshalb muss auch das Prädikat im "+
    (plural?"Plural":"Singular")+" stehen."
  );
}


/* --- esse --- */

function qEsse(){
  const plural = Math.random()>.5;

  const sentence = plural
    ? "Dāvus et Fidus servī _____."
    : "Dāvus servus _____.";

  const correct = plural ? "sunt" : "est";

  const opts = shuffle([
    "est",
    "sunt",
    plural ? "adest" : "adsunt"
  ]);

  return makeQuestion(
    "esse",
    "Welche Form von esse passt?",
    sentence,
    opts,
    opts.indexOf(correct),
    RULE_ESSE,
    "Richtig. "+correct+" passt zum Subjekt.",
    plural
      ? "Mehrere Personen: Deshalb brauchst du sunt."
      : "Eine Person: Deshalb brauchst du est."
  );
}


/* --- Infinitiv erkennen --- */

function qInfinitiv(){
  const v = one(VERBS);

  const opts = shuffle([
    v.inf,
    v.sg,
    v.pl
  ]);

  return makeQuestion(
    "Infinitiv",
    "Welche Form ist der Infinitiv?",
    v.de,
    opts,
    opts.indexOf(v.inf),
    RULE_INFINITIV,
    "Richtig. "+v.inf+" ist der Infinitiv.",
    "Die Grundform lautet "+v.inf+"."
  );
}


/* --- Infinitiv übersetzen --- */

function qInfTranslation(){
  const v = one(VERBS);

  const distractors = wrongChoices(
    v.de,
    VERBS.map(x=>x.de),
    2
  );

  const opts = shuffle([
    v.de,
    ...distractors
  ]);

  return makeQuestion(
    "Infinitiv übersetzen",
    "Was bedeutet dieser Infinitiv?",
    v.inf,
    opts,
    opts.indexOf(v.de),
    RULE_INFINITIV,
    "Richtig. "+v.inf+" = "+v.de+".",
    v.inf+" bedeutet "+v.de+"."
  );
}


/* --- debere + Infinitiv --- */

function qDebere(){
  const plural = Math.random()>.5;

  const sentence = plural
    ? "Servī venīre _____."
    : "Servus venīre _____.";

  const correct = plural ? "dēbent" : "dēbet";

  const opts = shuffle([
    "dēbet",
    "dēbent",
    "venit"
  ]);

  return makeQuestion(
    "dēbēre + Infinitiv",
    "Welche Form passt?",
    sentence,
    opts,
    opts.indexOf(correct),
    RULE_DEBERE,
    "Richtig. "+correct+" passt zum Subjekt.",
    plural
      ? "Servī ist Plural. Deshalb heißt es dēbent."
      : "Servus ist Singular. Deshalb heißt es dēbet."
  );
}


/* --- Übersetzung debere --- */

function qDebereTranslation(){
  const opts = shuffle([
    "Der Sklave muss schweigen.",
    "Die Sklaven schweigen.",
    "Der Sklave schweigt."
  ]);

  return makeQuestion(
    "Latein → Deutsch",
    "Welche Übersetzung ist richtig?",
    "Servus tacēre dēbet.",
    opts,
    opts.indexOf("Der Sklave muss schweigen."),
    RULE_DEBERE,
    "Richtig. dēbet + Infinitiv wird hier mit „muss …“ übersetzt.",
    "Servus tacēre dēbet bedeutet: Der Sklave muss schweigen."
  );
}


/* --- Vokabel --- */

function qVocab(){
  const [lat,de] = one(VOCAB);

  const wrong = wrongChoices(
    de,
    VOCAB.map(x=>x[1]),
    2
  );

  const opts = shuffle([de,...wrong]);

  return makeQuestion(
    "Vokabel",
    "Was bedeutet dieses Wort?",
    lat,
    opts,
    opts.indexOf(de),
    null,
    "Richtig. "+lat+" = "+de+".",
    lat+" bedeutet "+de+"."
  );
}


/* =====================================================
   SESSION
===================================================== */

function buildSession(){

  /*
    Die Reihenfolge folgt bewusst dem Lernaufbau:
    erkennen → bilden → System verstehen →
    Verbformen → Kongruenz → Infinitiv →
    debere → gemischter Transfer
  */

  return [

    qPlural(),
    qSingular(),

    qDeclension(),
    qGenus(),

    qPlural(),
    qDeclension(),

    qVerbNumber(),
    qEnding(),

    qKongruenz(),
    qKongruenz(),

    qEsse(),

    qInfinitiv(),
    qInfTranslation(),

    qDebere(),
    qDebereTranslation(),

    qVocab(),

    qKongruenz(),

    Math.random()>.5 ? qPlural() : qVerbNumber()

  ];
}

let session = buildSession();

let current = 0;
let score = 0;


/* =====================================================
   INTRO
===================================================== */

function renderIntro(){

  const main = document.getElementById("mainContent");

  main.innerHTML = `

    <div class="lesson-intro">

      <div class="lesson-kicker">
        Magistrella · L01
      </div>

      <h1>Singular, Plural und erste Verbformen</h1>

      <p>
        In dieser Lektion lernst du, wie lateinische Endungen
        zeigen, ob eine oder mehrere Personen oder Dinge gemeint
        sind. Außerdem trainierst du erste Verbformen und den
        Infinitiv.
      </p>

      <div class="lesson-goals">

        <div class="goal-chip">
          Singular ↔ Plural
        </div>

        <div class="goal-chip">
          a-, o- und 3. Deklination
        </div>

        <div class="goal-chip">
          Genus m · f · n
        </div>

        <div class="goal-chip">
          3. Person: -t · -nt
        </div>

        <div class="goal-chip">
          est · sunt
        </div>

        <div class="goal-chip">
          Infinitiv · dēbēre
        </div>

      </div>

    </div>

    <div class="rule-card">
      ${RULE_SUBSTANTIVE}
    </div>

    <div class="rule-card">
      ${RULE_VERB}
    </div>

  `;

  const btn = document.createElement("button");
  btn.className = "next-btn visible";
  btn.style.margin = "16px";
  btn.style.width = "calc(100% - 32px)";
  btn.textContent = "Training starten →";

  btn.onclick = () => {
    current = 0;
    renderQuestion();
    window.scrollTo({top:0,behavior:"smooth"});
  };

  main.appendChild(btn);
}


/* =====================================================
   RENDER QUESTION
===================================================== */

function renderQuestion(){

  if(current >= session.length){
    showCompletion();
    return;
  }

  const q = session[current];

  document.getElementById("progressLabel").textContent =
    (current+1)+"/"+session.length;

  const main = document.getElementById("mainContent");

  main.innerHTML = "";

  if(q.rule){
    const rule = document.createElement("div");
    rule.className = "rule-card";
    rule.innerHTML = q.rule;
    main.appendChild(rule);
  }

  const card = document.createElement("div");
  card.className = "question-card";

  card.innerHTML = `

    <div class="q-theme">
      ${q.theme}
    </div>

    <div class="q-type-badge">
      Aufgabe ${current+1}
    </div>

    <div class="q-prompt">
      ${q.prompt}
    </div>

    <div class="q-sentence">
      ${q.sentence}
    </div>

  `;

  const optionWrap = document.createElement("div");
  optionWrap.className = "options";

  const letters = ["A","B","C","D"];

  let answered = false;

  q.options.forEach((option,index)=>{

    const btn = document.createElement("button");

    btn.type = "button";
    btn.className = "option-btn";

    btn.innerHTML = `
      <span class="option-letter">
        ${letters[index]}
      </span>
      <span>${option}</span>
    `;

    btn.onclick = () => {

      if(answered) return;

      answered = true;

      const allButtons =
        optionWrap.querySelectorAll(".option-btn");

      const ok = index === q.correct;

      if(ok){

        btn.classList.add("correct");
        score++;

      }else{

        btn.classList.add("wrong");
        allButtons[q.correct].classList.add("correct");

      }

      showFeedback(card,q,ok);

    };

    optionWrap.appendChild(btn);

  });

  card.appendChild(optionWrap);

  const feedback = document.createElement("div");
  feedback.id = "feedback";
  feedback.className = "feedback";

  card.appendChild(feedback);

  const next = document.createElement("button");

  next.type = "button";
  next.id = "nextBtn";
  next.className = "next-btn";

  next.textContent =
    current === session.length-1
      ? "Lektion abschließen ✓"
      : "Weiter →";

  next.onclick = () => {

    current++;

    renderQuestion();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  };

  card.appendChild(next);

  main.appendChild(card);
}


/* =====================================================
   FEEDBACK
===================================================== */

function showFeedback(card,q,ok){

  const feedback = card.querySelector("#feedback");

  feedback.className =
    "feedback " + (ok ? "correct" : "wrong");

  feedback.innerHTML = `

    <div class="feedback-title">
      ${ok ? "Richtig." : "Noch nicht richtig."}
    </div>

    <div>
      ${ok ? q.success : q.wrong}
    </div>

  `;

  card
    .querySelector("#nextBtn")
    .classList.add("visible");
}


/* =====================================================
   ABSCHLUSS
===================================================== */

function showCompletion(){

  document.getElementById("mainContent").style.display =
    "none";

  const screen =
    document.getElementById("completionScreen");

  screen.classList.add("visible");

  const pct =
    Math.round(score/session.length*100);

  document.getElementById("finalScore").textContent =
    score+"/"+session.length+" · "+pct+" %";

  document.getElementById("finalStars").textContent =
    pct >= 90
      ? "★★★"
      : pct >= 70
        ? "★★"
        : "★";

  let msg;

  if(pct >= 90){

    msg =
      "Sehr sicher. Du erkennst Singular und Plural, kannst die ersten Deklinationsmuster unterscheiden und Subjekt und Prädikat passend verbinden.";

  }else if(pct >= 70){

    msg =
      "Gute Grundlage. Wiederhole besonders die Aufgaben, bei denen du zwischen Singular und Plural oder zwischen -t und -nt entscheiden musstest.";

  }else{

    msg =
      "Wiederhole L01 noch einmal. Konzentriere dich zunächst auf die Endungen bei Substantiven und anschließend auf -t und -nt bei den Verben.";

  }

  document.getElementById("finalMsg").textContent =
    msg;

  localStorage.setItem(
    "magistrella-l01-best",
    Math.max(
      Number(
        localStorage.getItem("magistrella-l01-best") || 0
      ),
      pct
    )
  );
}


/* =====================================================
   START
===================================================== */

renderIntro();

</script>

</html>
