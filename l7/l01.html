<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>L01 · Singular & Plural · Erste Formen · Magistrella</title>

<style>
:root{
  --gold:#C9A84C;
  --gold-light:#E8C96A;
  --gold-dark:#8B6914;
  --ink:#1A1208;
  --ink-mid:#2A1F0E;
  --parchment:#F5EDD6;
  --parchment-dark:#E8D9B5;
  --stone:#968B78;
  --green-ok:#4CAF7D;
  --red-wrong:#E05050;
  --white:#FDFAF3;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  background:var(--ink);
  color:var(--parchment);
  min-height:100vh;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}

button{
  font:inherit;
}

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 16px;
  background:rgba(26,18,8,.96);
  backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(201,168,76,.2);
}

.back-btn{
  color:var(--gold);
  text-decoration:none;
  font-size:20px;
  padding:4px 8px 4px 0;
}

.topbar-info{
  flex:1;
}

.topbar-title{
  color:var(--gold-light);
  font-size:14px;
  font-style:italic;
}

.topbar-sub{
  color:var(--stone);
  font-size:12px;
}

.topbar-progress{
  color:var(--gold);
  font-weight:800;
  font-size:13px;
  min-width:55px;
  text-align:right;
}

/* =====================================================
   INTRO
===================================================== */

.lesson-intro{
  margin:16px;
  padding:18px;
  border:1px solid rgba(201,168,76,.25);
  border-radius:18px;
  background:linear-gradient(
    135deg,
    rgba(201,168,76,.12),
    rgba(201,168,76,.03)
  );
}

.lesson-kicker{
  color:var(--gold);
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:2px;
}

.lesson-intro h1{
  color:var(--gold-light);
  font-size:24px;
  line-height:1.25;
  margin:5px 0 10px;
}

.lesson-intro p{
  color:var(--parchment-dark);
  font-size:15px;
}

.lesson-goals{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px;
}

.goal-chip{
  background:rgba(0,0,0,.18);
  border:1px solid rgba(201,168,76,.16);
  border-radius:11px;
  padding:8px 10px;
  font-size:13px;
  color:var(--parchment-dark);
}

/* =====================================================
   STARTAUSWAHL
===================================================== */

.start-choice{
  margin:16px;
  padding:18px;
  border-radius:18px;
  background:var(--ink-mid);
  border:1px solid rgba(201,168,76,.18);
}

.start-choice h2{
  color:var(--gold-light);
  font-size:19px;
  margin-bottom:5px;
}

.start-choice p{
  color:var(--stone);
  font-size:14px;
  margin-bottom:15px;
}

.start-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.start-btn{
  min-height:64px;
  padding:12px;
  border-radius:14px;
  cursor:pointer;
  font-weight:800;
  border:1.5px solid var(--gold);
}

.start-btn.learn{
  background:linear-gradient(
    135deg,
    var(--gold-dark),
    var(--gold)
  );
  color:var(--ink);
}

.start-btn.training{
  background:rgba(201,168,76,.07);
  color:var(--gold-light);
}

.start-btn small{
  display:block;
  margin-top:3px;
  font-size:11px;
  font-weight:500;
  line-height:1.35;
  opacity:.85;
}

/* =====================================================
   LERNKARTEN
===================================================== */

.teach-card,
.review-card{
  margin:16px;
  border-radius:18px;
  overflow:hidden;
  background:var(--parchment);
  color:#2A1F0E;
  border:1px solid rgba(201,168,76,.55);
  text-align:left;
}

.teach-head,
.review-head{
  padding:13px 16px;
  background:var(--parchment-dark);
  border-bottom:1px solid rgba(90,60,10,.12);
}

.teach-kicker,
.review-kicker{
  color:#735108;
  text-transform:uppercase;
  font-size:11px;
  letter-spacing:2px;
  font-weight:800;
}

.teach-head h2,
.review-head h3{
  color:#2A1F0E;
  font-size:20px;
  line-height:1.3;
  margin-top:2px;
}

.teach-body,
.review-body{
  padding:16px;
  font-size:15px;
}

.teach-body p + p,
.review-body p + p{
  margin-top:10px;
}

.teach-body strong,
.review-body strong{
  color:#6C4B06;
}

.teach-example{
  margin-top:14px;
  padding:12px;
  background:rgba(255,255,255,.55);
  border-left:4px solid var(--gold-dark);
  border-radius:10px;
}

.teach-example .latin{
  font-size:17px;
  font-weight:800;
  font-style:italic;
  color:#2A1F0E;
}

.teach-example .german{
  margin-top:2px;
  color:#594931;
}

.mini-rule{
  margin-top:14px;
  padding:11px 12px;
  border:1px solid rgba(139,105,20,.25);
  border-radius:10px;
  background:#FFF9EA;
  color:#594006;
  font-weight:700;
}

/* =====================================================
   TABELLEN
===================================================== */

.rule-table{
  width:100%;
  border-collapse:collapse;
  margin-top:14px;
  font-size:14px;
}

.rule-table th{
  background:rgba(139,105,20,.13);
  color:#654807;
  padding:7px 7px;
  text-align:left;
  font-size:12px;
}

.rule-table td{
  color:#2E2110;
  padding:7px;
  border-bottom:1px solid rgba(80,55,5,.14);
  vertical-align:top;
}

.rule-table tr:last-child td{
  border-bottom:none;
}

.rule-highlight{
  color:#694A06 !important;
  font-weight:800;
}

/* =====================================================
   TRAINING
===================================================== */

.training-intro{
  margin:16px;
  padding:16px;
  border-radius:16px;
  border:1px solid rgba(201,168,76,.25);
  background:rgba(201,168,76,.07);
}

.training-intro h2{
  color:var(--gold-light);
  font-size:19px;
  margin-bottom:5px;
}

.training-intro p{
  color:var(--parchment-dark);
  font-size:14px;
}

.question-card{
  margin:16px;
  padding:20px;
  border-radius:20px;
  background:var(--ink-mid);
  border:1px solid rgba(201,168,76,.15);
  animation:slideUp .22s ease;
}

@keyframes slideUp{
  from{
    opacity:0;
    transform:translateY(14px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.q-theme{
  color:var(--gold);
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:2px;
  margin-bottom:8px;
}

.q-type-badge{
  display:inline-block;
  padding:4px 10px;
  border-radius:99px;
  background:rgba(201,168,76,.14);
  border:1px solid rgba(201,168,76,.28);
  color:var(--gold-light);
  font-size:12px;
  margin-bottom:12px;
}

.q-prompt{
  font-size:17px;
  color:var(--parchment);
  margin-bottom:14px;
}

.q-sentence{
  font-size:18px;
  color:var(--white);
  text-align:center;
  font-style:italic;
  background:rgba(0,0,0,.2);
  border-radius:12px;
  padding:13px;
  margin-bottom:16px;
}

.q-helper{
  color:var(--stone);
  font-size:13px;
  margin-top:-6px;
  margin-bottom:14px;
}

.options{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.option-btn{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 15px;
  border-radius:14px;
  border:1.5px solid rgba(201,168,76,.25);
  background:rgba(255,255,255,.04);
  color:#fff;
  cursor:pointer;
  text-align:left;
}

.option-btn.correct{
  background:rgba(76,175,125,.15);
  border-color:var(--green-ok);
  color:#9FE7BD;
}

.option-btn.wrong{
  background:rgba(224,80,80,.12);
  border-color:var(--red-wrong);
  color:#FFB6B6;
}

.option-letter{
  width:28px;
  height:28px;
  flex:0 0 28px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  background:rgba(201,168,76,.15);
  color:var(--gold-light);
  font-size:12px;
  font-weight:800;
}

.feedback{
  display:none;
  margin-top:14px;
  padding:14px;
  border-radius:14px;
  font-size:14px;
}

.feedback.correct{
  display:block;
  background:rgba(76,175,125,.12);
  border:1px solid rgba(76,175,125,.3);
  color:#91E2B3;
}

.feedback.wrong{
  display:block;
  background:rgba(224,80,80,.09);
  border:1px solid rgba(224,80,80,.28);
  color:#F2B0B0;
}

.feedback-title{
  font-weight:800;
  margin-bottom:5px;
}

/* =====================================================
   BUTTONS
===================================================== */

.continue-btn,
.next-btn{
  width:calc(100% - 32px);
  margin:12px 16px 16px;
  padding:15px;
  border:none;
  border-radius:14px;
  background:linear-gradient(
    135deg,
    var(--gold-dark),
    var(--gold)
  );
  color:var(--ink);
  font-weight:800;
  cursor:pointer;
}

.next-btn{
  width:100%;
  margin:14px 0 0;
  display:none;
}

.next-btn.visible{
  display:block;
}

/* =====================================================
   ABSCHLUSS + DIAGNOSE
===================================================== */

.completion{
  display:none;
  padding:32px 16px 45px;
}

.completion.visible{
  display:block;
}

.completion-main{
  text-align:center;
}

.completion-symbol{
  font-size:60px;
}

.completion-title{
  color:var(--gold-light);
  font-size:27px;
  margin-top:8px;
}

.completion-score{
  color:var(--gold);
  font-size:42px;
  font-weight:800;
  margin:14px 0;
}

.completion-stars{
  font-size:32px;
  margin-bottom:18px;
  letter-spacing:6px;
}

.completion-msg{
  color:var(--parchment-dark);
  max-width:560px;
  margin:0 auto 24px;
  font-size:15px;
}

.diagnosis{
  max-width:760px;
  margin:28px auto 0;
}

.diagnosis-title{
  color:var(--gold-light);
  font-size:21px;
  margin-bottom:6px;
  text-align:left;
}

.diagnosis-sub{
  color:var(--stone);
  font-size:14px;
  text-align:left;
  margin-bottom:14px;
}

.skill-result{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:10px 12px;
  margin-bottom:7px;
  border-radius:10px;
  background:rgba(255,255,255,.04);
  font-size:14px;
}

.skill-result.good{
  border-left:4px solid var(--green-ok);
}

.skill-result.weak{
  border-left:4px solid var(--red-wrong);
}

.skill-name{
  color:var(--parchment);
}

.skill-score{
  color:var(--stone);
  font-weight:700;
}

.review-heading{
  color:var(--gold-light);
  text-align:left;
  font-size:20px;
  margin:26px 0 5px;
}

.review-explanation{
  color:var(--stone);
  text-align:left;
  font-size:14px;
  margin-bottom:8px;
}

.mastered-box{
  padding:16px;
  border-radius:14px;
  background:rgba(76,175,125,.1);
  border:1px solid rgba(76,175,125,.3);
  color:#A6EAC1;
  text-align:left;
  margin-top:18px;
}

.home-btn{
  display:inline-block;
  margin-top:28px;
  padding:14px 25px;
  border-radius:14px;
  background:linear-gradient(
    135deg,
    var(--gold-dark),
    var(--gold)
  );
  color:var(--ink);
  font-weight:800;
  text-decoration:none;
}

button:focus-visible,
a:focus-visible{
  outline:3px solid #FFF1A8;
  outline-offset:3px;
}

@media(max-width:520px){

  .lesson-goals,
  .start-buttons{
    grid-template-columns:1fr;
  }

  .rule-table{
    font-size:12px;
  }

  .rule-table th,
  .rule-table td{
    padding:6px 4px;
  }

}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

/* =====================================================

===================================================== */

function shuffle(arr){

  const a=arr.slice();

  for(let i=a.length-1;i>0;i--){

    const j=
      Math.floor(
        Math.random()*(i+1)
      );

    [a[i],a[j]]=
      [a[j],a[i]];

  }

  return a;
}


function one(arr){

  return arr[
    Math.floor(
      Math.random()*arr.length
    )
  ];

}


function unique(arr){

  return arr.filter(
    (value,index,array)=>
      array.indexOf(value)===index
  );

}


function distractors(
  correct,
  values,
  amount=2
){

  return shuffle(
    unique(values)
      .filter(
        value=>value!==correct
      )
  ).slice(0,amount);

}

  const n=one(NOUNS);

  return makeQuestion(

function resetSkillStats(){

  skillStats={};

  Object.keys(
    SKILL_INFO
  ).forEach(function(skill){

    skillStats[skill]={
      attempts:0,
      correct:0
    };

  });

function recordSkill(
  skill,
  correct
){

  if(!skill){
    return;
  }

  if(!skillStats[skill]){
    return;
  }

  skillStats[skill].attempts++;

  if(correct){
    skillStats[skill].correct++;
  }

}

          Regeln lernen

          <small>
            Alle Erklärungen Schritt für Schritt
          </small>

        </button>


        <button
          type="button"
          class="start-btn training"
          id="trainingBtn">

          Direkt zum Training

          <small>
            Regeln überspringen und Wissen testen
          </small>

        </button>

      </div>

    </div>

  `;


  document.getElementById(
    "learnBtn"
  ).addEventListener(
    "click",
    function(){

      renderTeaching(0);

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

    }
  );


  document.getElementById(
    "trainingBtn"
  ).addEventListener(
    "click",
    function(){

      startTraining();

    }
  );

}


/* =====================================================
   LERNPHASE
===================================================== */

function renderTeaching(index){

  const main=
    document.getElementById(
      "mainContent"
    );

  const item=
    TEACHING[index];


  document.getElementById(
    "progressLabel"
  ).textContent=
    (index+1)+
    "/"+
    TEACHING.length;


  main.innerHTML=`

    <div class="teach-card">

      <div class="teach-head">

        <div class="teach-kicker">
          ${item.kicker}
        </div>

        <h2>
          ${item.title}
        </h2>

      </div>

      <div class="teach-body">
        ${item.body}
      </div>

    </div>

  `;


  const btn=
    document.createElement(
      "button"
    );

  btn.type=
    "button";

  btn.className=
    "continue-btn";


  if(
    index===
    TEACHING.length-1
  ){

    btn.textContent=
      "Jetzt trainieren →";


    btn.addEventListener(
      "click",
      startTraining
    );

  }

  else{

    btn.textContent=
      "Weiter →";


    btn.addEventListener(
      "click",
      function(){

        renderTeaching(
          index+1
        );

        window.scrollTo({
          top:0,
          behavior:"smooth"
        });

      }
    );

  }


  main.appendChild(
    btn
  );

}


/* =====================================================
   TRAINING STARTEN
===================================================== */

function startTraining(){

  session=
    buildSession();

  current=
    0;

  score=
    0;

  resetSkillStats();


  document.getElementById(
    "mainContent"
  ).style.display=
    "block";


  document.getElementById(
    "completionScreen"
  ).classList.remove(
    "visible"
  );


  renderQuestion();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =====================================================
   FRAGEN
===================================================== */

function renderQuestion(){

  if(
    current>=
    session.length
  ){

    showCompletion();

    return;
  }


  const q=
    session[current];


  document.getElementById(
    "progressLabel"
  ).textContent=
    (current+1)+
    "/"+
    session.length;


  const main=
    document.getElementById(
      "mainContent"
    );


  main.innerHTML=
    "";


  const card=
    document.createElement(
      "div"
    );

  card.className=
    "question-card";


  card.innerHTML=`

    <div class="q-theme">
      ${q.theme}
    </div>

    <div class="q-type-badge">
      Aufgabe ${current+1}
    </div>

    <div class="q-prompt">
      ${q.prompt}
    </div>

    <div class="q-sentence">
      ${q.sentence}
    </div>

    ${
      q.helper
      ?
      `<div class="q-helper">
        ${q.helper}
      </div>`
      :
      ""
    }

  `;


  const optionWrap=
    document.createElement(
      "div"
    );

  optionWrap.className=
    "options";


  const letters=
    ["A","B","C","D"];


  let answered=
    false;


  q.options.forEach(
    function(option,index){

      const btn=
        document.createElement(
          "button"
        );

      btn.type=
        "button";

      btn.className=
        "option-btn";


      btn.innerHTML=`

        <span class="option-letter">
          ${letters[index]}
        </span>

        <span>
          ${option}
        </span>

      `;


      btn.addEventListener(
        "click",
        function(){

          if(answered){
            return;
          }


          answered=
            true;


          const buttons=
            optionWrap.querySelectorAll(
              ".option-btn"
            );


          const ok=
            index===
            q.correct;


          recordSkill(
            q.skill,
            ok
          );


          if(ok){

            btn.classList.add(
              "correct"
            );

            score++;

          }

          else{

            btn.classList.add(
              "wrong"
            );

            buttons[
              q.correct
            ].classList.add(
              "correct"
            );

          }


          showFeedback(
            card,
            q,
            ok
          );

        }
      );


      optionWrap.appendChild(
        btn
      );

    }
  );


  card.appendChild(
    optionWrap
  );


  const feedback=
    document.createElement(
      "div"
    );

  feedback.id=
    "feedback";

  feedback.className=
    "feedback";


  card.appendChild(
    feedback
  );


  const next=
    document.createElement(
      "button"
    );

  next.type=
    "button";

  next.id=
    "nextBtn";

  next.className=
    "next-btn";


  next.textContent=
    current===
    session.length-1
      ?
      "Auswertung anzeigen ✓"
      :
      "Weiter →";


  next.addEventListener(
    "click",
    function(){

      current++;

      renderQuestion();

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

    }
  );


  card.appendChild(
    next
  );


  main.appendChild(
    card
  );

}


/* =====================================================
   FEEDBACK
===================================================== */

function showFeedback(
  card,
  q,
  ok
){

  const feedback=
    card.querySelector(
      "#feedback"
    );


  feedback.className=
    "feedback "+
    (
      ok
      ?
      "correct"
      :
      "wrong"
    );


  feedback.innerHTML=`

    <div class="feedback-title">
      ${
        ok
        ?
        "Richtig."
        :
        "Noch nicht richtig."
      }
    </div>

    <div>
      ${
        ok
        ?
        q.success
        :
        q.wrong
      }
    </div>

  `;


  card
    .querySelector(
      "#nextBtn"
    )
    .classList.add(
      "visible"
    );

}


/* =====================================================
   DIAGNOSE
===================================================== */

function buildDiagnosis(){

  const diagnosis=
    document.getElementById(
      "diagnosis"
    );


  const testedSkills=
    Object.keys(
      skillStats
    ).filter(
      skill=>
        skillStats[skill].attempts>0
    );


  const weakSkills=
    testedSkills.filter(
      skill=>{

        const stats=
          skillStats[skill];

        const accuracy=
          stats.correct/
          stats.attempts;

        /*
          Unter 80 % = noch einmal zeigen.
          Bei nur einer Aufgabe bedeutet ein Fehler
          automatisch Wiederholung.
        */

        return accuracy<0.8;

      }
    );


  let html=`

    <div class="diagnosis-title">
      Deine Regel-Diagnose
    </div>

    <div class="diagnosis-sub">
      Magistrella wertet die einzelnen Regelbereiche
      getrennt aus.
    </div>

  `;


  testedSkills.forEach(
    skill=>{

      const stats=
        skillStats[skill];

      const pct=
        Math.round(
          stats.correct/
          stats.attempts*
          100
        );

      const weak=
        pct<80;


      html+=`

        <div class="skill-result ${weak ? "weak" : "good"}">

          <span class="skill-name">
            ${SKILL_INFO[skill].name}
          </span>

          <span class="skill-score">
            ${stats.correct}/${stats.attempts}
          </span>

        </div>

      `;

    }
  );


  if(
    weakSkills.length===0
  ){

    html+=`

      <div class="mastered-box">

        <strong>
          Alle getesteten Regeln sind sicher.
        </strong>

        <br><br>

        Du musst jetzt keine Regelkarte erneut durcharbeiten.

      </div>

    `;

  }

  else{

    html+=`

      <div class="review-heading">
        Diese Regeln solltest du noch einmal ansehen
      </div>

      <div class="review-explanation">
        Es werden nur die Bereiche angezeigt,
        bei denen im Training noch Unsicherheit sichtbar war.
      </div>

    `;


    weakSkills.forEach(
      skill=>{

        html+=`

          <div class="review-card">

            <div class="review-head">

              <div class="review-kicker">
                Noch einmal ansehen
              </div>

              <h3>
                ${SKILL_INFO[skill].name}
              </h3>

            </div>

            <div class="review-body">
              ${SKILL_INFO[skill].review}
            </div>

          </div>

        `;

      }
    );

  }


  diagnosis.innerHTML=
    html;

}


/* =====================================================
   ABSCHLUSS
===================================================== */

function showCompletion(){

  document.getElementById(
    "mainContent"
  ).style.display=
    "none";


  document.getElementById(
    "progressLabel"
  ).textContent=
    "Fertig";


  const screen=
    document.getElementById(
      "completionScreen"
    );


  screen.classList.add(
    "visible"
  );


  const pct=
    Math.round(
      score/
      session.length*
      100
    );


  document.getElementById(
    "finalScore"
  ).textContent=
    score+
    "/"+
    session.length+
    " · "+
    pct+
    " %";


  document.getElementById(
    "finalStars"
  ).textContent=
    pct>=90
      ?
      "★★★"
      :
      pct>=70
        ?
        "★★"
        :
        "★";


  let msg;


  if(pct>=90){

    msg=
      "Sehr sicher. Schau unten trotzdem auf die Regel-Diagnose: Sie prüft die einzelnen Bereiche genauer als der Gesamtscore.";

  }

  else if(pct>=70){

    msg=
      "Gute Grundlage. Unten findest du automatisch genau die Regeln, bei denen im Training noch Fehler aufgetreten sind.";

  }

  else{

    msg=
      "Einige Grundlagen brauchen noch Wiederholung. Magistrella zeigt dir unten nur die Regelbereiche, die im Training noch unsicher waren.";

  }


  document.getElementById(
    "finalMsg"
  ).textContent=
    msg;


  buildDiagnosis();


  const oldBest=
    Number(
      localStorage.getItem(
        "magistrella-l01-best"
      )||0
    );


  if(pct>oldBest){

    localStorage.setItem(
      "magistrella-l01-best",
      pct
    );

  }


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =====================================================
   START
===================================================== */

renderIntro();

</script>
