<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>L01 · Singular & Plural · Erste Formen · Magistrella</title>

<style>
:root{
  --gold:#C9A84C;
  --gold-light:#E8C96A;
  --gold-dark:#8B6914;
  --ink:#1A1208;
  --ink-mid:#2A1F0E;
  --parchment:#F5EDD6;
  --parchment-dark:#E8D9B5;
  --stone:#968B78;
  --green-ok:#4CAF7D;
  --red-wrong:#E05050;
  --white:#FDFAF3;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  background:var(--ink);
  color:var(--parchment);
  min-height:100vh;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}

button{
  font:inherit;
}

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 16px;
  background:rgba(26,18,8,.96);
  backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(201,168,76,.2);
}

.back-btn{
  color:var(--gold);
  text-decoration:none;
  font-size:20px;
  padding:4px 8px 4px 0;
}

.topbar-info{
  flex:1;
}

.topbar-title{
  color:var(--gold-light);
  font-size:14px;
  font-style:italic;
}

.topbar-sub{
  color:var(--stone);
  font-size:12px;
}

.topbar-progress{
  color:var(--gold);
  font-weight:800;
  font-size:13px;
  min-width:55px;
  text-align:right;
}

/* =====================================================
   INTRO
===================================================== */

.lesson-intro{
  margin:16px;
  padding:18px;
  border:1px solid rgba(201,168,76,.25);
  border-radius:18px;
  background:linear-gradient(
    135deg,
    rgba(201,168,76,.12),
    rgba(201,168,76,.03)
  );
}

.lesson-kicker{
  color:var(--gold);
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:2px;
}

.lesson-intro h1{
  color:var(--gold-light);
  font-size:24px;
  line-height:1.25;
  margin:5px 0 10px;
}

.lesson-intro p{
  color:var(--parchment-dark);
  font-size:15px;
}

.lesson-goals{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px;
}

.goal-chip{
  background:rgba(0,0,0,.18);
  border:1px solid rgba(201,168,76,.16);
  border-radius:11px;
  padding:8px 10px;
  font-size:13px;
  color:var(--parchment-dark);
}

/* =====================================================
   STARTAUSWAHL
===================================================== */

.start-choice{
  margin:16px;
  padding:18px;
  border-radius:18px;
  background:var(--ink-mid);
  border:1px solid rgba(201,168,76,.18);
}

.start-choice h2{
  color:var(--gold-light);
  font-size:19px;
  margin-bottom:5px;
}

.start-choice p{
  color:var(--stone);
  font-size:14px;
  margin-bottom:15px;
}

.start-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.start-btn{
  min-height:64px;
  padding:12px;
  border-radius:14px;
  cursor:pointer;
  font-weight:800;
  border:1.5px solid var(--gold);
}

.start-btn.learn{
  background:linear-gradient(
    135deg,
    var(--gold-dark),
    var(--gold)
  );
  color:var(--ink);
}

.start-btn.training{
  background:rgba(201,168,76,.07);
  color:var(--gold-light);
}

.start-btn small{
  display:block;
  margin-top:3px;
  font-size:11px;
  font-weight:500;
  line-height:1.35;
  opacity:.85;
}

/* =====================================================
   LERNKARTEN
===================================================== */

.teach-card,
.review-card{
  margin:16px;
  border-radius:18px;
  overflow:hidden;
  background:var(--parchment);
  color:#2A1F0E;
  border:1px solid rgba(201,168,76,.55);
  text-align:left;
}

.teach-head,
.review-head{
  padding:13px 16px;
  background:var(--parchment-dark);
  border-bottom:1px solid rgba(90,60,10,.12);
}

.teach-kicker,
.review-kicker{
  color:#735108;
  text-transform:uppercase;
  font-size:11px;
  letter-spacing:2px;
  font-weight:800;
}

.teach-head h2,
.review-head h3{
  color:#2A1F0E;
  font-size:20px;
  line-height:1.3;
  margin-top:2px;
}

.teach-body,
.review-body{
  padding:16px;
  font-size:15px;
}

.teach-body p + p,
.review-body p + p{
  margin-top:10px;
}

.teach-body strong,
.review-body strong{
  color:#6C4B06;
}

.teach-example{
  margin-top:14px;
  padding:12px;
  background:rgba(255,255,255,.55);
  border-left:4px solid var(--gold-dark);
  border-radius:10px;
}

.teach-example .latin{
  font-size:17px;
  font-weight:800;
  font-style:italic;
  color:#2A1F0E;
}

.teach-example .german{
  margin-top:2px;
  color:#594931;
}

.mini-rule{
  margin-top:14px;
  padding:11px 12px;
  border:1px solid rgba(139,105,20,.25);
  border-radius:10px;
  background:#FFF9EA;
  color:#594006;
  font-weight:700;
}

/* =====================================================
   TABELLEN
===================================================== */

.rule-table{
  width:100%;
  border-collapse:collapse;
  margin-top:14px;
  font-size:14px;
}

.rule-table th{
  background:rgba(139,105,20,.13);
  color:#654807;
  padding:7px 7px;
  text-align:left;
  font-size:12px;
}

.rule-table td{
  color:#2E2110;
  padding:7px;
  border-bottom:1px solid rgba(80,55,5,.14);
  vertical-align:top;
}

.rule-table tr:last-child td{
  border-bottom:none;
}

.rule-highlight{
  color:#694A06 !important;
  font-weight:800;
}

/* =====================================================
   TRAINING
===================================================== */

.training-intro{
  margin:16px;
  padding:16px;
  border-radius:16px;
  border:1px solid rgba(201,168,76,.25);
  background:rgba(201,168,76,.07);
}

.training-intro h2{
  color:var(--gold-light);
  font-size:19px;
  margin-bottom:5px;
}

.training-intro p{
  color:var(--parchment-dark);
  font-size:14px;
}

.question-card{
  margin:16px;
  padding:20px;
  border-radius:20px;
  background:var(--ink-mid);
  border:1px solid rgba(201,168,76,.15);
  animation:slideUp .22s ease;
}

@keyframes slideUp{
  from{
    opacity:0;
    transform:translateY(14px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.q-theme{
  color:var(--gold);
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:2px;
  margin-bottom:8px;
}

.q-type-badge{
  display:inline-block;
  padding:4px 10px;
  border-radius:99px;
  background:rgba(201,168,76,.14);
  border:1px solid rgba(201,168,76,.28);
  color:var(--gold-light);
  font-size:12px;
  margin-bottom:12px;
}

.q-prompt{
  font-size:17px;
  color:var(--parchment);
  margin-bottom:14px;
}

.q-sentence{
  font-size:18px;
  color:var(--white);
  text-align:center;
  font-style:italic;
  background:rgba(0,0,0,.2);
  border-radius:12px;
  padding:13px;
  margin-bottom:16px;
}

.q-helper{
  color:var(--stone);
  font-size:13px;
  margin-top:-6px;
  margin-bottom:14px;
}

.options{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.option-btn{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 15px;
  border-radius:14px;
  border:1.5px solid rgba(201,168,76,.25);
  background:rgba(255,255,255,.04);
  color:#fff;
  cursor:pointer;
  text-align:left;
}

.option-btn.correct{
  background:rgba(76,175,125,.15);
  border-color:var(--green-ok);
  color:#9FE7BD;
}

.option-btn.wrong{
  background:rgba(224,80,80,.12);
  border-color:var(--red-wrong);
  color:#FFB6B6;
}

.option-letter{
  width:28px;
  height:28px;
  flex:0 0 28px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  background:rgba(201,168,76,.15);
  color:var(--gold-light);
  font-size:12px;
  font-weight:800;
}

.feedback{
  display:none;
  margin-top:14px;
  padding:14px;
  border-radius:14px;
  font-size:14px;
}

.feedback.correct{
  display:block;
  background:rgba(76,175,125,.12);
  border:1px solid rgba(76,175,125,.3);
  color:#91E2B3;
}

.feedback.wrong{
  display:block;
  background:rgba(224,80,80,.09);
  border:1px solid rgba(224,80,80,.28);
  color:#F2B0B0;
}

.feedback-title{
  font-weight:800;
  margin-bottom:5px;
}

/* =====================================================
   BUTTONS
===================================================== */

.continue-btn,
.next-btn{
  width:calc(100% - 32px);
  margin:12px 16px 16px;
  padding:15px;
  border:none;
  border-radius:14px;
  background:linear-gradient(
    135deg,
    var(--gold-dark),
    var(--gold)
  );
  color:var(--ink);
  font-weight:800;
  cursor:pointer;
}

.next-btn{
  width:100%;
  margin:14px 0 0;
  display:none;
}

.next-btn.visible{
  display:block;
}

/* =====================================================
   ABSCHLUSS + DIAGNOSE
===================================================== */

.completion{
  display:none;
  padding:32px 16px 45px;
}

.completion.visible{
  display:block;
}

.completion-main{
  text-align:center;
}

.completion-symbol{
  font-size:60px;
}

.completion-title{
  color:var(--gold-light);
  font-size:27px;
  margin-top:8px;
}

.completion-score{
  color:var(--gold);
  font-size:42px;
  font-weight:800;
  margin:14px 0;
}

.completion-stars{
  font-size:32px;
  margin-bottom:18px;
  letter-spacing:6px;
}

.completion-msg{
  color:var(--parchment-dark);
  max-width:560px;
  margin:0 auto 24px;
  font-size:15px;
}

.diagnosis{
  max-width:760px;
  margin:28px auto 0;
}

.diagnosis-title{
  color:var(--gold-light);
  font-size:21px;
  margin-bottom:6px;
  text-align:left;
}

.diagnosis-sub{
  color:var(--stone);
  font-size:14px;
  text-align:left;
  margin-bottom:14px;
}

.skill-result{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:10px 12px;
  margin-bottom:7px;
  border-radius:10px;
  background:rgba(255,255,255,.04);
  font-size:14px;
}

.skill-result.good{
  border-left:4px solid var(--green-ok);
}

.skill-result.weak{
  border-left:4px solid var(--red-wrong);
}

.skill-name{
  color:var(--parchment);
}

.skill-score{
  color:var(--stone);
  font-weight:700;
}

.review-heading{
  color:var(--gold-light);
  text-align:left;
  font-size:20px;
  margin:26px 0 5px;
}

.review-explanation{
  color:var(--stone);
  text-align:left;
  font-size:14px;
  margin-bottom:8px;
}

.mastered-box{
  padding:16px;
  border-radius:14px;
  background:rgba(76,175,125,.1);
  border:1px solid rgba(76,175,125,.3);
  color:#A6EAC1;
  text-align:left;
  margin-top:18px;
}

.home-btn{
  display:inline-block;
  margin-top:28px;
  padding:14px 25px;
  border-radius:14px;
  background:linear-gradient(
    135deg,
    var(--gold-dark),
    var(--gold)
  );
  color:var(--ink);
  font-weight:800;
  text-decoration:none;
}

button:focus-visible,
a:focus-visible{
  outline:3px solid #FFF1A8;
  outline-offset:3px;
}

@media(max-width:520px){

  .lesson-goals,
  .start-buttons{
    grid-template-columns:1fr;
  }

  .rule-table{
    font-size:12px;
  }

  .rule-table th,
  .rule-table td{
    padding:6px 4px;
  }

}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}

body > #mainContent, .completion {max-width:820px;margin:auto;}
.start-btn small{font-size:14px;}
.feedback.correct,.feedback.wrong{background:var(--parchment);color:var(--ink);border-width:2px;}
.result-section{margin:24px auto;padding:18px;border:1px solid rgba(201,168,76,.3);border-radius:18px;}
.result-section h2{font-size:22px;color:var(--gold-light);margin-bottom:14px;}
.correction{background:var(--parchment);color:var(--ink);padding:16px;border-radius:12px;margin:12px 0;overflow-wrap:anywhere;}
.result-actions{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0;}
.result-actions button{flex:1;min-width:180px;}
.review-card{margin:16px 0;}
.skill-score{color:var(--parchment);white-space:nowrap;}
input{display:block;width:100%;min-height:48px;font:inherit;margin:12px 0;padding:10px;border:2px solid var(--gold);border-radius:10px;}
.history-list{list-style:none;}.history-list li{padding:12px 0;border-bottom:1px solid var(--gold-dark);}
.rule-table{display:block;overflow-x:auto;font-size:14px;}
</style>
</head>

<script>
"use strict";


/* =====================================================
   DATEN
===================================================== */

const NOUNS = [

  {
    sg:"serva",
    pl:"servae",
    deSg:"die Sklavin / Dienerin",
    dePl:"die Sklavinnen / Dienerinnen",
    decl:"a-Deklination",
    genus:"f"
  },

  {
    sg:"domina",
    pl:"dominae",
    deSg:"die Herrin / Dame",
    dePl:"die Herrinnen / Damen",
    decl:"a-Deklination",
    genus:"f"
  },

  {
    sg:"victōria",
    pl:"victōriae",
    deSg:"der Sieg",
    dePl:"die Siege",
    decl:"a-Deklination",
    genus:"f"
  },

  {
    sg:"servus",
    pl:"servī",
    deSg:"der Sklave / Diener",
    dePl:"die Sklaven / Diener",
    decl:"o-Deklination",
    genus:"m"
  },

  {
    sg:"dominus",
    pl:"dominī",
    deSg:"der Herr",
    dePl:"die Herren",
    decl:"o-Deklination",
    genus:"m"
  },

  {
    sg:"equus",
    pl:"equī",
    deSg:"das Pferd",
    dePl:"die Pferde",
    decl:"o-Deklination",
    genus:"m"
  },

  {
    sg:"populus",
    pl:"populī",
    deSg:"das Volk",
    dePl:"die Völker",
    decl:"o-Deklination",
    genus:"m"
  },

  {
    sg:"frūmentum",
    pl:"frūmenta",
    deSg:"das Getreide",
    dePl:"Getreide",
    decl:"o-Deklination",
    genus:"n"
  },

  {
    sg:"fūrtum",
    pl:"fūrta",
    deSg:"der Diebstahl",
    dePl:"die Diebstähle",
    decl:"o-Deklination",
    genus:"n"
  },

  {
    sg:"mercātor",
    pl:"mercātōrēs",
    deSg:"der Kaufmann / Händler",
    dePl:"die Kaufleute / Händler",
    decl:"3. Deklination",
    genus:"m"
  },

  {
    sg:"victor",
    pl:"victōrēs",
    deSg:"der Sieger",
    dePl:"die Sieger",
    decl:"3. Deklination",
    genus:"m"
  },

  {
    sg:"clāmor",
    pl:"clāmōrēs",
    deSg:"der Lärm / das Geschrei",
    dePl:"die Rufe / das Geschrei",
    decl:"3. Deklination",
    genus:"m"
  }

];


const VERBS = [

  {inf:"cōgitāre",sg:"cōgitat",pl:"cōgitant",de:"denken / nachdenken / beabsichtigen"},
  {inf:"venīre",sg:"venit",pl:"veniunt",de:"kommen"},
  {inf:"stāre",sg:"stat",pl:"stant",de:"stehen / dastehen"},
  {inf:"spectāre",sg:"spectat",pl:"spectant",de:"anschauen / betrachten / zuschauen"},
  {inf:"clāmāre",sg:"clāmat",pl:"clāmant",de:"laut rufen / schreien"},
  {inf:"tacēre",sg:"tacet",pl:"tacent",de:"schweigen"},
  {inf:"vidēre",sg:"videt",pl:"vident",de:"sehen"},
  {inf:"gaudēre",sg:"gaudet",pl:"gaudent",de:"sich freuen"},
  {inf:"rīdēre",sg:"rīdet",pl:"rīdent",de:"lachen / auslachen"},
  {inf:"rogāre",sg:"rogat",pl:"rogant",de:"fragen / bitten (um)"},
  {inf:"amāre",sg:"amat",pl:"amant",de:"lieben / gernhaben"}

];


// Vollständiger Verbwortschatz aus dem Vokabelheft, L01, Seiten 4–6.
// Sonderverben bleiben außerhalb der Generatoren für regelmäßige Verbendungen.
const VOCAB_VERBS = [
  ...VERBS,
  {inf:"esse",sg:"est",pl:"sunt",de:"sein / sich befinden"},
  {inf:"adesse",sg:"adest",pl:"adsunt",de:"da sein / helfen"},
  {inf:"dēbēre",sg:"dēbet",pl:"dēbent",de:"müssen / sollen / schulden"}
];

const SMALL_VOCAB = [

  {lat:"ubi?",de:"wo?"},
  {lat:"nōn",de:"nicht"},
  {lat:"et",de:"und / auch"},
  {lat:"sed",de:"aber / sondern"},
  {lat:"nunc",de:"jetzt / nun"},
  {lat:"etiam",de:"auch / sogar"},
  {lat:"undique",de:"von allen Seiten / von überallher"},
  {lat:"quis?",de:"wer?"},
  {lat:"hīc",de:"hier"},
  {lat:"ibi",de:"dort"},
  {lat:"cūr?",de:"warum?"}

];


/* =====================================================
   REGEL-DIAGNOSE

   Jede Trainingsfrage erhält einen skill-Wert.
===================================================== */

const SKILL_INFO = {
  nounVocab:{name:"Nomen-Vokabeln"},
  verbVocab:{name:"Verb-Vokabeln"},
  smallVocab:{name:"Kleine Wörter"},

  number:{
    name:"Singular und Plural",
    review:`
      <p>
        <strong>Singular</strong> bedeutet Einzahl,
        <strong>Plural</strong> Mehrzahl.
      </p>

      <table class="rule-table">
        <tr>
          <th>Singular</th>
          <th>Deutsch</th>
          <th>Plural</th>
          <th>Deutsch</th>
        </tr>

        <tr>
          <td class="rule-highlight">serva</td>
          <td>die Sklavin</td>
          <td class="rule-highlight">servae</td>
          <td>die Sklavinnen</td>
        </tr>

        <tr>
          <td class="rule-highlight">servus</td>
          <td>der Sklave</td>
          <td class="rule-highlight">servī</td>
          <td>die Sklaven</td>
        </tr>

        <tr>
          <td class="rule-highlight">frūmentum</td>
          <td>das Getreide</td>
          <td class="rule-highlight">frūmenta</td>
          <td>Getreide</td>
        </tr>
      </table>

      <div class="mini-rule">
        Achte auf die Endung:
        Sie zeigt häufig, ob ein Wort im Singular
        oder Plural steht.
      </div>
    `
  },


  declension:{
    name:"Deklinationsklassen",
    review:`
      <p>
        Wörter, die ihre Formen nach demselben Muster bilden,
        gehören zu einer
        <strong>Deklinationsklasse</strong>.
      </p>

      <table class="rule-table">
        <tr>
          <th>Klasse</th>
          <th>Singular</th>
          <th>Deutsch</th>
          <th>Plural</th>
        </tr>

function shuffle(arr){

  const a=arr.slice();

  for(let i=a.length-1;i>0;i--){

    const j=
      Math.floor(
        Math.random()*(i+1)
      );

    [a[i],a[j]]=
      [a[j],a[i]];

  }

  return a;
}


function one(arr){

  return arr[
    Math.floor(
      Math.random()*arr.length
    )
  ];

}


function unique(arr){

  return arr.filter(
    (value,index,array)=>
      array.indexOf(value)===index
  );

}


function distractors(
  correct,
  values,
  amount=2
){

  return shuffle(
    unique(values)
      .filter(
        value=>value!==correct
      )
  ).slice(0,amount);

}

    "Welche Form passt?",
    sentence,
    "venīre = kommen · dēbēre = müssen / sollen",
    opts,
    opts.indexOf(correct),
    plural
      ? "Servī venīre dēbent. = Die Sklaven müssen kommen."
      : "Servus venīre dēbet. = Der Sklave muss kommen.",
    plural
      ? "Servī steht im Plural. Deshalb: dēbent."
      : "Servus steht im Singular. Deshalb: dēbet."
  );

}


function qDebereTranslation(){

  const opts=shuffle([
    "Der Sklave muss schweigen.",
    "Der Sklave schweigt.",
    "Die Sklaven müssen schweigen."
  ]);

  return makeQuestion(
    "debere",
    "Latein → Deutsch",
    "Welche Übersetzung ist richtig?",
    "Servus tacēre dēbet.",
    "servus = der Sklave · tacēre = schweigen · dēbet = er muss",
    opts,
    opts.indexOf(
      "Der Sklave muss schweigen."
    ),
    "Richtig: Der Sklave muss schweigen.",
    "dēbet + Infinitiv wird hier mit „muss …“ übersetzt."
  );

}


function qSmallVocab(){

  const v=one(SMALL_VOCAB);

  const wrong=distractors(
    v.de,
    SMALL_VOCAB.map(x=>x.de),
    2
  );

  const opts=shuffle([
    v.de,
    ...wrong
  ]);

  return makeQuestion(
    "smallVocab",
    "Vokabel",
    "Was bedeutet dieses Wort?",
    v.lat,
    "",
    opts,
    opts.indexOf(v.de),
    v.lat+" bedeutet „"+v.de+"“.",
    "Die richtige Bedeutung ist „"+v.de+"“."
  );

}


/* =====================================================
   SESSION
===================================================== */

function buildSession(){

  return [

    qMeaningNoun(),

    qPlural(),
    qSingular(),

    qDeclension(),
    qDeclension(),

    qGenus(),

    qVerbMeaning(),

    qEnding(),
    qProduction(),

    qKongruenz(),
    qKongruenz(),

    qEsse(),

    qInfinitiv(),
    qVerbMeaning(),

    qDebere(),
    qDebereTranslation(),

    qSmallVocab(),

    Math.random()>.5
      ? qPlural()
      : qVerbNumber()

  ];

}


// Full training and practice have independent state; completed results are snapshots.
let currentSession=null;
let practiceSession=null;
let lastFullResult=null;
const HISTORY_KEY="magistrella-l01-history-v1";
const BEST_KEY="magistrella-l01-best";
let storageMessage="";
function readStored(key){try{return localStorage.getItem(key);}catch{return null;}}
function writeStored(key,value){try{localStorage.setItem(key,value);return true;}catch{storageMessage="Dein Browser kann den Verlauf gerade nicht speichern. Dieses Ergebnis bleibt während dieser geöffneten Seite sichtbar.";return false;}}
function readHistory(){
  try {const data=JSON.parse(readStored(HISTORY_KEY)||"[]");
    return Array.isArray(data)?data.filter(r=>r && r.lesson==="L01" && Number.isInteger(r.total) && r.total>0 && Number.isInteger(r.correct) && r.correct>=0 && r.correct<=r.total && r.percentage===Math.round(r.correct/r.total*100) && Number.isFinite(Date.parse(r.completedAt))):[];
  }catch{return [];}
}
let history=readHistory();
function activeSession(){return practiceSession || currentSession;}
function newSession(type,questions){
  if(!questions.length || questions.some(q=>!SKILL_INFO[q.skill])) throw new Error("Frage ohne Diagnose");
  return {type,startedAt:new Date().toISOString(),questions,current:0,score:0,total:questions.length,skillStats:{},wrongAnswers:[],answered:false,completed:false};
}
function recordAnswer(q,answer,ok){
  const run=activeSession();
  if(run.answered || run.completed) return false;
  run.answered=true;
  const stats=run.skillStats[q.skill] ||= {attempts:0,correct:0};
  stats.attempts++;
  if(ok){stats.correct++;run.score++;}
  else run.wrongAnswers.push({skill:q.skill,prompt:q.prompt,sentence:q.sentence,answer,correctAnswer:q.options[q.correct],explanation:q.success+" "+q.wrong,question:JSON.parse(JSON.stringify(q))});
  return true;
}
function escapeHTML(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normalizeAnswer(value){return value.normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase();}
function qProduction(){
  const q=qVerbNumber();q.input=true;
  q.prompt=q.prompt.replace("Welche Form steht in der", "Bilde die Form in der").replace("?", ".");
  q.helper += " Schreibe die Form. Längezeichen sind freiwillig.";
  return q;
}
function buildPractice(result){
  const generators={number:qPlural,declension:qDeclension,genus:qGenus,verbNumber:qProduction,kongruenz:qKongruenz,esse:qEsse,infinitive:qInfinitiv,debere:qDebere};
  return result.wrongAnswers.map(error=>{
    const old=error.question;
    if(!SKILL_INFO[error.skill].review){
      // Reverse direction while preserving the exact missed vocabulary item.
      const pool=error.skill==="nounVocab"?NOUNS.map(n=>n.sg):error.skill==="verbVocab"?VOCAB_VERBS.map(v=>v.inf):SMALL_VOCAB.map(v=>v.lat);
      const opts=shuffle([old.sentence,...distractors(old.sentence,pool)]);
      return makeQuestion(error.skill,"Deine Fehler üben","Welches lateinische Wort bedeutet das?",error.correctAnswer,"",opts,opts.indexOf(old.sentence),old.sentence+" – "+error.correctAnswer,error.explanation);
    }
    let q;
    // Select the exact noun pattern deterministically before randomizing an example.
    const source=NOUNS.find(n=>old.sentence.startsWith(n.sg)||old.sentence.startsWith(n.pl));
    if(source && ['number','declension','genus'].includes(error.skill)){
      const alternatives=NOUNS.filter(n=>n!==source && n.decl===source.decl && n.genus===source.genus);
      q=generators[error.skill](alternatives.length?one(alternatives):source);
    }else{
      for(let i=0;i<30;i++){
        q=generators[error.skill]();
        if(q.sentence!==old.sentence) break;
      }
    }
    q.prompt="Noch einmal anwenden: "+q.prompt;
    return q;
  });
}

function startTraining(){
  practiceSession=null;
  currentSession=newSession("full",buildSession());
  openTraining();
}
function startPractice(){
  if(!lastFullResult || !lastFullResult.wrongAnswers.length) return;
  practiceSession=newSession("practice",buildPractice(lastFullResult));
  openTraining();
}
function openTraining(){
  document.getElementById("mainContent").style.display="block";
  document.getElementById("completionScreen").classList.remove("visible");
  renderQuestion();window.scrollTo({top:0,behavior:"smooth"});
}
function renderQuestion(){
  const run=activeSession();
  if(run.current>=run.total){showCompletion();return;}
  run.answered=false;
  const q=run.questions[run.current];
  document.getElementById("progressLabel").textContent=(run.type==="practice"?"Üben ":"")+(run.current+1)+"/"+run.total;
  const main=document.getElementById("mainContent");
  main.innerHTML=`${run.type==="practice"?'<div class="training-intro"><h2>Nur meine Fehler trainieren</h2><p>Diese Übungsrunde verändert dein vollständiges Training nicht.</p><button class="start-btn training" id="returnResult">Zum vollständigen Ergebnis</button></div>':''}<div class="question-card"><div class="q-theme">${q.theme}</div><div class="q-type-badge">Aufgabe ${run.current+1}</div><div class="q-prompt">${q.prompt}</div><div class="q-sentence">${q.sentence}</div><div class="q-helper">${q.helper}</div><div class="options"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><button type="button" id="nextBtn" class="next-btn">${run.current===run.total-1?'Auswertung anzeigen ✓':'Weiter →'}</button></div>`;
  if(run.type==="practice") document.getElementById("returnResult").onclick=()=>renderFullResult();
  const card=main.querySelector(".question-card"), wrap=card.querySelector(".options");
  function submit(answer,ok){
    if(!recordAnswer(q,answer,ok)) return;
    wrap.querySelectorAll("button,input").forEach(el=>el.disabled=true);
    wrap.querySelectorAll(".option-btn").forEach((el,i)=>{if(i===q.correct) el.classList.add("correct");else if(el.textContent===answer) el.classList.add("wrong");});
    showFeedback(card,q,ok);
  }
  if(q.input){
    wrap.innerHTML='<form><label for="formAnswer">Deine Verbform</label><input id="formAnswer" autocomplete="off" autocapitalize="none" spellcheck="false" required><button class="start-btn learn" type="submit">Antwort prüfen</button></form>';
    wrap.querySelector("form").onsubmit=e=>{e.preventDefault();const value=wrap.querySelector("input").value;if(value.trim()) submit(value,normalizeAnswer(value)===normalizeAnswer(q.options[q.correct]));};
  }else q.options.forEach((option,i)=>{
    const btn=document.createElement("button");btn.type="button";btn.className="option-btn";btn.textContent=option;
    btn.onclick=()=>submit(option,i===q.correct);wrap.appendChild(btn);
  });
  document.getElementById("nextBtn").onclick=()=>{if(!run.answered)return;run.current++;renderQuestion();window.scrollTo({top:0,behavior:"smooth"});};
}

/* =====================================================
   DIAGNOSE
===================================================== */

function completeFullSession(){
  const run=currentSession;
  if(run.completed) return lastFullResult;
  const stats=Object.values(run.skillStats);
  if(run.current!==run.total || stats.reduce((n,s)=>n+s.attempts,0)!==run.total || stats.reduce((n,s)=>n+s.correct,0)!==run.score || run.wrongAnswers.length!==run.total-run.score) throw new Error("Unvollständige Trainingsdiagnose");
  const completedAt=new Date().toISOString();
  const result=JSON.parse(JSON.stringify({id:globalThis.crypto?.randomUUID?.() || completedAt+"-"+Math.random().toString(36).slice(2),lesson:"L01",startedAt:run.startedAt,completedAt,correct:run.score,total:run.total,percentage:Math.round(run.score/run.total*100),skillStats:run.skillStats,wrongAnswers:run.wrongAnswers}));
  run.completed=true;lastFullResult=result;
  // Re-read to retain completed runs from another open tab when possible.
  const existing=readHistory();
  history=[...existing,...history.filter(r=>!existing.some(e=>e.id===r.id)),result];
  writeStored(HISTORY_KEY,JSON.stringify(history));
  const best=Math.max(Number(readStored(BEST_KEY))||0,...history.map(r=>r.percentage));
  writeStored(BEST_KEY,String(best));
  return result;
}
function buildDiagnosis(result){
  const rows=Object.entries(result.skillStats).map(([skill,s])=>`<div class="skill-result ${s.correct===s.attempts?'good':'weak'}"><span>${escapeHTML(SKILL_INFO[skill].name)}</span><span class="skill-score">${s.correct===s.attempts?'✓':'Üben'} · ${s.correct}/${s.attempts}</span></div>`).join('');
  const errors=result.wrongAnswers.map(e=>`<article class="correction"><strong>${escapeHTML(SKILL_INFO[e.skill].name)}</strong><p>${escapeHTML(e.prompt)}</p><p>${escapeHTML(e.sentence)}</p><p>Deine Antwort: ${escapeHTML(e.answer)}</p><p><strong>Richtig: ${escapeHTML(e.correctAnswer)}</strong></p><p>${escapeHTML(e.explanation)}</p></article>`).join('');
  const grammar=[...new Set(result.wrongAnswers.map(e=>e.skill))].filter(skill=>SKILL_INFO[skill].review);
  const cards=grammar.map(skill=>`<article class="review-card"><div class="review-head"><h3>${SKILL_INFO[skill].name}</h3></div><div class="review-body">${SKILL_INFO[skill].review}</div></article>`).join('');
  return `<section class="result-section"><h2>Deine Diagnose</h2><p>Alle ${result.total} Antworten aus diesem Training.</p>${rows}${errors?'<h3 class="review-heading">Deine Antworten verbessern</h3>'+errors:'<p class="mastered-box">✓ Alle Antworten richtig!</p>'}${cards?'<h3 class="review-heading">Diese Regeln helfen dir weiter</h3>'+cards:''}</section>`;
}
function vocabularyHTML(){
  const entries=[
    ...NOUNS.map(n=>({latin:n.sg,meaning:n.deSg,form:n.genus})),
    ...VOCAB_VERBS.map(v=>({latin:v.inf,meaning:v.de,form:v.sg})),
    ...SMALL_VOCAB.map(v=>({latin:v.lat,meaning:v.de,form:""}))
  ];
  return `<details class="teach-card"><summary class="teach-head" style="cursor:pointer;min-height:48px"><strong>Alle ${entries.length} Vokabeln aus L01 ansehen</strong></summary><div class="teach-body"><p>Abgeglichen mit deinem Vokabelheft, Seiten 4–6. Bei Nomen steht das Genus dabei, bei Verben die 3. Person Singular.</p><p>Die Bedeutungen passen je nach Satz. Ein vollständiges Training enthält eine Auswahl. 100 % im Training bedeutet: alle 18 Aufgaben dieses Durchlaufs richtig.</p><table class="rule-table"><tr><th>Latein</th><th>Genus / Form</th><th>Deutsch</th></tr>${entries.map(e=>`<tr><td>${escapeHTML(e.latin)}</td><td>${escapeHTML(e.form)}</td><td>${escapeHTML(e.meaning)}</td></tr>`).join('')}</table></div></details>`;
}
function historyHTML(){
  if(!history.length)return '';
  const recent=history.slice().sort((a,b)=>Date.parse(b.completedAt)-Date.parse(a.completedAt));
  const best=Math.max(Number(readStored(BEST_KEY))||0,...history.map(r=>r.percentage));
  return `<section class="result-section"><h2>Dein Verlauf</h2><p>Letztes Training: <strong>${recent[0].percentage} %</strong><br>Bestwert: <strong>${best} %</strong><br>Vollständige Trainings: <strong>${history.length}</strong></p><ul class="history-list">${recent.map(r=>`<li>${escapeHTML(new Date(r.completedAt).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'}))} · <strong>${r.correct}/${r.total} · ${r.percentage} %</strong></li>`).join('')}</ul></section>`;
}
function showCompletion(){
  if(activeSession().type==='practice'){
    practiceSession.completed=true;
    renderFullResult(`Übungsrunde beendet: ${practiceSession.score}/${practiceSession.total} richtig. Dein vollständiges Ergebnis bleibt unverändert.`);
  }else{completeFullSession();renderFullResult();}
}
function renderFullResult(practiceMessage=''){
  const r=lastFullResult;if(!r)return;
  document.getElementById('mainContent').style.display='none';
  document.getElementById('progressLabel').textContent='Fertig';
  const screen=document.getElementById('completionScreen');screen.classList.add('visible');
  screen.innerHTML=`${practiceMessage?`<p class="training-intro" role="status">${escapeHTML(practiceMessage)}</p>`:''}<section class="result-section completion-main"><h2>Dieses Training</h2><div class="completion-title">${r.percentage===100?'PERFECTUM!':'L01 geschafft!'}</div><div class="completion-score">${r.correct} / ${r.total}<br>${r.percentage} %</div><p>Singular · Plural · erste Formen</p><div class="result-actions"><button class="start-btn learn" id="shareResult">Ergebnis teilen</button><button class="start-btn training" id="saveResult">Bild speichern</button></div><p id="shareStatus" role="status"></p></section>${buildDiagnosis(r)}<section class="result-section"><h2>Wie möchtest du weiterlernen?</h2><div class="result-actions">${r.wrongAnswers.length?'<button class="start-btn learn" id="practiceErrors">Nur meine Fehler trainieren</button>':''}<button class="start-btn training" id="restartFull">Alles noch einmal trainieren</button></div><a class="home-btn" href="../index.html">← Zurück zur Übersicht</a></section>${historyHTML()}${storageMessage?`<p role="status">${escapeHTML(storageMessage)}</p>`:''}`;
  document.getElementById('restartFull').onclick=startTraining;
  if(r.wrongAnswers.length)document.getElementById('practiceErrors').onclick=startPractice;
  document.getElementById('shareResult').onclick=()=>shareResult(r);
  document.getElementById('saveResult').onclick=()=>saveResult(r);
  window.scrollTo({top:0,behavior:'smooth'});
}
// Local Canvas only: no learner data, external artwork, fonts or requests.
function createShareCanvas(result){
  const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1080;
  const ctx=canvas.getContext('2d');if(!ctx)throw new Error('Canvas nicht verfügbar');
  ctx.fillStyle='#1A1208';ctx.fillRect(0,0,1080,1080);
  ctx.strokeStyle='#C9A84C';ctx.lineWidth=3;ctx.strokeRect(40,40,1000,1000);ctx.strokeRect(54,54,972,972);
  ctx.textAlign='center';ctx.fillStyle='#E8C96A';
  ctx.font='bold 58px Georgia, serif';ctx.fillText('MAGISTRELLA',540,170);
  ctx.fillStyle='#F5EDD6';ctx.font='32px sans-serif';ctx.fillText('Latein-Training',540,230);
  ctx.font='bold 52px Georgia, serif';ctx.fillText('L01 geschafft!',540,350);
  ctx.fillStyle='#E8C96A';ctx.font='bold 130px sans-serif';ctx.fillText(`${result.correct} / ${result.total}`,540,535);
  ctx.font='bold 100px sans-serif';ctx.fillText(`${result.percentage} %`,540,675);
  if(result.percentage===100){ctx.font='bold 36px Georgia, serif';ctx.fillText('PERFECTUM!',540,760);}
  ctx.fillStyle='#F5EDD6';ctx.font='30px sans-serif';ctx.fillText('Singular · Plural · erste Formen',540,860);
  ctx.font='28px sans-serif';ctx.fillText(new Date(result.completedAt).toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'}),540,945);
  return canvas;
}
function shareBlob(r){return new Promise((resolve,reject)=>{try{createShareCanvas(r).toBlob(blob=>blob?resolve(blob):reject(new Error('PNG konnte nicht erstellt werden')),'image/png');}catch(e){reject(e);}});}
function downloadBlob(blob,r){
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Magistrella-L01-${r.completedAt.slice(0,10)}.png`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
}
async function saveResult(r){try{downloadBlob(await shareBlob(r),r);document.getElementById('shareStatus').textContent='Dein Ergebnisbild wurde zum Speichern bereitgestellt.';}catch{document.getElementById('shareStatus').textContent='Das Bild konnte nicht erstellt werden. Bitte versuche es erneut.';}}
async function shareResult(r){
  try{
    const blob=await shareBlob(r);
    const file=typeof File==='function'?new File([blob],'Magistrella-L01.png',{type:'image/png'}):null;
    if(file && navigator.share && navigator.canShare?.({files:[file]})){
      try{await navigator.share({files:[file],title:'Magistrella · L01'});return;}catch(e){if(e.name==='AbortError')return;}
    }
    downloadBlob(blob,r);document.getElementById('shareStatus').textContent='Teilen ist hier nicht verfügbar. Dein Bild wurde zum Speichern bereitgestellt.';
  }catch{document.getElementById('shareStatus').textContent='Bitte nutze „Bild speichern“ oder versuche es erneut.';}
}
