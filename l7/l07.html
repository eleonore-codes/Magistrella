<style>

.continue-btn,

.diagnosis{

.review-explanation{

.mastered-box{

.home-btn{

button:focus-visible,
a:focus-visible{
  outline:3px solid #FFF1A8;

@media(max-width:520px){

const VOCAB=[['surgere','surgō','aufstehen, sich erheben'],['capere','capiō','nehmen, ergreifen, fangen, erobern'],['aedēs','aedium f Pl.','das Haus, das Gebäude'],['aspicere','aspiciō','erblicken, ansehen'],['mulier','mulieris f','die Frau'],['ōrāre','ōrō','bitten, beten'],['māter','mātris f','die Mutter'],['dea','deae f','die Göttin'],['currere','currō','laufen, eilen'],['agere','agō','handeln, treiben, verhandeln'],['familia','familiae f','die Familie, die Hausgemeinschaft'],['cōnsulere','cōnsulō m. Dat.','sorgen für'],['senex','senis m','der Greis, der alte Mann'],['cupere','cupiō','wollen, wünschen, verlangen'],['facere','faciō','machen, tun, handeln'],['igitur','Adv.','also, folglich'],['mēcum','~ cum mē','mit mir'],['placēre','placeō','gefallen'],['gerere','gerō','führen, ausführen, tragen'],['vīvere','vīvō','leben'],['mittere','mittō','schicken, werfen'],['vōbīs','Dat.','euch'],['patēre','pateō','offen stehen, sich erstrecken'],['iubēre','iubeō (m. Akk.)','anordnen, befehlen'],['gēns','gentis f; Gen. Pl. gentium','der Stamm, die Familie, das Volk'],['dare','dō','geben'],['prīmō','Adv.','zuerst'],['prō','Präp. m. Abl.','vor; anstelle von, für'],['sīgnum','sīgnī n','das Zeichen, das Merkmal'],['grātia','grātiae f','das Ansehen, die Beliebtheit, der Dank'],['grātiās agere','grātiās agō','danken']].map(([lat,info,de])=>({lat,info,de}));

const TEACHING=[
{title:'Dativ: wem gilt die Handlung?',body:'<p>Der Dativ ist der 3. Fall. Substantive werden dekliniert: Ihre Endung zeigt Fall und Anzahl. Nach einem Dativobjekt fragen wir „wem?“.</p><p>Amīcus mātrī adest. – Der Freund hilft seiner Mutter.<br>Wem hilft er? mātrī – seiner Mutter.</p><p>Servus mercātōrī frūmentum portat. – Der Sklave bringt dem Kaufmann das Getreide. mercātōrī ist das Dativobjekt (wem?), frūmentum das Akkusativobjekt (wen oder was?). Das Verb bestimmt, welche Objekte passen.</p>'},
{title:'Dativformen bilden',body:'<p>Deklinationen sind Gruppen von Substantiven mit ähnlichen Endungen. Im Dativ Singular hat die a-Deklination -ae, die o-Deklination -ō und die 3. Deklination -ī.</p>'+table([['Gruppe','Dativ Singular','Dativ Plural'],['a','servae – der Sklavin','servīs – den Sklavinnen'],['o, männlich','servō – dem Sklaven','servīs – den Sklaven'],['o, sächlich','forō – dem Marktplatz','forīs – den Marktplätzen'],['3. Deklination','victōrī – dem Sieger','victōribus – den Siegern']])+'<p>Dativ und Ablativ sind im Plural gleich. Auch servō kann Dativ oder Ablativ Singular sein. servae kann Dativ oder Genitiv Singular oder Nominativ Plural sein. Entscheide anhand des Satzes.</p>'},
{title:'Den Wortstamm der 3. Deklination finden',body:'<p>Der Nominativ zeigt den Stamm oft nicht deutlich. Lerne den Genitiv mit und streiche -is: mātris → mātr-. Dann ergänze die gewünschte Endung: mātr-ī.</p>'+table([['Nominativ','Genitiv','Stamm'],...STEMS.map(n=>[n[0],n[1],n[2]+'-'])])+'<p>senex wird also senī (dem alten Mann), nicht senexī. gēns hat den Genitiv Plural gentium; aedēs ist ein Pluralwort mit dem Genitiv aedium.</p>'},
{title:'Dativ oder ein anderer Fall?',body:'<p>Lerne die lateinische Konstruktion mit: familiae cōnsulere – für die Familie sorgen. cōnsulere verlangt hier den Dativ, auch wenn die deutsche Übersetzung „für“ enthält.</p><p>Cōnsilium patrī nōn placet. – Der Plan gefällt dem Vater nicht.<br>Via vōbīs patet. – Der Weg steht euch offen.</p><p>Anders: iubēre steht mit Akkusativ. prō steht mit Ablativ: prō amīcō dīcere – für den Freund sprechen; prō aedificiō stāre – vor dem Gebäude stehen.</p>'},
{title:'Der Dativ des Besitzers',body:'<p>Mit est oder sunt kann ein Dativ anzeigen, wer etwas besitzt. Mercātōrī taberna est. – Der Kaufmann hat einen Laden. Wörtlich: Dem Kaufmann ist ein Laden zu eigen.</p><p>Der Besitzer steht lateinisch im Dativ. Das besessene Ding steht im Nominativ und bestimmt est (Einzahl) oder sunt (Mehrzahl).</p><p>Mercātōrī tabernae sunt. – Der Kaufmann hat Läden.</p><p>Das Heft nennt den Dativ hier Prädikatsnomen: Zusammen mit esse bildet er das Prädikat. Im Deutschen übersetzen wir meist mit „haben“ oder „besitzen“.</p>'},
{title:'capere: konsonantische Konjugation mit i-Erweiterung',body:'<p>Verben werden konjugiert. Einige Verben der konsonantischen Konjugation haben ein kurzes i im Stamm. Sie ähneln der ī-Konjugation, haben aber einen Infinitiv auf -ere: capere, capiō.</p>'+table([['Person','Latein','Deutsch'],...VERBS[0].slice(1).map((f,i)=>[PERSON[i],f,['ich nehme','du nimmst','er / sie / es nimmt','wir nehmen','ihr nehmt','sie nehmen'][i]])])+'<p>Aufforderung an eine Person: cape! – nimm! An mehrere: capite! – nehmt! Der Imperativ ist die Aufforderungsform.</p><p>Auch aspicere, cupere und facere gehören zu dieser Gruppe: aspiciunt, cupiunt, faciunt.</p>'},
{title:'Konjugationen vergleichen und genau lesen',body:table([['Infinitiv / Klasse','ich','er / sie / es','sie (Plural)'],['vocāre · ā','vocō','vocat','vocant'],['gaudēre · ē','gaudeō','gaudet','gaudent'],['audīre · ī','audiō','audit','audiunt'],['currere · konsonantisch','currō','currit','currunt'],['facere · mit i-Erweiterung','faciō','facit','faciunt']])+'<p>Aenēās gladium capit. – Äneas ergreift das Schwert.<br>Aenēās familiam servāre cupit. – Äneas will seine Familie retten.</p><p>Unterscheide: agere – handeln, treiben, verhandeln; facere – machen, tun, handeln; gerere – führen, ausführen, tragen.</p><p>cōnsilium capere – einen Plan fassen; templum facere – einen Tempel bauen; grātiās agere – danken. mēcum = mit mir, vōbīs = euch (Dativ).</p>'},
{title:'Übersicht: Substantive deklinieren',body:'<p>Die Fragen helfen bei der Übersetzung. Genitiv: des / der; Dativ: dem / der / den; Akkusativ: den / die / das. Beim Ablativ ergänzt du je nach Zusammenhang beispielsweise „mit“.</p>'+overview()+'<p>Die a-Deklination ist meist weiblich, die o-Deklination auf -us meist männlich. Bei sächlichen Wörtern wie forum sind Nominativ und Akkusativ gleich. Der Vokativ ist die Anrede: serve! – Sklave!; Plural servī! In den anderen hier gezeigten Mustern entspricht er dem Nominativ.</p>'},
{title:'Texte erschließen und Prüfungen vorbereiten',body:'<p>Suche Schlüsselwörter und Wort- oder Sachfelder. Sammle Informationen zu Personen: Auch Pronomen und Verbendungen verraten, wer handelt.</p><p>Konnektoren verbinden Gedanken: et – und; prīmō, tum, iam, nunc, dēnique ordnen zeitlich; nam begründet; sed und autem zeigen einen Gegensatz; igitur bedeutet also, folglich.</p><p>Berichte enthalten oft Aussagesätze und Formen der 3. Person. Dialoge wechseln Personen und enthalten Fragen, Ausrufe, Imperative und Anreden. Erzählungen können beides verbinden.</p><p>Beginne etwa eine Woche vor der Prüfung. Wiederhole Vokabeln, Grammatik und korrigierte Übersetzungen in kleinen Portionen. Arbeite vom neuen Stoff rückwärts. Am letzten Tag nichts Neues.</p>'+table([['Tag','Wörter','Grammatik / Übung'],['1','L07','Dativ, i-Erweiterung; Text 7'],['2','L07 und L05','Genitiv, velle/nōlle; Texte 6 und 5'],['3','L04 und L03','Ablativ, Personen, Imperativ; Text 4'],['4','L02 und L01','Nominativ, Akkusativ, Präpositionen; Texte 3 und 2'],['5','L07 und L07','Genitiv, Dativ, -er; ältere Texte'],['6','L05 und L04','Ablativ und Verben; Texte 4–6'],['7','L03, L02, L01','Bekannten Stoff festigen; Text 7']])}
].map(x=>({...x,kicker:'Erklärung → Beispiel'}));
const SKILL_INFO={vocab:{name:'L07-Wortschatz'},dative:{name:'Dativformen'},stem:{name:'Wortstamm'},object:{name:'Dativobjekt'},case:{name:'Kasus und Konstruktion'},possession:{name:'Dativ des Besitzers'},verbs:{name:'Verben mit i-Erweiterung'},imperative:{name:'Imperativ von capere'},context:{name:'Wörter und Konnektoren im Satz'}};
function question(skill,prompt,sentence,answer,wrong,explanation,reviewKeys,input=false){let options=shuffle([answer,...wrong]);return {skill,prompt,sentence,options,correct:options.indexOf(answer),success:explanation,wrong:'',reviewKeys,input,helper:input?'Längezeichen sind freiwillig.':'Wähle eine Antwort.',theme:SKILL_INFO[skill].name};}
function vocabQuestion(v=one(VOCAB)){return {...question('vocab','Welche Bedeutungen gehören zum Lernwort?',v.lat+' · '+v.info,v.de,shuffle(VOCAB.filter(w=>w.de!==v.de)).slice(0,3).map(w=>w.de),v.lat+' bedeutet: '+v.de+'.',[]),vocabLat:v.lat};}
function grammar(skill){
 if(skill==='dative'){let n=one(DATIVES),i=Math.random()<.5?2:3;return question(skill,'Bilde den Dativ '+(i===2?'Singular':'Plural')+'.',n[0]+' · Genitiv: '+n[1],n[i],[],'Die passende Dativform lautet '+n[i]+'.',[1],true);}
 if(skill==='stem'){let n=one(STEMS);return question(skill,'Schreibe den Wortstamm ohne Bindestrich.',n[0]+' · Genitiv: '+n[1],n[2],[],'Streiche -is vom Genitiv: '+n[2]+'-.',[2],true);}
 if(skill==='verbs'){let v=one(VERBS),i=Math.floor(Math.random()*6);return question(skill,'Bilde die Personalform.',v[0]+' · '+PERSON[i],v[i+1],[],v[0]+' · '+PERSON[i]+' → '+v[i+1]+'.',[5],true);}
 if(skill==='imperative'){let pl=Math.random()<.5;return question(skill,'Aufforderung an '+(pl?'mehrere Personen':'eine Person')+': capere',pl?'nehmt!':'nimm!',pl?'capite':'cape',[],pl?'capite! – nehmt!':'cape! – nimm!',[5],true);}
 if(skill==='object'){let x=one([['Amīcus mātrī adest.','mātrī',['Amīcus','adest'],'Wem hilft der Freund? Seiner Mutter.'],['Servus mercātōrī frūmentum portat.','mercātōrī',['Servus','frūmentum'],'Wem bringt er Getreide? Dem Kaufmann.'],['Cōnsilium patrī placet.','patrī',['Cōnsilium','placet'],'Wem gefällt der Plan? Dem Vater.']]);return question(skill,'Welches Wort ist das Dativobjekt?',x[0],x[1],x[2],x[3],[0]);}
 if(skill==='case'){let x=one([['familiae cōnsulere · familiae','Dativ Singular',['Genitiv Singular','Akkusativ Plural'],'cōnsulere verlangt hier den Dativ.'],['prō amīcō · amīcō','Ablativ Singular',['Dativ Singular','Genitiv Singular'],'prō verlangt den Ablativ.'],['iubēre: Welchen Fall mitlernen?','Akkusativ',['Dativ','Genitiv'],'iubēre steht mit Akkusativ.'],['servīs ohne Satz','Dativ oder Ablativ Plural',['nur Dativ Plural','nur Ablativ Plural'],'Beide Fälle haben hier dieselbe Endung.'],['servae ohne Satz','Genitiv oder Dativ Singular oder Nominativ Plural',['nur Dativ Singular','nur Genitiv Singular'],'Ohne Zusammenhang sind alle drei Deutungen möglich.']]);return question(skill,'Welche Antwort berücksichtigt alle passenden Möglichkeiten?',x[0],x[1],x[2],x[3],x[0].startsWith('serv')?[1]:[3]);}
 if(skill==='possession'){let x=one([['Mercātōrī taberna est.','Der Kaufmann hat einen Laden.','Der Laden hat einen Kaufmann.'],['Mercātōrī tabernae sunt.','Der Kaufmann hat Läden.','Die Kaufleute haben einen Laden.'],['Mātrī vīlla est.','Die Mutter hat ein Landhaus.','Das Landhaus hat eine Mutter.'],['Senī sīgnum est.','Der alte Mann hat ein Zeichen.','Das Zeichen hat einen alten Mann.']]);return question(skill,'Übersetze mit „haben“.',x[0],x[1],[x[2]],'Der Besitzer steht im Dativ; das besessene Ding im Nominativ.',[4]);}
 let x=one([['Aenēās gladium ___. – Äneas ergreift das Schwert.','capit',['cupit','currit'],'capere – ergreifen.'],['Aenēās familiam servāre ___. – Äneas will die Familie retten.','cupit',['capit','currit'],'cupere – wollen; ergänzt durch den Infinitiv servāre.'],['līberōs ___ – die Kinder tragen','gerere',['agere','ōrāre'],'gerere heißt hier tragen.'],['grātiās ___ – danken','agere',['capere','aspicere'],'Die feste Wendung heißt grātiās agere.'],['Via ___ patet. – Der Weg steht euch offen.','vōbīs',['mēcum','mē'],'vōbīs ist Dativ: euch.'],['Venī ___! – Komm mit mir!','mēcum',['vōbīs','mē'],'mēcum = cum mē – mit mir.'],['Welches Wort leitet eine Begründung ein?','nam',['sed','prīmō'],'nam bedeutet denn, nämlich.'],['Welches Wort bedeutet „also, folglich“?','igitur',['prīmō','mēcum'],'igitur nennt eine Schlussfolgerung.'],['Welches Wort gliedert zeitlich: zuerst?','prīmō',['igitur','sed'],'prīmō bedeutet zuerst.']]);return question('context','Ergänze passend zur Bedeutung.',x[0],x[1],x[2],x[3],x[0].startsWith('Welches Wort')?[8]:[6]);
}
function buildSession(){return [...shuffle(VOCAB).slice(0,5).map(vocabQuestion),grammar('object'),grammar('case'),grammar('stem'),grammar('dative'),grammar('dative'),grammar('verbs'),grammar('verbs'),grammar('imperative'),grammar('possession'),grammar('possession'),grammar('context'),grammar('context'),grammar('case')];}
function buildPractice(result){return result.wrongAnswers.map(e=>{let old=e.question;if(old.skill==='vocab'){let v=VOCAB.find(v=>v.lat===old.vocabLat);return {...question('vocab','Welches Lernwort bedeutet das?',v.de,v.lat,shuffle(VOCAB.filter(w=>w.lat!==v.lat)).slice(0,3).map(w=>w.lat),v.lat+' · '+v.info+' – '+v.de,[]),vocabLat:v.lat};}let q;for(let i=0;i<150;i++){q=grammar(old.skill);if(JSON.stringify(q.reviewKeys)===JSON.stringify(old.reviewKeys)&&(q.sentence!==old.sentence||q.prompt!==old.prompt))break;}return q;});}

// Full training and practice have independent state; completed results are snapshots.
let currentSession=null;
let practiceSession=null;
let lastFullResult=null;
const HISTORY_KEY="magistrella-l07-history-v1";
const BEST_KEY="magistrella-l07-best";
let storageMessage="";
function readStored(key){try{return localStorage.getItem(key);}catch{return null;}}
function writeStored(key,value){try{localStorage.setItem(key,value);return true;}catch{storageMessage="Dein Browser kann den Verlauf gerade nicht speichern. Dieses Ergebnis bleibt während dieser geöffneten Seite sichtbar.";return false;}}
function readHistory(){
  try {const data=JSON.parse(readStored(HISTORY_KEY)||"[]");
    return Array.isArray(data)?data.filter(r=>r && r.lesson==="L07" && Number.isInteger(r.total) && r.total>0 && Number.isInteger(r.correct) && r.correct>=0 && r.correct<=r.total && r.percentage===Math.round(r.correct/r.total*100) && Number.isFinite(Date.parse(r.completedAt))):[];
  }catch{return [];}
}
let history=readHistory();
function activeSession(){return practiceSession || currentSession;}
function newSession(type,questions){
  if(!questions.length || questions.some(q=>!SKILL_INFO[q.skill])) throw new Error("Frage ohne Diagnose");
  return {type,startedAt:new Date().toISOString(),questions,current:0,score:0,total:questions.length,skillStats:{},wrongAnswers:[],answered:false,completed:false};
}
function recordAnswer(q,answer,ok){
  const run=activeSession();
  if(run.answered || run.completed) return false;
  run.answered=true;
  const stats=run.skillStats[q.skill] ||= {attempts:0,correct:0};
  stats.attempts++;
  if(ok){stats.correct++;run.score++;}
  else run.wrongAnswers.push({skill:q.skill,prompt:q.prompt,sentence:plainText(q.sentence)+(q.sentence.includes("<strong")?" · Markiert: "+q.helper:""),answer,correctAnswer:q.options[q.correct],explanation:q.success+" "+q.wrong,question:JSON.parse(JSON.stringify(q))});
  return true;
}
function escapeHTML(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normalizeAnswer(value){return value.normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase();}
function renderIntro(){
 document.getElementById('progressLabel').textContent='Start';
 document.getElementById('mainContent').innerHTML=`<div class="lesson-intro"><div class="lesson-kicker">Magistrella · L07</div><h1>Äneas flieht aus Troja</h1><p>Dativ · Wortstämme · Verben mit i-Erweiterung</p><p>18 Aufgaben pro Volltraining. 100 % beschreibt diesen Durchlauf, nicht den gesamten Wortschatz.</p></div><section class="start-choice"><h2>Wie möchtest du starten?</h2><div class="start-buttons"><button class="start-btn learn" id="learnBtn">Regeln lernen<small>Alle Erklärungen Schritt für Schritt</small></button><button class="start-btn training" id="trainingBtn">Direkt zum Training<small>Regeln überspringen und Wissen testen</small></button></div></section>${vocabularyHTML()}${historyHTML()}`;
 document.getElementById('learnBtn').onclick=()=>renderTeaching(0);document.getElementById('trainingBtn').onclick=startTraining;
}

/* =====================================================
   TRAININGSSTART
===================================================== */

function startTraining(){
  practiceSession=null;
  currentSession=newSession("full",buildSession());
  openTraining();
}
function startPractice(){
  if(!lastFullResult || !lastFullResult.wrongAnswers.length) return;
  practiceSession=newSession("practice",buildPractice(lastFullResult));
  openTraining();
}
function openTraining(){
  document.getElementById("mainContent").style.display="block";
  document.getElementById("completionScreen").classList.remove("visible");
  renderQuestion();window.scrollTo({top:0,behavior:"smooth"});
}
function renderQuestion(){
  const run=activeSession();
  if(run.current>=run.total){showCompletion();return;}
  run.answered=false;
  const q=run.questions[run.current];
  document.getElementById("progressLabel").textContent=(run.type==="practice"?"Üben ":"")+(run.current+1)+"/"+run.total;
  const main=document.getElementById("mainContent");
  main.innerHTML=`${run.type==="practice"?'<div class="training-intro"><h2>Nur meine Fehler trainieren</h2><p>Diese Übungsrunde verändert dein vollständiges Training nicht.</p><button class="start-btn training" id="returnResult">Zum vollständigen Ergebnis</button></div>':''}<div class="question-card"><div class="q-theme">${q.theme}</div><div class="q-type-badge">Aufgabe ${run.current+1}</div><div class="q-prompt">${q.prompt}</div><div class="q-sentence">${q.sentence}</div><div class="q-helper">${q.helper}</div><div class="options"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><button type="button" id="nextBtn" class="next-btn">${run.current===run.total-1?'Auswertung anzeigen ✓':'Weiter →'}</button></div>`;
  if(run.type==="practice") document.getElementById("returnResult").onclick=()=>renderFullResult();
  const card=main.querySelector(".question-card"), wrap=card.querySelector(".options");
  function submit(answer,ok){
    if(!recordAnswer(q,answer,ok)) return;
    wrap.querySelectorAll("button,input").forEach(el=>el.disabled=true);
    wrap.querySelectorAll(".option-btn").forEach((el,i)=>{if(i===q.correct) el.classList.add("correct");else if(el.textContent===answer) el.classList.add("wrong");});
    showFeedback(card,q,ok);
  }
  if(q.input){
    wrap.innerHTML='<form><label for="formAnswer">Deine Form</label><input id="formAnswer" autocomplete="off" autocapitalize="none" spellcheck="false" required><button class="start-btn learn" type="submit">Antwort prüfen</button></form>';
    wrap.querySelector("form").onsubmit=e=>{e.preventDefault();const value=wrap.querySelector("input").value;if(value.trim()) submit(value,normalizeAnswer(value)===normalizeAnswer(q.options[q.correct]));};
  }else q.options.forEach((option,i)=>{
    const btn=document.createElement("button");btn.type="button";btn.className="option-btn";btn.textContent=option;
    btn.onclick=()=>submit(option,i===q.correct);wrap.appendChild(btn);
  });
  document.getElementById("nextBtn").onclick=()=>{if(!run.answered)return;run.current++;renderQuestion();window.scrollTo({top:0,behavior:"smooth"});};
}

/* =====================================================
   FEEDBACK
===================================================== */

function showFeedback(
  card,
  q,
  ok
){

  const feedback=
    card.querySelector(
      "#feedback"
    );


  feedback.className=
    "feedback "+
    (
      ok
      ?
      "correct"
      :
      "wrong"
    );


  feedback.innerHTML=`

    <div class="feedback-title">
      ${
        ok
        ?
        "Richtig."
        :
        "Noch nicht richtig."
      }
    </div>

    <div>
      ${
        ok
        ?
        q.success
        :
        escapeHTML(q.options[q.correct])+". "+q.success+" "+q.wrong
      }
    </div>

  `;


  card
    .querySelector(
      "#nextBtn"
    )
    .classList.add(
      "visible"
    );

}


/* =====================================================
   DIAGNOSE
===================================================== */

function completeFullSession(){
  const run=currentSession;
  if(run.completed) return lastFullResult;
  const stats=Object.values(run.skillStats);
  if(run.current!==run.total || stats.reduce((n,s)=>n+s.attempts,0)!==run.total || stats.reduce((n,s)=>n+s.correct,0)!==run.score || run.wrongAnswers.length!==run.total-run.score) throw new Error("Unvollständige Trainingsdiagnose");
  const completedAt=new Date().toISOString();
  const result=JSON.parse(JSON.stringify({id:globalThis.crypto?.randomUUID?.() || completedAt+"-"+Math.random().toString(36).slice(2),lesson:"L07",startedAt:run.startedAt,completedAt,correct:run.score,total:run.total,percentage:Math.round(run.score/run.total*100),skillStats:run.skillStats,wrongAnswers:run.wrongAnswers}));
  run.completed=true;lastFullResult=result;
  // Re-read to retain completed runs from another open tab when possible.
  const existing=readHistory();
  history=[...existing,...history.filter(r=>!existing.some(e=>e.id===r.id)),result];
  writeStored(HISTORY_KEY,JSON.stringify(history));
  const best=Math.max(Number(readStored(BEST_KEY))||0,...history.map(r=>r.percentage));
  writeStored(BEST_KEY,String(best));
  return result;
}
function buildDiagnosis(result){
  const rows=Object.entries(result.skillStats).map(([skill,s])=>`<div class="skill-result ${s.correct===s.attempts?'good':'weak'}"><span>${escapeHTML(SKILL_INFO[skill].name)}</span><span class="skill-score">${s.correct===s.attempts?'✓':'Üben'} · ${s.correct}/${s.attempts}</span></div>`).join('');
  const errors=result.wrongAnswers.map(e=>`<article class="correction"><strong>${escapeHTML(SKILL_INFO[e.skill].name)}</strong><p>${escapeHTML(e.prompt)}</p><p>${escapeHTML(e.sentence)}</p><p>Deine Antwort: ${escapeHTML(e.answer)}</p><p><strong>Richtig: ${escapeHTML(e.correctAnswer)}</strong></p><p>${escapeHTML(e.explanation)}</p></article>`).join('');
  const grammar=[...new Set(result.wrongAnswers.flatMap(e=>e.question.reviewKeys || []))];
  const cards=grammar.map(index=>`<article class="review-card"><div class="review-head"><h3>${TEACHING[index].title.replace(/^\d+\. /,'')}</h3></div><div class="review-body">${index===8?'<p>Konnektoren verbinden Gedanken: et – und; nam – denn (Grund); sed, autem – aber (Gegensatz); prīmō – zuerst (Zeit); igitur – also, folglich (Schlussfolgerung).</p>':TEACHING[index].body}</div></article>`).join('');
  return `<section class="result-section"><h2>Deine Diagnose</h2><p>Alle ${result.total} Antworten aus diesem Training.</p>${rows}${errors?'<h3 class="review-heading">Deine Antworten verbessern</h3>'+errors:'<p class="mastered-box">✓ Alle Antworten richtig!</p>'}${cards?'<h3 class="review-heading">Diese Regeln helfen dir weiter</h3>'+cards:''}</section>`;
}
function historyHTML(){
  if(!history.length)return `<section class="result-section"><h2>Dein Verlauf</h2><p>Noch kein Volltraining gespeichert.</p><p>Bestwert: ${Number(readStored(BEST_KEY))||0} %</p></section>`;
  const recent=history.slice().sort((a,b)=>Date.parse(b.completedAt)-Date.parse(a.completedAt));
  const best=Math.max(Number(readStored(BEST_KEY))||0,...history.map(r=>r.percentage));
  return `<section class="result-section"><h2>Dein Verlauf</h2><p>Letztes Training: <strong>${recent[0].percentage} %</strong><br>Bestwert: <strong>${best} %</strong><br>Vollständige Trainings: <strong>${history.length}</strong></p><ul class="history-list">${recent.map(r=>`<li>${escapeHTML(new Date(r.completedAt).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'}))} · <strong>${r.correct}/${r.total} · ${r.percentage} %</strong></li>`).join('')}</ul></section>`;
}
function showCompletion(){
  if(activeSession().type==='practice'){
    practiceSession.completed=true;
    renderFullResult(`Übungsrunde beendet: ${practiceSession.score}/${practiceSession.total} richtig. Dein vollständiges Ergebnis bleibt unverändert.`);
  }else{completeFullSession();renderFullResult();}
}
function renderFullResult(practiceMessage=''){
  const r=lastFullResult;if(!r)return;
  document.getElementById('mainContent').style.display='none';
  document.getElementById('progressLabel').textContent='Fertig';
  const screen=document.getElementById('completionScreen');screen.classList.add('visible');
  screen.innerHTML=`${practiceMessage?`<p class="training-intro" role="status">${escapeHTML(practiceMessage)}</p>`:''}<section class="result-section completion-main"><h2>Dieses Training</h2><div class="completion-title">${r.percentage===100?'PERFECTUM!':'L07 geschafft!'}</div><div class="completion-score">${r.correct} / ${r.total}<br>${r.percentage} %</div><p>Dativ · Verben mit i-Erweiterung</p><div class="result-actions"><button class="start-btn learn" id="shareResult">Ergebnis teilen</button><button class="start-btn training" id="saveResult">Bild speichern</button></div><p id="shareStatus" role="status"></p></section>${buildDiagnosis(r)}<section class="result-section"><h2>Wie möchtest du weiterlernen?</h2><div class="result-actions">${r.wrongAnswers.length?'<button class="start-btn learn" id="practiceErrors">Nur meine Fehler trainieren</button>':''}<button class="start-btn training" id="restartFull">Alles noch einmal trainieren</button></div><a class="home-btn" href="../index.html">← Zurück zur Übersicht</a></section>${historyHTML()}${storageMessage?`<p role="status">${escapeHTML(storageMessage)}</p>`:''}`;
  document.querySelector('.completion-main').appendChild(createShareCanvas(r));
  document.getElementById('restartFull').onclick=startTraining;
  if(r.wrongAnswers.length)document.getElementById('practiceErrors').onclick=startPractice;
  document.getElementById('shareResult').onclick=()=>shareResult(r);
  document.getElementById('saveResult').onclick=()=>saveResult(r);
  window.scrollTo({top:0,behavior:'smooth'});
}
// Local Canvas only: no learner data, external artwork, fonts or requests.
function createShareCanvas(result){
  const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1080;
  const ctx=canvas.getContext('2d');if(!ctx)throw new Error('Canvas nicht verfügbar');
  ctx.fillStyle='#1A1208';ctx.fillRect(0,0,1080,1080);
  ctx.strokeStyle='#C9A84C';ctx.lineWidth=3;ctx.strokeRect(40,40,1000,1000);ctx.strokeRect(54,54,972,972);
  ctx.textAlign='center';ctx.fillStyle='#E8C96A';
  ctx.font='bold 58px Georgia, serif';ctx.fillText('MAGISTRELLA',540,170);
  ctx.fillStyle='#F5EDD6';ctx.font='32px sans-serif';ctx.fillText('Latein-Training',540,230);
  ctx.font='bold 52px Georgia, serif';ctx.fillText('L07 geschafft!',540,350);
  ctx.fillStyle='#E8C96A';ctx.font='bold 130px sans-serif';ctx.fillText(`${result.correct} / ${result.total}`,540,535);
  ctx.font='bold 100px sans-serif';ctx.fillText(`${result.percentage} %`,540,675);
  if(result.percentage===100){ctx.font='bold 36px Georgia, serif';ctx.fillText('PERFECTUM!',540,760);}
  ctx.fillStyle='#F5EDD6';ctx.font='30px sans-serif';ctx.fillText('Dativ · Verben mit i-Erweiterung',540,860);
  ctx.font='28px sans-serif';ctx.fillText(new Date(result.completedAt).toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'}),540,945);
  return canvas;
}
function shareBlob(r){return new Promise((resolve,reject)=>{try{createShareCanvas(r).toBlob(blob=>blob?resolve(blob):reject(new Error('PNG konnte nicht erstellt werden')),'image/png');}catch(e){reject(e);}});}
function downloadBlob(blob,r){
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Magistrella-L07-${r.completedAt.slice(0,10)}.png`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
}
async function saveResult(r){try{downloadBlob(await shareBlob(r),r);document.getElementById('shareStatus').textContent='Dein Ergebnisbild wurde zum Speichern bereitgestellt.';}catch{document.getElementById('shareStatus').textContent='Das Bild konnte nicht erstellt werden. Bitte versuche es erneut.';}}
async function shareResult(r){
  try{
    const blob=await shareBlob(r);
    const file=typeof File==='function'?new File([blob],'Magistrella-L07.png',{type:'image/png'}):null;
    if(file && navigator.share && navigator.canShare?.({files:[file]})){
      try{await navigator.share({files:[file],title:'Magistrella · L07'});return;}catch(e){if(e.name==='AbortError')return;}
    }
    downloadBlob(blob,r);document.getElementById('shareStatus').textContent='Teilen ist hier nicht verfügbar. Dein Bild wurde zum Speichern bereitgestellt.';
  }catch{document.getElementById('shareStatus').textContent='Bitte nutze „Bild speichern“ oder versuche es erneut.';}
}



renderIntro();
</script>
