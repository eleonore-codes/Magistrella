<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>L05 · Verben · Wollen · Infinitive · Magistrella</title>

<style>
:root{
  --gold:#C9A84C;
  --gold-light:#E8C96A;
  --gold-dark:#8B6914;
  --ink:#1A1208;
  --ink-mid:#2A1F0E;
  --parchment:#F5EDD6;
  --parchment-dark:#E8D9B5;
  --stone:#968B78;
  --green-ok:#4CAF7D;
  --red-wrong:#E05050;
  --white:#FDFAF3;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  background:var(--ink);
  color:var(--parchment);
  min-height:100vh;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}

button{
  font:inherit;
}

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 16px;
  background:rgba(26,18,8,.96);
  backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(201,168,76,.2);
}

.back-btn{
  color:var(--gold);
  text-decoration:none;
  font-size:20px;
  padding:4px 8px 4px 0;
}

.topbar-info{
  flex:1;
}

.topbar-title{
  color:var(--gold-light);
  font-size:14px;
  font-style:italic;
}

.topbar-sub{
  color:var(--stone);
  font-size:12px;
}

.topbar-progress{
  color:var(--gold);
  font-weight:800;
  font-size:13px;
  min-width:55px;
  text-align:right;
}

/* =====================================================
   INTRO
===================================================== */

.lesson-intro{
  margin:16px;
  padding:18px;
  border:1px solid rgba(201,168,76,.25);
  border-radius:18px;
  background:linear-gradient(
    135deg,
    rgba(201,168,76,.12),
    rgba(201,168,76,.03)
  );
}

.lesson-kicker{
  color:var(--gold);
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:2px;
}

.lesson-intro h1{
  color:var(--gold-light);
  font-size:24px;
  line-height:1.25;
  margin:5px 0 10px;
}

.lesson-intro p{
  color:var(--parchment-dark);
  font-size:15px;
}

.lesson-goals{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px;
}

.goal-chip{
  background:rgba(0,0,0,.18);
  border:1px solid rgba(201,168,76,.16);
  border-radius:11px;
  padding:8px 10px;
  font-size:13px;
  color:var(--parchment-dark);
}

/* =====================================================
   STARTAUSWAHL
===================================================== */

.start-choice{
  margin:16px;
  padding:18px;
  border-radius:18px;
  background:var(--ink-mid);
  border:1px solid rgba(201,168,76,.18);
}

.start-choice h2{
  color:var(--gold-light);
  font-size:19px;
  margin-bottom:5px;
}

.start-choice p{
  color:var(--stone);
  font-size:14px;
  margin-bottom:15px;
}

.start-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.start-btn{
  min-height:64px;
  padding:12px;
  border-radius:14px;
  cursor:pointer;
  font-weight:800;
  border:1.5px solid var(--gold);
}

.start-btn.learn{
  background:linear-gradient(
    135deg,
    var(--gold-dark),
    var(--gold)
  );
  color:var(--ink);
}

.start-btn.training{
  background:rgba(201,168,76,.07);
  color:var(--gold-light);
}

.start-btn small{
  display:block;
  margin-top:3px;
  font-size:11px;
  font-weight:500;
  line-height:1.35;
  opacity:.85;
}

/* =====================================================
   LERNKARTEN
===================================================== */

.teach-card,
.review-card{
  margin:16px;
  border-radius:18px;
  overflow:hidden;
  background:var(--parchment);
  color:#2A1F0E;
  border:1px solid rgba(201,168,76,.55);
  text-align:left;
}

.teach-head,
.review-head{
  padding:13px 16px;
  background:var(--parchment-dark);
  border-bottom:1px solid rgba(90,60,10,.12);
}

.teach-kicker,
.review-kicker{
  color:#735108;
  text-transform:uppercase;
  font-size:11px;
  letter-spacing:2px;
  font-weight:800;
}

.teach-head h2,
.review-head h3{
  color:#2A1F0E;
  font-size:20px;
  line-height:1.3;
  margin-top:2px;
}

.teach-body,
.review-body{
  padding:16px;
  font-size:15px;
}

.teach-body p + p,
.review-body p + p{
  margin-top:10px;
}

.teach-body strong,
.review-body strong{
  color:#6C4B06;
}

.teach-example{
  margin-top:14px;
  padding:12px;
  background:rgba(255,255,255,.55);
  border-left:4px solid var(--gold-dark);
  border-radius:10px;
}

.teach-example .latin{
  font-size:17px;
  font-weight:800;
  font-style:italic;
  color:#2A1F0E;
}

.teach-example .german{
  margin-top:2px;
  color:#594931;
}

.mini-rule{
  margin-top:14px;
  padding:11px 12px;
  border:1px solid rgba(139,105,20,.25);
  border-radius:10px;
  background:#FFF9EA;
  color:#594006;
  font-weight:700;
}

/* =====================================================
   TABELLEN
===================================================== */

.rule-table{
  width:100%;
  border-collapse:collapse;
  margin-top:14px;
  font-size:14px;
}

.rule-table th{
  background:rgba(139,105,20,.13);
  color:#654807;
  padding:7px 7px;
  text-align:left;
  font-size:12px;
}

.rule-table td{
  color:#2E2110;
  padding:7px;
  border-bottom:1px solid rgba(80,55,5,.14);
  vertical-align:top;
}

.rule-table tr:last-child td{
  border-bottom:none;
}

.rule-highlight{
  color:#694A06 !important;
  font-weight:800;
}

/* =====================================================
   TRAINING
===================================================== */

.training-intro{
  margin:16px;
  padding:16px;
  border-radius:16px;
  border:1px solid rgba(201,168,76,.25);
  background:rgba(201,168,76,.07);
}

.training-intro h2{
  color:var(--gold-light);
  font-size:19px;
  margin-bottom:5px;
}

.training-intro p{
  color:var(--parchment-dark);
  font-size:14px;
}

.question-card{
  margin:16px;
  padding:20px;
  border-radius:20px;
  background:var(--ink-mid);
  border:1px solid rgba(201,168,76,.15);
  animation:slideUp .22s ease;
}

@keyframes slideUp{
  from{
    opacity:0;
    transform:translateY(14px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.q-theme{
  color:var(--gold);
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:2px;
  margin-bottom:8px;
}

.q-type-badge{
  display:inline-block;
  padding:4px 10px;
  border-radius:99px;
  background:rgba(201,168,76,.14);
  border:1px solid rgba(201,168,76,.28);
  color:var(--gold-light);
  font-size:12px;
  margin-bottom:12px;
}

.q-prompt{
  font-size:17px;
  color:var(--parchment);
  margin-bottom:14px;
}

.q-sentence{
  font-size:18px;
  color:var(--white);
  text-align:center;
  font-style:italic;
  background:rgba(0,0,0,.2);
  border-radius:12px;
  padding:13px;
  margin-bottom:16px;
}

.q-helper{
  color:var(--stone);
  font-size:13px;
  margin-top:-6px;
  margin-bottom:14px;
}

.options{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.option-btn{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 15px;
  border-radius:14px;
  border:1.5px solid rgba(201,168,76,.25);
  background:rgba(255,255,255,.04);
  color:#fff;
  cursor:pointer;
  text-align:left;
}

.option-btn.correct{
  background:rgba(76,175,125,.15);
  border-color:var(--green-ok);
  color:#9FE7BD;
}

.option-btn.wrong{
  background:rgba(224,80,80,.12);
  border-color:var(--red-wrong);
  color:#FFB6B6;
}

.option-letter{
  width:28px;
  height:28px;
  flex:0 0 28px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  background:rgba(201,168,76,.15);
  color:var(--gold-light);
  font-size:12px;
  font-weight:800;
}

.feedback{
  display:none;
  margin-top:14px;
  padding:14px;
  border-radius:14px;
  font-size:14px;
}

.feedback.correct{
  display:block;
  background:rgba(76,175,125,.12);
  border:1px solid rgba(76,175,125,.3);
  color:#91E2B3;
}

.feedback.wrong{
  display:block;
  background:rgba(224,80,80,.09);
  border:1px solid rgba(224,80,80,.28);
  color:#F2B0B0;
}

.feedback-title{
  font-weight:800;
  margin-bottom:5px;
}

/* =====================================================
   BUTTONS
===================================================== */

.continue-btn,
.next-btn{
  width:calc(100% - 32px);
  margin:12px 16px 16px;
  padding:15px;
  border:none;
  border-radius:14px;
  background:linear-gradient(
    135deg,
    var(--gold-dark),
    var(--gold)
  );
  color:var(--ink);
  font-weight:800;
  cursor:pointer;
}

.next-btn{
  width:100%;
  margin:14px 0 0;
  display:none;
}

.next-btn.visible{
  display:block;
}

/* =====================================================
   ABSCHLUSS + DIAGNOSE
===================================================== */

.completion{
  display:none;
  padding:32px 16px 45px;
}

.completion.visible{
  display:block;
}

.completion-main{
  text-align:center;
}

.completion-symbol{
  font-size:60px;
}

.completion-title{
  color:var(--gold-light);
  font-size:27px;
  margin-top:8px;
}

.completion-score{
  color:var(--gold);
  font-size:42px;
  font-weight:800;
  margin:14px 0;
}

.completion-stars{
  font-size:32px;
  margin-bottom:18px;
  letter-spacing:6px;
}

.completion-msg{
  color:var(--parchment-dark);
  max-width:560px;
  margin:0 auto 24px;
  font-size:15px;
}

.diagnosis{
  max-width:760px;
  margin:28px auto 0;
}

.diagnosis-title{
  color:var(--gold-light);
  font-size:21px;
  margin-bottom:6px;
  text-align:left;
}

.diagnosis-sub{
  color:var(--stone);
  font-size:14px;
  text-align:left;
  margin-bottom:14px;
}

.skill-result{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:10px 12px;
  margin-bottom:7px;
  border-radius:10px;
  background:rgba(255,255,255,.04);
  font-size:14px;
}

.skill-result.good{
  border-left:4px solid var(--green-ok);
}

.skill-result.weak{
  border-left:4px solid var(--red-wrong);
}

.skill-name{
  color:var(--parchment);
}

.skill-score{
  color:var(--stone);
  font-weight:700;
}

.review-heading{
  color:var(--gold-light);
  text-align:left;
  font-size:20px;
  margin:26px 0 5px;
}

.review-explanation{
  color:var(--stone);
  text-align:left;
  font-size:14px;
  margin-bottom:8px;
}

.mastered-box{
  padding:16px;
  border-radius:14px;
  background:rgba(76,175,125,.1);
  border:1px solid rgba(76,175,125,.3);
  color:#A6EAC1;
  text-align:left;
  margin-top:18px;
}

.home-btn{
  display:inline-block;
  margin-top:28px;
  padding:14px 25px;
  border-radius:14px;
  background:linear-gradient(
    135deg,
    var(--gold-dark),
    var(--gold)
  );
  color:var(--ink);
  font-weight:800;
  text-decoration:none;
}

button:focus-visible,
a:focus-visible{
  outline:3px solid #FFF1A8;
  outline-offset:3px;
}

@media(max-width:520px){

  .lesson-goals,
  .start-buttons{
    grid-template-columns:1fr;
  }

  .rule-table{
    font-size:12px;
  }

  .rule-table th,
  .rule-table td{
    padding:6px 4px;
  }

}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}

body > #mainContent, .completion {max-width:820px;margin:auto;}
.start-btn small{font-size:14px;}
.feedback.correct,.feedback.wrong{background:var(--parchment);color:var(--ink);border-width:2px;}
.result-section{margin:24px auto;padding:18px;border:1px solid rgba(201,168,76,.3);border-radius:18px;}
.result-section h2{font-size:22px;color:var(--gold-light);margin-bottom:14px;}
.correction{background:var(--parchment);color:var(--ink);padding:16px;border-radius:12px;margin:12px 0;overflow-wrap:anywhere;}
.result-actions{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0;}
.result-actions button{flex:1;min-width:180px;}
.review-card{margin:16px 0;}
.skill-score{color:var(--parchment);white-space:nowrap;}
input{display:block;width:100%;min-height:48px;font:inherit;margin:12px 0;padding:10px;border:2px solid var(--gold);border-radius:10px;}
.history-list{list-style:none;}.history-list li{padding:12px 0;border-bottom:1px solid var(--gold-dark);}
.rule-table{display:block;overflow-x:auto;font-size:14px;}

.completion{text-align:left;}
canvas{max-width:100%;height:auto;margin-top:20px} .rule-table{font-size:1rem} .teach-body,.review-body,.correction,.feedback{background:#fff6e2;color:#241a0f} summary{cursor:pointer;padding:16px;font-weight:bold} button{min-height:48px} td{overflow-wrap:anywhere}.table-scroll{overflow-x:auto} .rule-table{width:100%;table-layout:fixed} .rule-table th,.rule-table td{white-space:normal;overflow-wrap:anywhere} input{max-width:100%;min-height:48px;font-size:1.1rem} .teach-body h3{color:#493208} </style>
</head>

<script>
// Source: supplied textbook pages 110–117. Supplementary text vocabulary is not included.
const VOCAB=[
['uxor','uxōrem f','die Ehefrau, die Gattin'],['relinquere','relinquō','verlassen, zurücklassen'],['velle','volō','wollen'],['nam','','denn, nämlich'],['oculus','oculum m','das Auge'],['vertere','vertō','drehen, wenden'],['nōn dēbēre','nōn dēbeō','nicht dürfen, nicht müssen'],['lūx','lūcem f','das Licht, das Tageslicht'],['petere','petō','bitten, verlangen, eilen (zu / nach), aufsuchen, angreifen'],['timēre','timeō','fürchten, Angst haben'],['dīcere','dīcō','sagen, sprechen'],['tēcum','~ cum tē','mit dir'],['tē','Akk.','dich'],['dūcere','dūcō','führen, ziehen'],['umbra','umbram f','der Schatten'],['respondēre','respondeō','antworten'],['nōnne?','','(etwa) nicht?'],['quoque','nachgestellt','auch'],['nōlle','nōlō','nicht wollen'],['remanēre','remaneō','(zurück)bleiben'],['accēdere','accēdō','herbeikommen, hingehen'],['contendere','contendō','eilen, sich anstrengen, kämpfen'],['salūs','salūtem f','die Gesundheit, die Rettung, das Glück, der Gruß'],['ostendere','ostendō','zeigen, erklären'],['amor','amōrem m','die Liebe'],['mē','Akk.','mich'],['dextera','dexteram f','die Rechte, die rechte Hand'],['tollere','tollō','aufheben, in die Höhe heben, wegnehmen'],['tendere','tendō','(aus)strecken, sich anstrengen'],['cēdere','cēdō','gehen, zurückweichen, nachgeben']
].map(([lat,info,de])=>({lat,info,de}));
const REPEAT=[['post','Präp. m. Akk.','hinter, nach'],['per','Präp. m. Akk.','durch'],['quod','Subj.','dass, weil'],['itaque','','deshalb'],['rogāre','rogō','fragen, bitten (um)'],['quīn?','','warum nicht?']];
const NAMES=[['Orpheus','m','Orpheus (berühmter thrakischer Sänger)'],['Eurydica','f','Eurydike (die Ehefrau des Orpheus)'],['Tartarus','m','der Tartarus, die Unterwelt']];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function one(a){return a[Math.floor(Math.random()*a.length)];}
function plainText(s){return String(s).replace(/<[^>]*>/g,'');}
function table(rows){return `<div class="table-scroll"><table class="rule-table"><tbody>${rows.map((r,i)=>`<tr>${r.map(c=>i?`<td>${c}</td>`:`<th scope="col">${c}</th>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function vocabularyHTML(){return `<details class="teach-card"><summary>Vollständige Vokabelliste · 30 Lernwörter</summary><div class="teach-body"><p>Substantive: Akkusativ Singular und Genus (m: männlich, f: weiblich, n: sächlich). Verben: 1. Person Singular. Präp.: Präposition; Subj.: unterordnendes Bindewort.</p>${table([['Latein','Form / Hinweis','Bedeutungen'],...VOCAB.map(v=>[v.lat,v.info,v.de])])}<h3>Wiederholungswörter</h3>${table([['Latein','Hinweis','Deutsch'],...REPEAT])}<h3>Eigennamen wie im Heft</h3>${table([['Name','Genus','Erklärung'],...NAMES])}<p>Grundlage: Seiten 110–117. Die Übungsnamen Furio, Felicitas und Philipp sind keine zusätzlichen Lernwörter. Eine gesonderte Texthilfenliste ist auf diesen Seiten nicht enthalten.</p></div></details>`;}
const PERSON=['ich','du','er / sie / es','wir','ihr','sie (Plural)'];
const PARADIGMS=[
{inf:'clāmāre',group:'ā-Konjugation',forms:['clāmō','clāmās','clāmat','clāmāmus','clāmātis','clāmant'],de:['ich schreie','du schreist','er / sie / es schreit','wir schreien','ihr schreit','sie schreien'],imp:['clāmā','clāmāte'],impDe:['schreie!','schreit!']},
{inf:'vidēre',group:'ē-Konjugation',forms:['videō','vidēs','videt','vidēmus','vidētis','vident'],de:['ich sehe','du siehst','er / sie / es sieht','wir sehen','ihr seht','sie sehen'],imp:['vidē','vidēte'],impDe:['sieh!','seht!']},
{inf:'venīre',group:'ī-Konjugation',forms:['veniō','venīs','venit','venīmus','venītis','veniunt'],de:['ich komme','du kommst','er / sie / es kommt','wir kommen','ihr kommt','sie kommen'],imp:['venī','venīte'],impDe:['komm!','kommt!']},
{inf:'petere',group:'konsonantische Konjugation',forms:['petō','petis','petit','petimus','petitis','petunt'],de:['ich bitte','du bittest','er / sie / es bittet','wir bitten','ihr bittet','sie bitten'],imp:['pete','petite'],impDe:['bitte!','bittet!']},
{inf:'esse',group:'unregelmäßiges Hilfsverb',forms:['sum','es','est','sumus','estis','sunt'],de:['ich bin','du bist','er / sie / es ist','wir sind','ihr seid','sie sind'],imp:['es','este'],impDe:['sei!','seid!']},
{inf:'velle',group:'unregelmäßiges Verb',forms:['volō','vīs','vult','volumus','vultis','volunt'],de:['ich will','du willst','er / sie / es will','wir wollen','ihr wollt','sie wollen']},
{inf:'nōlle',group:'unregelmäßiges Verb',forms:['nōlō','nōn vīs','nōn vult','nōlumus','nōn vultis','nōlunt'],de:['ich will nicht','du willst nicht','er / sie / es will nicht','wir wollen nicht','ihr wollt nicht','sie wollen nicht']}

const CONSONANTS=[['relinquere','relinqu'],['vertere','vert'],['petere','pet'],['dīcere','dīc'],['dūcere','dūc'],['accēdere','accēd'],['contendere','contend'],['ostendere','ostend'],['tollere','toll'],['tendere','tend'],['cēdere','cēd']].map(([inf,stem])=>({inf,forms:['ō','is','it','imus','itis','unt'].map(e=>stem+e)}));

// Full training and practice have independent state; completed results are snapshots.
let currentSession=null;

const HISTORY_KEY="magistrella-l05-history-v1";

let storageMessage="";
function readStored(key){try{return localStorage.getItem(key);}catch{return null;}}
function writeStored(key,value){try{localStorage.setItem(key,value);return true;}catch{storageMessage="Dein Browser kann den Verlauf gerade nicht speichern. Dieses Ergebnis bleibt während dieser geöffneten Seite sichtbar.";return false;}}
function readHistory(){
  try {const data=JSON.parse(readStored(HISTORY_KEY)||"[]");
    return Array.isArray(data)?data.filter(r=>r && r.lesson==="L05" && Number.isInteger(r.total) && r.total>0 && Number.isInteger(r.correct) && r.correct>=0 && r.correct<=r.total && r.percentage===Math.round(r.correct/r.total*100) && Number.isFinite(Date.parse(r.completedAt))):[];
  }catch{return [];}
}
let history=readHistory();
function activeSession(){return practiceSession || currentSession;}
function newSession(type,questions){
  if(!questions.length || questions.some(q=>!SKILL_INFO[q.skill])) throw new Error("Frage ohne Diagnose");
  return {type,startedAt:new Date().toISOString(),questions,current:0,score:0,total:questions.length,skillStats:{},wrongAnswers:[],answered:false,completed:false};
}
function recordAnswer(q,answer,ok){
  const run=activeSession();
  if(run.answered || run.completed) return false;
  run.answered=true;
  const stats=run.skillStats[q.skill] ||= {attempts:0,correct:0};
  stats.attempts++;
  if(ok){stats.correct++;run.score++;}
  else run.wrongAnswers.push({skill:q.skill,prompt:q.prompt,sentence:plainText(q.sentence)+(q.sentence.includes("<strong")?" · Markiert: "+q.helper:""),answer,correctAnswer:q.options[q.correct],explanation:q.success+" "+q.wrong,question:JSON.parse(JSON.stringify(q))});

}

function normalizeAnswer(value){return value.normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase();}

/* =====================================================

===================================================== */

function startTraining(){
  practiceSession=null;
  currentSession=newSession("full",buildSession());
  openTraining();
}
function startPractice(){
  if(!lastFullResult || !lastFullResult.wrongAnswers.length) return;
  practiceSession=newSession("practice",buildPractice(lastFullResult));
  openTraining();
}
function openTraining(){
  document.getElementById("mainContent").style.display="block";
  document.getElementById("completionScreen").classList.remove("visible");
  renderQuestion();window.scrollTo({top:0,behavior:"smooth"});
}
function renderQuestion(){
  const run=activeSession();
  if(run.current>=run.total){showCompletion();return;}
  run.answered=false;
  const q=run.questions[run.current];
  document.getElementById("progressLabel").textContent=(run.type==="practice"?"Üben ":"")+(run.current+1)+"/"+run.total;
  const main=document.getElementById("mainContent");
  main.innerHTML=`${run.type==="practice"?'<div class="training-intro"><h2>Nur meine Fehler trainieren</h2><p>Diese Übungsrunde verändert dein vollständiges Training nicht.</p><button class="start-btn training" id="returnResult">Zum vollständigen Ergebnis</button></div>':''}<div class="question-card"><div class="q-theme">${q.theme}</div><div class="q-type-badge">Aufgabe ${run.current+1}</div><div class="q-prompt">${q.prompt}</div><div class="q-sentence">${q.sentence}</div><div class="q-helper">${q.helper}</div><div class="options"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><button type="button" id="nextBtn" class="next-btn">${run.current===run.total-1?'Auswertung anzeigen ✓':'Weiter →'}</button></div>`;
  if(run.type==="practice") document.getElementById("returnResult").onclick=()=>renderFullResult();
  const card=main.querySelector(".question-card"), wrap=card.querySelector(".options");
  function submit(answer,ok){
    if(!recordAnswer(q,answer,ok)) return;
    wrap.querySelectorAll("button,input").forEach(el=>el.disabled=true);
    wrap.querySelectorAll(".option-btn").forEach((el,i)=>{if(i===q.correct) el.classList.add("correct");else if(el.textContent===answer) el.classList.add("wrong");});
    showFeedback(card,q,ok);
  }
  if(q.input){
    wrap.innerHTML='<form><label for="formAnswer">Deine Form</label><input id="formAnswer" autocomplete="off" autocapitalize="none" spellcheck="false" required><button class="start-btn learn" type="submit">Antwort prüfen</button></form>';
    wrap.querySelector("form").onsubmit=e=>{e.preventDefault();const value=wrap.querySelector("input").value;if(value.trim()) submit(value,normalizeAnswer(value)===normalizeAnswer(q.options[q.correct]));};
  }else q.options.forEach((option,i)=>{
    const btn=document.createElement("button");btn.type="button";btn.className="option-btn";btn.textContent=option;
    btn.onclick=()=>submit(option,i===q.correct);wrap.appendChild(btn);
  });
  document.getElementById("nextBtn").onclick=()=>{if(!run.answered)return;run.current++;renderQuestion();window.scrollTo({top:0,behavior:"smooth"});};
}

   DIAGNOSE
===================================================== */

function completeFullSession(){
  const run=currentSession;
  if(run.completed) return lastFullResult;
  const stats=Object.values(run.skillStats);
  if(run.current!==run.total || stats.reduce((n,s)=>n+s.attempts,0)!==run.total || stats.reduce((n,s)=>n+s.correct,0)!==run.score || run.wrongAnswers.length!==run.total-run.score) throw new Error("Unvollständige Trainingsdiagnose");
  const completedAt=new Date().toISOString();
  const result=JSON.parse(JSON.stringify({id:globalThis.crypto?.randomUUID?.() || completedAt+"-"+Math.random().toString(36).slice(2),lesson:"L05",startedAt:run.startedAt,completedAt,correct:run.score,total:run.total,percentage:Math.round(run.score/run.total*100),skillStats:run.skillStats,wrongAnswers:run.wrongAnswers}));
  run.completed=true;lastFullResult=result;
  // Re-read to retain completed runs from another open tab when possible.
  const existing=readHistory();
  history=[...existing,...history.filter(r=>!existing.some(e=>e.id===r.id)),result];
  writeStored(HISTORY_KEY,JSON.stringify(history));
  const best=Math.max(Number(readStored(BEST_KEY))||0,...history.map(r=>r.percentage));
  writeStored(BEST_KEY,String(best));
  return result;
}
function buildDiagnosis(result){
  const rows=Object.entries(result.skillStats).map(([skill,s])=>`<div class="skill-result ${s.correct===s.attempts?'good':'weak'}"><span>${escapeHTML(SKILL_INFO[skill].name)}</span><span class="skill-score">${s.correct===s.attempts?'✓':'Üben'} · ${s.correct}/${s.attempts}</span></div>`).join('');
  const errors=result.wrongAnswers.map(e=>`<article class="correction"><strong>${escapeHTML(SKILL_INFO[e.skill].name)}</strong><p>${escapeHTML(e.prompt)}</p><p>${escapeHTML(e.sentence)}</p><p>Deine Antwort: ${escapeHTML(e.answer)}</p><p><strong>Richtig: ${escapeHTML(e.correctAnswer)}</strong></p><p>${escapeHTML(e.explanation)}</p></article>`).join('');
  const grammar=[...new Set(result.wrongAnswers.flatMap(e=>e.question.reviewKeys || []))];
  const cards=grammar.map(index=>`<article class="review-card"><div class="review-head"><h3>${TEACHING[index].title.replace(/^\d+\. /,'')}</h3></div><div class="review-body">${TEACHING[index].body}</div></article>`).join('');
  return `<section class="result-section"><h2>Deine Diagnose</h2><p>Alle ${result.total} Antworten aus diesem Training.</p>${rows}${errors?'<h3 class="review-heading">Deine Antworten verbessern</h3>'+errors:'<p class="mastered-box">✓ Alle Antworten richtig!</p>'}${cards?'<h3 class="review-heading">Diese Regeln helfen dir weiter</h3>'+cards:''}</section>`;
}
function historyHTML(){
  if(!history.length)return `<section class="result-section"><h2>Dein Verlauf</h2><p>Noch kein Volltraining gespeichert.</p><p>Bestwert: ${Number(readStored(BEST_KEY))||0} %</p></section>`;
  const recent=history.slice().sort((a,b)=>Date.parse(b.completedAt)-Date.parse(a.completedAt));
  const best=Math.max(Number(readStored(BEST_KEY))||0,...history.map(r=>r.percentage));
  return `<section class="result-section"><h2>Dein Verlauf</h2><p>Letztes Training: <strong>${recent[0].percentage} %</strong><br>Bestwert: <strong>${best} %</strong><br>Vollständige Trainings: <strong>${history.length}</strong></p><ul class="history-list">${recent.map(r=>`<li>${escapeHTML(new Date(r.completedAt).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'}))} · <strong>${r.correct}/${r.total} · ${r.percentage} %</strong></li>`).join('')}</ul></section>`;
}
function showCompletion(){
  if(activeSession().type==='practice'){
    practiceSession.completed=true;
    renderFullResult(`Übungsrunde beendet: ${practiceSession.score}/${practiceSession.total} richtig. Dein vollständiges Ergebnis bleibt unverändert.`);
  }else{completeFullSession();renderFullResult();}
}
function renderFullResult(practiceMessage=''){
  const r=lastFullResult;if(!r)return;
  document.getElementById('mainContent').style.display='none';
  document.getElementById('progressLabel').textContent='Fertig';
  const screen=document.getElementById('completionScreen');screen.classList.add('visible');
  screen.innerHTML=`${practiceMessage?`<p class="training-intro" role="status">${escapeHTML(practiceMessage)}</p>`:''}<section class="result-section completion-main"><h2>Dieses Training</h2><div class="completion-title">${r.percentage===100?'PERFECTUM!':'L05 geschafft!'}</div><div class="completion-score">${r.correct} / ${r.total}<br>${r.percentage} %</div><p>Verben · Wollen · Infinitive</p><div class="result-actions"><button class="start-btn learn" id="shareResult">Ergebnis teilen</button><button class="start-btn training" id="saveResult">Bild speichern</button></div><p id="shareStatus" role="status"></p></section>${buildDiagnosis(r)}<section class="result-section"><h2>Wie möchtest du weiterlernen?</h2><div class="result-actions">${r.wrongAnswers.length?'<button class="start-btn learn" id="practiceErrors">Nur meine Fehler trainieren</button>':''}<button class="start-btn training" id="restartFull">Alles noch einmal trainieren</button></div><a class="home-btn" href="../index.html">← Zurück zur Übersicht</a></section>${historyHTML()}${storageMessage?`<p role="status">${escapeHTML(storageMessage)}</p>`:''}`;
  document.querySelector('.completion-main').appendChild(createShareCanvas(r));
  document.getElementById('restartFull').onclick=startTraining;
  if(r.wrongAnswers.length)document.getElementById('practiceErrors').onclick=startPractice;
  document.getElementById('shareResult').onclick=()=>shareResult(r);
  document.getElementById('saveResult').onclick=()=>saveResult(r);
  window.scrollTo({top:0,behavior:'smooth'});
}
// Local Canvas only: no learner data, external artwork, fonts or requests.
function createShareCanvas(result){
  const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1080;
  const ctx=canvas.getContext('2d');if(!ctx)throw new Error('Canvas nicht verfügbar');
  ctx.fillStyle='#1A1208';ctx.fillRect(0,0,1080,1080);
  ctx.strokeStyle='#C9A84C';ctx.lineWidth=3;ctx.strokeRect(40,40,1000,1000);ctx.strokeRect(54,54,972,972);
  ctx.textAlign='center';ctx.fillStyle='#E8C96A';
  ctx.font='bold 58px Georgia, serif';ctx.fillText('MAGISTRELLA',540,170);
  ctx.fillStyle='#F5EDD6';ctx.font='32px sans-serif';ctx.fillText('Latein-Training',540,230);
  ctx.font='bold 52px Georgia, serif';ctx.fillText('L05 geschafft!',540,350);
  ctx.fillStyle='#E8C96A';ctx.font='bold 130px sans-serif';ctx.fillText(`${result.correct} / ${result.total}`,540,535);
  ctx.font='bold 100px sans-serif';ctx.fillText(`${result.percentage} %`,540,675);
  if(result.percentage===100){ctx.font='bold 36px Georgia, serif';ctx.fillText('PERFECTUM!',540,760);}
  ctx.fillStyle='#F5EDD6';ctx.font='30px sans-serif';ctx.fillText('Verben · Wollen · Infinitive',540,860);
  ctx.font='28px sans-serif';ctx.fillText(new Date(result.completedAt).toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'}),540,945);
  return canvas;
}
function shareBlob(r){return new Promise((resolve,reject)=>{try{createShareCanvas(r).toBlob(blob=>blob?resolve(blob):reject(new Error('PNG konnte nicht erstellt werden')),'image/png');}catch(e){reject(e);}});}
function downloadBlob(blob,r){
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Magistrella-L05-${r.completedAt.slice(0,10)}.png`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
}
async function saveResult(r){try{downloadBlob(await shareBlob(r),r);document.getElementById('shareStatus').textContent='Dein Ergebnisbild wurde zum Speichern bereitgestellt.';}catch{document.getElementById('shareStatus').textContent='Das Bild konnte nicht erstellt werden. Bitte versuche es erneut.';}}
async function shareResult(r){
  try{
    const blob=await shareBlob(r);
    const file=typeof File==='function'?new File([blob],'Magistrella-L05.png',{type:'image/png'}):null;
    if(file && navigator.share && navigator.canShare?.({files:[file]})){
      try{await navigator.share({files:[file],title:'Magistrella · L05'});return;}catch(e){if(e.name==='AbortError')return;}
    }
    downloadBlob(blob,r);document.getElementById('shareStatus').textContent='Teilen ist hier nicht verfügbar. Dein Bild wurde zum Speichern bereitgestellt.';
  }catch{document.getElementById('shareStatus').textContent='Bitte nutze „Bild speichern“ oder versuche es erneut.';}
}



renderIntro();
</script>
