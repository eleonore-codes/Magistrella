// REGELKARTEN
// ═══════════════════════════════════════════════════
var RULE_PRAEP = "<div class=\"rule-title\">\ud83d\udccb Regelkarte \u00b7 Pr\u00e4positionen + Akkusativ</div><div class=\"rule-body\">Diese Pr\u00e4positionen verlangen den <strong style=\"color:var(--gold-light)\">Akkusativ</strong>:<table class=\"rule-table\"><tr><th>Pr\u00e4p.</th><th>Bedeutung</th><th>Beispiel (aus prima.)</th></tr><tr><td class=\"rule-highlight\">ad</td><td>zu, bei</td><td>ad dominum</td></tr><tr><td class=\"rule-highlight\">per</td><td>durch</td><td>per forum</td></tr><tr><td class=\"rule-highlight\">ante</td><td>vor</td><td>ante aedificium</td></tr></table><br><em style=\"color:var(--parchment-dark)\">Am\u012Bc\u012B per forum properant.</em><br>\u2192 Die Freunde eilen durch das Forum.<br><br><em style=\"color:var(--parchment-dark)\">D\u0101vus ad dominum venit.</em><br>\u2192 Davus kommt zum Herrn.</div>";

var RULE_NOM_AKK = "<div class=\"rule-title\">\ud83d\udccb Regelkarte \u00b7 Nominativ & Akkusativ</div><div class=\"rule-body\"><strong style=\"color:var(--gold)\">Nominativ</strong> = Subjekt (wer handelt?)<br><strong style=\"color:var(--gold)\">Akkusativ</strong> = Objekt (wen/was?)<br><br><table class=\"rule-table\"><tr><th></th><th>a-Dek. (f)</th><th>o-Dek. (m)</th></tr><tr><td>Nom. Sg.</td><td>am\u012Bca</td><td>am\u012Bcus</td></tr><tr><td class=\"rule-highlight\">Akk. Sg.</td><td class=\"rule-highlight\">am\u012Bc<u>am</u></td><td class=\"rule-highlight\">am\u012Bc<u>um</u></td></tr></table><br><em style=\"color:var(--parchment-dark)\">Serva am\u012Bcam adiuvat.</em><br>\u2192 Serva (Nom.) hilft am\u012Bcam (Akk.).</div>";

// ═══════════════════════════════════════════════════
// HILFSFUNKTIONEN
// ═══════════════════════════════════════════════════
function shuffle(arr) {
  var a = arr.slice();
  for (var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}

// ═══════════════════════════════════════════════════
// DYNAMISCHE FRAGENGENERATOREN
// ═══════════════════════════════════════════════════
function genMatchVocab(items) {
  var picked = shuffle(items).slice(0,4);
  return { type:"match", showRule:null, theme:"\ud83d\udd17 Vokabeln zuordnen", prompt:"Verbinde Latein mit Deutsch!", leftTitle:"Latein", rightTitle:"Deutsch",
    pairs:picked.map(function(v){return[v.lat,v.de];}),
    affirmation:"Magnifice! Alle richtig! \ud83c\udfc6", wrongMsg:"Schau nochmal in die Vokabelliste oben." };
}

function genSwipeVocab(pool) {
  var v=shuffle(pool)[0];
  var ok=Math.random()>0.5;
  var disp=ok?v.de:shuffle(pool.filter(function(x){return x.lat!==v.lat;}))[0].de;
  return { type:"swipe", showRule:null, theme:"\ud83d\udc4b Bedeutung pr\u00fcfen", prompt:"Stimmt die \u00dcbersetzung?",
    sentence:v.lat+"\n= "+disp, correct:ok,
    affirmation:"Ita! "+v.lat+" = "+v.de+" \u2705",
    wrongMsg:v.lat+" = "+v.de+". Merke dir die Vokabel!" };
}

function genQuickQuiz(pool) {
  var s=shuffle(pool); var t=s[0];
  var d=s.slice(1,4).map(function(v){return v.de;});
  var opts=shuffle([t.de].concat(d));
  return { type:"quickQuiz", showRule:null, theme:"\u26a1 Quick Quiz",
    prompt:"Was bedeutet \u201e"+t.lat+"\u201c?", options:opts, correct:opts.indexOf(t.de),
    affirmation:"Ita! "+t.lat+" = "+t.de+" \ud83c\udfaf",
    wrongMsg:t.lat+" = "+t.de+". Merke dir diese Vokabel!" };
}

function genTrueFalseVocab(pool) {
  var v=shuffle(pool)[0]; var ok=Math.random()>0.5;
  var claim=ok?v.de:shuffle(pool.filter(function(x){return x.lat!==v.lat;}))[0].de;
  return { type:"trueFalse", showRule:null, theme:"\u2705\u274c Wahr oder Falsch?", prompt:"Richtig oder falsch?",
    sentence:"\u201e"+v.lat+"\u201c bedeutet: "+claim, correct:ok,
    affirmation:"Ita! "+v.lat+" = "+v.de+" \u2705",
    wrongMsg:v.lat+" = "+v.de+". Merke dir diese Vokabel!" };
}

function genPraepGap() {
  var f=shuffle(PRAEP_FRAGEN)[0];
  var opts=shuffle(f.opts);
  return { type:"gap", showRule:RULE_PRAEP, theme:"\ud83c\udfd9 Pr\u00e4position w\u00e4hlen",
    prompt:"Welche Pr\u00e4position passt? (aus prima.)", sentence:f.sentence, blank:f.blank,
    options:opts, correct:opts.indexOf(f.correct),
    affirmation:"Ita! "+f.correct+" \u2014 "+f.hint+"! \ud83c\udfd9",
    wrongMsg:f.hint+". Alle drei (ad, per, ante) verlangen den Akkusativ." };
}

function genGenau hinschauen() {
  var s=shuffle(SPOTLIGHT_SAETZE)[0];
  return { type:"spotlight", showRule:RULE_NOM_AKK, theme:"\ud83c\udfaf Subjekt erkennen",
    prompt:"Ist das markierte Wort das Subjekt (Nominativ)?",
    sentence:s.sentence, spotWord:s.spotWord, correct:s.correct,
    affirmation:s.affirmation, wrongMsg:s.wrongMsg };
}

function genPuzzle() {
  var p=shuffle(PUZZLE_SAETZE)[0];
  return { type:"puzzle", showRule:null, theme:"🧩 Satz bauen",
    prompt:"Baue den vollständigen Satz aus dem Originalmaterial.",
    subject:p.subj, tiles:p.tiles.slice(), translation:p.de,
    affirmation:"Perfectum! "+p.tiles.join(" ")+" 🎯",
    wrongMsg:"Achte auf die vollständige Wortfolge des Satzes." };
}

// ═══════════════════════════════════════════════════
// VOKABELBLOECKE
// ═══════════════════════════════════════════════════
var vocabBlocks = [
  { title:"Block 1 \u2014 5 Vokabeln",                    items:POOL.slice(0,5) },
  { title:"Block 2 \u2014 18 Vokabeln",                   items:POOL.slice(5,23) },
  { title:"Block 3 \u2014 11 Vokabeln + Eigennamen",      items:POOL.slice(23) }
];

// ═══════════════════════════════════════════════════
// SESSION AUFBAUEN
// ═══════════════════════════════════════════════════
function buildSession() {
  var b1=POOL.slice(0,5), b2=POOL.slice(5,23), b3=POOL.slice(23);
  var items=[];

  items.push({_vocabBlock:true,blockIndex:0});
  [genMatchVocab(b1.concat(shuffle(b2).slice(0,3))),
   genSwipeVocab(b1.concat(b2.slice(0,5))),
   genPraepGap(),
   genTrueFalseVocab(b1.concat(b2.slice(0,8))),
   genSwipeVocab(b1.concat(b2.slice(0,5)))
  ].forEach(function(q){items.push({_question:true,q:q});});

  items.push({_vocabBlock:true,blockIndex:1});
  [genMatchVocab(b2),
   genQuickQuiz(b1.concat(b2)),
   genGenau hinschauen(),
   genPuzzle(),
   genTrueFalseVocab(b2)
  ].forEach(function(q){items.push({_question:true,q:q});});

  items.push({_vocabBlock:true,blockIndex:2});
  [genMatchVocab(b3),
   genQuickQuiz(POOL),
   genPraepGap(),
   genSwipeVocab(POOL),
   genQuickQuiz(POOL)
  ].forEach(function(q){items.push({_question:true,q:q});});

  return items;
}

var allItems=buildSession();
var currentIndex=0,score=0,totalAnswered=0;
var totalQuestions=allItems.filter(function(i){return i._question;}).length;

// ═══════════════════════════════════════════════════
// ENGINE
// ═══════════════════════════════════════════════════
function updateProgress(){
  var ans=allItems.slice(0,currentIndex+1).filter(function(i){return i._question;}).length;
  document.getElementById("progressLabel").textContent=Math.min(ans,totalQuestions)+"/"+totalQuestions;
}

function renderCurrent(){
  var item=allItems[currentIndex];
  if(!item){showCompletion();return;}
  var main=document.getElementById("mainContent"); main.innerHTML="";
  if(item._vocabBlock){renderVocabBlock(item.blockIndex,main);return;}
  updateProgress();
  var q=item.q;
  if(q.showRule){var rc=document.createElement("div");rc.className="rule-card";rc.innerHTML=q.showRule;main.appendChild(rc);}
  if(q.type==="gap")renderGap(q,main);
  else if(q.type==="trueFalse")renderTrueFalse(q,main);
  else if(q.type==="match")renderMatch(q,main);
  else if(q.type==="puzzle")renderPuzzle(q,main);
  else if(q.type==="quickQuiz")renderQuickQuiz(q,main);
  else if(q.type==="spotlight")renderGenau hinschauen(q,main);
  else if(q.type==="swipe")renderSwipe(q,main);
}

function renderVocabBlock(idx,parent){
  var block=vocabBlocks[idx];
  var hdr=document.createElement("div");hdr.className="section-header";
  hdr.innerHTML="<h2>\ud83d\udcd6 "+block.title+"</h2><p>Lerne diese Vokabeln \u2014 dann kommen die \u00dcbungen!</p>";
  parent.appendChild(hdr);
  var vb=document.createElement("div");vb.className="vocab-block";
  block.items.forEach(function(v){
    var row=document.createElement("div");row.className="vocab-row";
    row.innerHTML="<span class=\"vocab-lat\">"+v.lat+"</span><span class=\"vocab-gen\">"+(v.gen||"")+"</span><span class=\"vocab-de\">"+v.de+"</span>";
    vb.appendChild(row);
  });
  parent.appendChild(vb);
  var continueBtn=document.createElement("button");
  continueBtn.type="button";
  continueBtn.className="next-btn visible";
  continueBtn.textContent="Weiter zu den Übungen →";
  continueBtn.addEventListener("click",function(){currentIndex++;renderCurrent();window.scrollTo({top:0,behavior:"smooth"});});
  parent.appendChild(continueBtn);
}

function makeQCard(q){var c=document.createElement("div");c.className="question-card";c.innerHTML="<div class=\"q-theme\">"+q.theme+"</div>";return c;}
function makeFB(p){var fb=document.createElement("div");fb.className="feedback";fb.id="feedback";p.appendChild(fb);}
function makeNext(p){var btn=document.createElement("button");btn.type="button";btn.className="next-btn";btn.id="nextBtn";btn.textContent=currentIndex>=allItems.length-1?"Lektion abschlie\u00dfen \u2713":"Weiter \u2192";btn.addEventListener("click",function(){currentIndex++;renderCurrent();});p.appendChild(btn);}
function showFB(ok,q){var fb=document.getElementById("feedback"),nb=document.getElementById("nextBtn");totalAnswered++;if(ok){score++;fb.className="feedback correct";fb.innerHTML="<div class=\"feedback-affirmation\">"+q.affirmation+"</div>";if(score%3===0)confetti();}else{fb.className="feedback wrong";fb.innerHTML="<div class=\"feedback-affirmation\">\ud83d\udc9b Fast!</div>"+q.wrongMsg;}if(nb)nb.classList.add("visible");}

function renderGap(q,parent){
  var card=makeQCard(q);
  card.innerHTML+="<div class=\"q-type-badge\">\ud83d\udd22 Richtige Form w\u00e4hlen</div><div class=\"q-prompt\">"+q.prompt+"</div>";
  card.innerHTML+="<div class=\"q-sentence\">"+q.sentence.replace(q.blank,"<span style=\"border-bottom:2px solid var(--gold);min-width:80px;display:inline-block;text-align:center;padding:0 6px;\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>")+"</div>";
  var opts=document.createElement("div");opts.className="gap-options";var letters=["A","B","C"],answered=false;
  q.options.forEach(function(opt,i){var btn=document.createElement("button");btn.type="button";btn.className="gap-btn";btn.innerHTML="<span class=\"gap-btn-letter\">"+letters[i]+"</span><em>"+opt+"</em>";btn.addEventListener("click",function(){if(answered)return;answered=true;var ok=(i===q.correct);btn.classList.add(ok?"correct":"wrong");if(!ok)opts.querySelectorAll(".gap-btn")[q.correct].classList.add("correct");showFB(ok,q);});opts.appendChild(btn);});
  card.appendChild(opts);makeFB(card);makeNext(card);parent.appendChild(card);
}

function renderTrueFalse(q,parent){
  var card=makeQCard(q);
  card.innerHTML+="<div class=\"q-type-badge\">\u2705\u274c Wahr oder Falsch?</div><div class=\"q-prompt\">"+q.prompt+"</div><div class=\"q-sentence\">"+q.sentence+"</div>";
  var opts=document.createElement("div");opts.className="tf-options";var answered=false;
  ["\u2705 Richtig","\u274c Falsch"].forEach(function(label,i){var isTrue=(i===0),btn=document.createElement("button");btn.className="tf-btn";btn.textContent=label;btn.addEventListener("click",function(){if(answered)return;answered=true;var ok=(isTrue===q.correct);btn.classList.add(ok?"correct":"wrong");showFB(ok,q);});opts.appendChild(btn);});
  card.appendChild(opts);makeFB(card);makeNext(card);parent.appendChild(card);
}

function renderMatch(q,parent){
  var card=makeQCard(q);
  card.innerHTML+="<div class=\"q-type-badge\">\ud83d\udd17 Paare zuordnen</div><div class=\"q-prompt\">"+q.prompt+"</div>";
  var lr=document.createElement("div");lr.className="match-col-labels";lr.innerHTML="<div class=\"match-col-label\">"+q.leftTitle+"</div><div class=\"match-col-label\">"+q.rightTitle+"</div>";card.appendChild(lr);
  var pairs=q.pairs.slice(),right=pairs.map(function(p){return p[1];}).sort(function(){return Math.random()-0.5;});
  var grid=document.createElement("div");grid.className="match-grid";
  var selL=null,selR=null,matched=0,lEls=[],rEls=[];
  pairs.forEach(function(pair,i){
    var lEl=document.createElement("button");lEl.type="button";lEl.className="match-item";lEl.textContent=pair[0];
    var rEl=document.createElement("button");rEl.type="button";rEl.className="match-item";rEl.textContent=right[i];
    lEl.addEventListener("click",function(){if(lEl.classList.contains("matched"))return;lEls.forEach(function(e){if(!e.classList.contains("matched"))e.classList.remove("selected");});lEl.classList.add("selected");selL=lEl;tryMatch();});
    rEl.addEventListener("click",function(){if(rEl.classList.contains("matched"))return;rEls.forEach(function(e){if(!e.classList.contains("matched"))e.classList.remove("selected");});rEl.classList.add("selected");selR=rEl;tryMatch();});
    lEls.push(lEl);rEls.push(rEl);grid.appendChild(lEl);grid.appendChild(rEl);
  });
  function tryMatch(){if(!selL||!selR)return;var ok=pairs.some(function(p){return p[0]===selL.textContent&&p[1]===selR.textContent;});if(ok){selL.classList.add("matched");selR.classList.add("matched");matched++;if(matched===pairs.length){showFB(true,q);document.getElementById("nextBtn").classList.add("visible");}}else{selL.classList.add("wrong");selR.classList.add("wrong");var sl=selL,sr=selR;setTimeout(function(){sl.classList.remove("wrong","selected");sr.classList.remove("wrong","selected");selL=null;selR=null;},600);return;}selL=null;selR=null;}
  card.appendChild(grid);makeFB(card);makeNext(card);parent.appendChild(card);
}

function renderPuzzle(q,parent){
  var card=makeQCard(q);
  card.innerHTML+="<div class=\"q-type-badge\">\ud83e\udde9 Satz bauen</div><div class=\"q-prompt\">"+q.prompt+"</div>";
  card.innerHTML+="<div style=\"font-size:12px;color:var(--stone);margin-bottom:10px;font-style:italic;\">\ud83d\udca1 "+q.translation+"</div>";
  var target=document.createElement("div");target.className="puzzle-target";
  var source=document.createElement("div");source.className="puzzle-source";
  var placed=[],shuffled=shuffle(q.tiles),tileEls={};
  shuffled.forEach(function(word){var tile=document.createElement("button");tile.type="button";tile.className="tile";tile.textContent=word;tile.addEventListener("click",function(){if(tile.classList.contains("used")){placed=placed.filter(function(w){return w!==word;});tile.classList.remove("used");rebuild();}else{placed.push(word);tile.classList.add("used");rebuild();}});tileEls[word]=tile;source.appendChild(tile);});
  function rebuild(){target.innerHTML="";placed.forEach(function(word){var t=document.createElement("button");t.type="button";t.className="tile placed";t.textContent=word;t.addEventListener("click",function(){placed=placed.filter(function(w){return w!==word;});tileEls[word].classList.remove("used");rebuild();});target.appendChild(t);});}
  card.appendChild(target);card.appendChild(source);
  var cb=document.createElement("button");cb.type="button";cb.className="check-btn";cb.textContent="Pr\u00fcfen \u2713";
  var puzzleAnswered=false;
  cb.addEventListener("click",function(){
    if(puzzleAnswered)return;
    var ok=placed.length===q.tiles.length&&q.tiles.every(function(w,i){return placed[i]===w;});
    if(ok){puzzleAnswered=true;cb.disabled=true;}
    if(ok){showFB(true,q);confetti();}
    else{
      var fb=document.getElementById("feedback");
      fb.className="feedback wrong";
      fb.innerHTML="<div class=\"feedback-affirmation\">💛 Noch nicht.</div>"+q.wrongMsg;
    }
  });
  card.appendChild(cb);makeFB(card);makeNext(card);parent.appendChild(card);
}

function renderQuickQuiz(q,parent){
  var card=makeQCard(q);
  card.innerHTML+="<div class=\"q-type-badge\">⚡ Kurz-Quiz</div><div class=\"q-prompt\">"+q.prompt+"</div>";
  var opts=document.createElement("div");opts.className="gap-options";var letters=["A","B","C","D"],answered=false;
  q.options.forEach(function(opt,i){
    var btn=document.createElement("button");btn.type="button";btn.className="gap-btn";
    btn.innerHTML="<span class=\"gap-btn-letter\">"+letters[i]+"</span> "+opt;
    btn.addEventListener("click",function(){
      if(answered)return;answered=true;
      var ok=(i===q.correct);btn.classList.add(ok?"correct":"wrong");
      if(!ok)opts.querySelectorAll(".gap-btn")[q.correct].classList.add("correct");
      showFB(ok,q);
    });
    opts.appendChild(btn);
  });
  card.appendChild(opts);makeFB(card);makeNext(card);parent.appendChild(card);
}

function renderGenau hinschauen(q,parent){
  var card=makeQCard(q);card.innerHTML+="<div class=\"q-type-badge\">\ud83c\udfaf Genau hinschauen</div><div class=\"q-prompt\">"+q.prompt+"</div>";
  var sd=document.createElement("div");sd.className="spotlight-sentence";sd.innerHTML=q.sentence.replace(q.spotWord,"<span class=\"spotlight-word\">"+q.spotWord+"</span>");card.appendChild(sd);
  var opts=document.createElement("div");opts.className="tf-options";var answered=false;
  ["\u2705 Ja, Nominativ","\u274c Nein"].forEach(function(label,i){var isTrue=(i===0),btn=document.createElement("button");btn.className="tf-btn";btn.textContent=label;btn.addEventListener("click",function(){if(answered)return;answered=true;var ok=(isTrue===q.correct);btn.classList.add(ok?"correct":"wrong");showFB(ok,q);});opts.appendChild(btn);});
  card.appendChild(opts);makeFB(card);makeNext(card);parent.appendChild(card);
}

function renderSwipe(q,parent){
  var card=makeQCard(q);card.innerHTML+="<div class=\"q-type-badge\">\ud83d\udc4b Richtig oder Falsch?</div><div class=\"q-prompt\">"+q.prompt+"</div>";
  var sc=document.createElement("div");sc.className="swipe-card";sc.textContent=q.sentence;card.appendChild(sc);
  var btns=document.createElement("div");btns.className="swipe-buttons";var answered=false;
  [["\u274c Falsch",false,"left"],["\u2705 Richtig",true,"right"]].forEach(function(arr){var btn=document.createElement("button");btn.type="button";btn.className="swipe-btn "+arr[2];btn.textContent=arr[0];btn.addEventListener("click",function(){if(answered)return;answered=true;showFB((arr[1]===q.correct),q);});btns.appendChild(btn);});
  card.appendChild(btns);makeFB(card);makeNext(card);parent.appendChild(card);
}

function showCompletion(){
  document.getElementById("mainContent").style.display="none";
  var screen=document.getElementById("completionScreen");screen.classList.add("visible");
  var pct=Math.round(score/totalQuestions*100);
  document.getElementById("finalScore").textContent=score+"/"+totalQuestions+" ("+pct+"%)";
  document.getElementById("finalStars").textContent=pct>=90?"\u2b50\u2b50\u2b50":pct>=70?"\u2b50\u2b50":"\u2b50";
  var msgs=["Optime! Am\u012Bc\u012B per forum properant \u2014 und du auch! \ud83c\udfc6","Magnifice! Du kennst den Weg durch Rom! \ud83c\udfd9","Brava! Weiter zu L03! \ud83d\udcd6"];
  document.getElementById("finalMsg").textContent=msgs[Math.floor(Math.random()*msgs.length)];
  confetti();setTimeout(confetti,700);
}

function confetti(){
  var container=document.getElementById("confettiContainer");
  var colors=["#C9A84C","#E8C96A","#C0522B","#4CAF7D","#FDFAF3","#8B6914"];
  for(var i=0;i<30;i++){(function(i){setTimeout(function(){var el=document.createElement("div");el.className="confetti-piece";el.style.left=Math.random()*100+"vw";el.style.background=colors[Math.floor(Math.random()*colors.length)];el.style.animationDuration=(1.5+Math.random()*2)+"s";el.style.width=el.style.height=(6+Math.random()*10)+"px";container.appendChild(el);setTimeout(function(){el.remove();},3500);},i*40);})(i);}
}

renderCurrent();
</script>
