<style>

  body{

  .back-btn{

  .topbar-info{flex:1;}

  .topbar-title{
    font-size:14px;
    font-style:italic;

  .topbar-sub{

  .topbar-progress{

  .goal-chip{

  .rule-card{

    border-radius:16px;
    padding:18px;
    color:#261B0D;
    position:relative;
    overflow:hidden;
  }

  .rule-card::before{
    content:'';
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:3px;
    background:linear-gradient(90deg,var(--gold-dark),var(--gold-light),var(--gold-dark));
  }

  .rule-title{
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#765207;
    font-weight:800;
    margin-bottom:10px;
  }

  .rule-body{
    font-size:15px;
    color:#312513;
    line-height:1.7;
  }

  .rule-body strong{color:#745107;}

  .rule-table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
    font-size:13px;
  }

  .rule-table th{
    background:rgba(139,105,20,.14);
    color:#604407;
    padding:6px 7px;
    text-align:left;
    font-size:11px;
  }

  .rule-table td{
    padding:6px 7px;
    border-bottom:1px solid rgba(80,55,5,.14);
    color:#2E2110;
  }

  .rule-table tr:last-child td{border-bottom:none;}

  .rule-highlight{
    color:#684A06 !important;
    font-weight:800;
  }

  .rule-example{
    margin-top:12px;

    background:rgba(255,255,255,.45);
    border-left:3px solid var(--gold-dark);
    border-radius:9px;
  }

  .section-header{

    border-left:3px solid var(--gold);

  }

  .section-header h2{
    font-size:16px;
    color:var(--gold-light);
  }

  .section-header p{
    font-size:14px;
    color:var(--stone);
    margin-top:2px;
  }

  .vocab-block{
    margin:12px 16px;
    background:rgba(0,0,0,.2);
    border:1px solid rgba(201,168,76,.15);

    font-style:italic;

  .vocab-gen{
    font-size:13px;
    color:var(--gold);
    min-width:76px;
    flex-shrink:0;
  }

  .vocab-de{
    font-size:15px;
    color:var(--parchment-dark);
    flex:1;
  }

  .question-card{
    margin:0 16px 16px;
    background:var(--ink-mid);
    border:1px solid rgba(201,168,76,.15);
    border-radius:20px;
    padding:20px;
    animation:slideUp .25s ease;

  @keyframes slideUp{
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:translateY(0)}

  .q-theme{
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:8px;
  }

  .q-type-badge{
    display:inline-block;
    background:rgba(201,168,76,.15);
    border:1px solid rgba(201,168,76,.3);
    border-radius:99px;
    padding:4px 10px;
    font-size:12px;
    color:var(--gold-light);
    margin-bottom:12px;

  .q-prompt{
    font-size:17px;
    color:var(--parchment);
    line-height:1.5;
    margin-bottom:14px;
  }

  .q-sentence{
    font-size:18px;
    color:var(--white);
    text-align:center;
    margin-bottom:16px;
    line-height:1.6;
    padding:13px;
    background:rgba(0,0,0,.2);
    border-radius:12px;
    font-style:italic;

  .gap-options{

    flex-direction:column;
    gap:10px;
  }

  .gap-btn{

    border-radius:14px;

    text-align:left;

    color:#9BE6BC;

  .gap-btn.wrong{

    border-color:var(--red-wrong);
    color:#FFB2B2;
  }

    height:28px;
    flex:0 0 28px;

    border-radius:8px;

    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:800;
    color:var(--gold-light);

    display:grid;
    grid-template-columns:1fr 1fr;

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:4px;
  }

    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--gold);
    text-align:center;
  }

    background:rgba(255,255,255,.04);
    border:1.5px solid rgba(201,168,76,.2);
    border-radius:12px;
    padding:9px;
    font-size:14px;
    color:#fff;
    cursor:pointer;
    text-align:center;
    min-height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .match-item.selected{
    background:rgba(201,168,76,.2);
    border-color:var(--gold);
    color:var(--gold-light);
  }

  .match-item.matched{
    background:rgba(76,175,125,.15);
    border-color:var(--green-ok);
    color:#9BE6BC;
    pointer-events:none;
  }

  .match-item.wrong{
    background:rgba(224,80,80,.12);
    border-color:var(--red-wrong);
  }

  .feedback{
    margin-top:14px;
    padding:14px;
    border-radius:14px;
    font-size:14px;
    line-height:1.55;
    display:none;
  }

  .feedback.correct{
    display:block;
    background:rgba(76,175,125,.12);
    border:1px solid rgba(76,175,125,.3);
    color:#8EE2B3;
  }

  .feedback.wrong{
    display:block;
    background:rgba(224,80,80,.09);
    border:1px solid rgba(224,80,80,.28);
    color:#F3B1B1;
  }

  .feedback-affirmation{
    font-size:15px;
    font-weight:800;
    margin-bottom:5px;
  }

  .next-btn{
    width:100%;
    background:linear-gradient(135deg,var(--gold-dark),var(--gold));
    border:none;
    border-radius:14px;
    padding:15px;
    font-size:15px;
    color:var(--ink);
    font-weight:800;
    cursor:pointer;
    margin-top:12px;
    display:none;
  }

  .next-btn.visible{display:block;}

  .next-btn:active{transform:scale(.98);}

  .completion{
    display:none;
    text-align:center;
    padding:40px 24px;
  }

  .completion.visible{display:block;}

  .completion-emoji{
    font-size:62px;
    margin-bottom:14px;
  }

  .completion-title{
    font-size:26px;
    color:var(--gold-light);
    margin-bottom:8px;
  }

  .completion-score{
    font-size:42px;
    font-weight:800;
    color:var(--gold);
    margin:14px 0;
  }

  .completion-stars{
    font-size:32px;
    margin-bottom:18px;
    letter-spacing:6px;
  }

  .completion-msg{
    font-size:15px;
    color:var(--parchment-dark);
    line-height:1.6;
    margin:0 auto 28px;
    max-width:500px;
  }

  .home-btn{
    display:inline-block;
    background:linear-gradient(135deg,var(--gold-dark),var(--gold));
    border-radius:14px;
    padding:14px 28px;
    font-size:15px;
    color:var(--ink);
    font-weight:800;
    text-decoration:none;
  }

  button:focus-visible,
  a:focus-visible{
    outline:3px solid #FFF1A8;
    outline-offset:3px;
  }

  @media(max-width:500px){
    .lesson-goals{grid-template-columns:1fr;}

    .vocab-row{
      flex-wrap:wrap;
      align-items:flex-start;
    }

    .vocab-lat{min-width:105px;}

    .rule-table{font-size:12px;}

    .rule-table th,
    .rule-table td{
      padding:5px 4px;
    }
  }

  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.01ms!important;
      transition-duration:.01ms!important;
    }
  }
</style>
</head>

  {nomSg:"serva",nomPl:"servae",akkSg:"servam",akkPl:"servās",decl:"a-Deklination",genus:"f",de:"Sklavin"},

var RULE_NOM_AKK = `
<div class="rule-title">Regel · Nominativ und Akkusativ</div>
<div class="rule-body">

<strong>Nominativ</strong>: Wer oder was handelt? → häufig das Subjekt.

<br><br>

<strong>Akkusativ</strong>: Wen oder was betrifft die Handlung? → kann ein Akkusativobjekt sein.

<table class="rule-table">
<tr>
<th></th>
<th>Nom. Sg.</th>
<th>Akk. Sg.</th>
<th>Nom. Pl.</th>
<th>Akk. Pl.</th>
</tr>

<tr>
<td>a-Dekl.</td>
<td>serva</td>
<td class="rule-highlight">servam</td>
<td>servae</td>
<td class="rule-highlight">servās</td>
</tr>

<tr>
<td>o-Dekl. m.</td>
<td>servus</td>
<td class="rule-highlight">servum</td>
<td>servī</td>
<td class="rule-highlight">servōs</td>
</tr>

<tr>
<td>o-Dekl. n.</td>
<td>frūmentum</td>
<td class="rule-highlight">frūmentum</td>
<td>frūmenta</td>
<td class="rule-highlight">frūmenta</td>
</tr>

<tr>
<td>3. Dekl.</td>
<td>mercātor</td>

<td>mercātōrēs</td>
<td class="rule-highlight">mercātōrēs</td>
</tr>
</table>

<div class="rule-example">
<strong>Wichtig beim Neutrum:</strong><br>
Nominativ und Akkusativ sehen gleich aus.<br>
frūmentum → Nom. Sg. oder Akk. Sg.<br>
frūmenta → Nom. Pl. oder Akk. Pl.
</div>

</div>`;

var RULE_OBJEKT_ADVERBIALE = `
<div class="rule-title">Regel · Objekt oder Adverbiale?</div>
<div class="rule-body">

Nicht jeder Akkusativ ist automatisch ein Objekt.

<br><br>

Populus <strong>equōs</strong> exspectat.<br>

<br><br>

<strong>Präposition + Akkusativ:</strong><br>
Equī <strong>per circum</strong> properant.<br>
→ durch den Circus

<br><br>

</div>`;

var RULE_WORD_ORDER = `
<div class="rule-title">Übersetzungsstrategie · Wortstellung</div>
<div class="rule-body">

Latein und Deutsch haben nicht immer dieselbe Wortstellung.

<br><br>

Im lateinischen Hauptsatz steht das Prädikat häufig weiter hinten oder am Satzende.

<br><br>

Im deutschen Aussagesatz steht die finite Verbform normalerweise an <strong>zweiter Stelle</strong>.

<div class="rule-example">
Amīcī per forum properant.<br>
→ Die Freunde <strong>eilen</strong> durch das Forum.
</div>

<strong>Übersetze daher nicht einfach Wort für Wort in derselben Reihenfolge.</strong>

</div>`;

function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var temp=a[i];
    a[i]=a[j];
    a[j]=temp;
  }
  return a;
}

function one(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function unique(arr){
  return arr.filter(function(v,i,a){
    return a.indexOf(v)===i;
  });
}

function genMatchVocab(pool){
  var picked=shuffle(pool).slice(0,4);

  return{
    type:"match",
    showRule:null,
    theme:"Vokabeln",
    prompt:"Verbinde Latein mit der passenden deutschen Bedeutung.",
    leftTitle:"Latein",
    rightTitle:"Deutsch",
    pairs:picked.map(function(v){return [v.lat,v.de];}),
    affirmation:"Alle vier Zuordnungen stimmen.",
    wrongMsg:"Prüfe die Bedeutungen noch einmal."
  };
}

function genAkkusativForm(){
  var n=one(NOUN_FORMS);
  var plural=Math.random()>.5;
  var correct=plural?n.akkPl:n.akkSg;

  var candidatePool=unique(
    [n.nomSg,n.nomPl,n.akkSg,n.akkPl].concat(
      NOUN_FORMS.map(function(x){
        return plural?x.akkPl:x.akkSg;
      })
    )
  );

  candidatePool=candidatePool.filter(function(x){
    return x!==correct;
  });

  var opts=shuffle([correct].concat(shuffle(candidatePool).slice(0,2)));

  return{
    type:"gap",
    showRule:RULE_NOM_AKK,
    theme:"Akkusativ bilden",
    prompt:plural
      ?"Welche Form ist der Akkusativ Plural?"
      :"Welche Form ist der Akkusativ Singular?",
    sentence:n.nomSg+" · "+n.de,
    blank:null,
    options:opts,
    correct:opts.indexOf(correct),
    affirmation:correct+" ist der Akkusativ "+(plural?"Plural":"Singular")+".",
    wrongMsg:"Gesucht war "+correct+"."
  };
}

function genKasusNumerus(){
  var all=[];

  NOUN_FORMS.forEach(function(n){
    var candidates=[
      {form:n.nomSg,label:"Nominativ Singular"},
      {form:n.nomPl,label:"Nominativ Plural"},
      {form:n.akkSg,label:"Akkusativ Singular"},
      {form:n.akkPl,label:"Akkusativ Plural"}
    ];

    candidates.forEach(function(c){
      var same=candidates.filter(function(x){
        return x.form===c.form;
      });

      if(same.length===1){
        all.push(c);
      }
    });
  });

  var target=one(all);

  var opts=shuffle([
    "Nominativ Singular",
    "Nominativ Plural",
    "Akkusativ Singular",
    "Akkusativ Plural"
  ]);

  return{
    type:"gap",
    showRule:RULE_NOM_AKK,
    theme:"Kasus und Numerus",
    prompt:"Bestimme Kasus und Numerus dieser Form.",
    sentence:target.form,
    blank:null,
    options:opts,
    correct:opts.indexOf(target.label),
    affirmation:target.form+" = "+target.label+".",
    wrongMsg:"Diese Form ist hier als "+target.label+" eindeutig bestimmbar."
  };
}

function genNomOderAkk(){

      sentence:"Populus equōs exspectat.",
      word:"Populus",
      answer:"Nominativ",
      why:"Populus ist das Subjekt: Das Volk erwartet."
    },
    {
      sentence:"Populus equōs exspectat.",
      word:"equōs",
      answer:"Akkusativ",
      why:"equōs beantwortet hier die Frage: Wen oder was erwartet das Volk?"
    },
    {
      sentence:"Servī Afram spectant.",
      word:"Servī",
      answer:"Nominativ",
      why:"Servī ist das handelnde Subjekt."
    },
    {
      sentence:"Servī Afram spectant.",
      word:"Afram",
      answer:"Akkusativ",
      why:"Afram ist das Akkusativobjekt."
    },
    {
      sentence:"Dāvus Pompōnium mercātōrem spectat.",
      word:"Pompōnium mercātōrem",
      answer:"Akkusativ",
      why:"Wen betrachtet Davus? → Pompōnium mercātōrem."
    }
  ];

  var q=one(questions);
  var opts=shuffle(["Nominativ","Akkusativ"]);

  return{
    type:"gap",

    theme:"Nominativ oder Akkusativ?",

}

var vocabBlocks=[
  {title:"Block 1",items:POOL.slice(0,5)},
  {title:"Block 2",items:POOL.slice(5,23)},
  {title:"Block 3",items:POOL.slice(23)}
];

function buildSession(){
  var b1=POOL.slice(0,5);
  var b2=POOL.slice(5,23);
  var b3=POOL.slice(23);

  var items=[];

  items.push({_vocabBlock:true,blockIndex:0});

  [
    genMatchVocab(b1.concat(shuffle(b2).slice(0,3))),
    genNomOderAkk(),
    genAkkusativForm(),
    genKasusNumerus(),
    genVerbKongruenz(),
    genPraepGap()
  ].forEach(function(q){
    items.push({_question:true,q:q});
  });

  items.push({_vocabBlock:true,blockIndex:1});

  [
    genMatchVocab(b2),
    genAkkusativForm(),
    genNomOderAkk(),
    genObject(),
    genNeutrum(),
    genKasusNumerus()
  ].forEach(function(q){
    items.push({_question:true,q:q});
  });

  items.push({_vocabBlock:true,blockIndex:2});

  [
    genMatchVocab(b3),
    genPraepGap(),
    genObject(),
    genVerbKongruenz(),
    genWordOrder(),
    genWordOrder()
  ].forEach(function(q){
    items.push({_question:true,q:q});
  });

  return items;
}

var allItems=buildSession();
var currentIndex=0;
var score=0;

var totalQuestions=allItems.filter(function(i){
  return i._question;
}).length;

function updateProgress(){
  var questionsBefore=allItems
    .slice(0,currentIndex+1)
    .filter(function(i){
      return i._question;
    }).length;

  document.getElementById("progressLabel").textContent=
    Math.min(questionsBefore,totalQuestions)+"/"+totalQuestions;
}

function renderCurrent(){
  var item=allItems[currentIndex];

  if(!item){
    showCompletion();
    return;
  }

  var main=document.getElementById("mainContent");
  main.innerHTML="";

  if(item._vocabBlock){
    renderVocabBlock(item.blockIndex,main);
    return;
  }

  updateProgress();

  var q=item.q;

  if(q.showRule){
    var rc=document.createElement("div");
    rc.className="rule-card";
    rc.innerHTML=q.showRule;
    main.appendChild(rc);
  }

  if(q.type==="gap"){
    renderGap(q,main);
  } else if(q.type==="match"){
    renderMatch(q,main);
  }
}

function makeQCard(q){
  var c=document.createElement("div");
  c.className="question-card";
  c.innerHTML="<div class=\"q-theme\">"+q.theme+"</div>";
  return c;
}

function makeFB(parent){
  var fb=document.createElement("div");
  fb.className="feedback";
  fb.id="feedback";
  parent.appendChild(fb);
}

function makeNext(parent){
  var btn=document.createElement("button");

  btn.type="button";
  btn.className="next-btn";
  btn.id="nextBtn";

  btn.textContent=
    currentIndex>=allItems.length-1
      ?"Lektion abschließen ✓"
      :"Weiter →";

  btn.addEventListener("click",function(){
    currentIndex++;
    renderCurrent();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });
  });

  parent.appendChild(btn);
}

function showFB(ok,q){
  var fb=document.getElementById("feedback");
  var next=document.getElementById("nextBtn");

  if(ok){
    score++;

    fb.className="feedback correct";
    fb.innerHTML=
      "<div class=\"feedback-affirmation\">Richtig.</div>"+
      q.affirmation;

  } else {

    fb.className="feedback wrong";
    fb.innerHTML=
      "<div class=\"feedback-affirmation\">Noch nicht richtig.</div>"+
      q.wrongMsg;
  }

  if(next){
    next.classList.add("visible");
  }
}

function renderGap(q,parent){
  var card=makeQCard(q);

  card.innerHTML+=
    "<div class=\"q-type-badge\">Form auswählen</div>"+
    "<div class=\"q-prompt\">"+q.prompt+"</div>";

  if(q.sentence){
    var sentence=q.sentence;

    if(q.blank){
      sentence=sentence.replace(
        q.blank,
        "<span style=\"border-bottom:2px solid var(--gold);min-width:70px;display:inline-block;\">&nbsp;</span>"
      );
    }

    card.innerHTML+=
      "<div class=\"q-sentence\">"+sentence+"</div>";
  }

  var opts=document.createElement("div");
  opts.className="gap-options";

  var letters=["A","B","C","D"];
  var answered=false;

  q.options.forEach(function(opt,i){
    var btn=document.createElement("button");

    btn.type="button";
    btn.className="gap-btn";

    btn.innerHTML=
      "<span class=\"gap-btn-letter\">"+letters[i]+"</span>"+
      "<span>"+opt+"</span>";

    btn.addEventListener("click",function(){
      if(answered)return;

      answered=true;

      var ok=i===q.correct;

      btn.classList.add(ok?"correct":"wrong");

      if(!ok){
        var all=opts.querySelectorAll(".gap-btn");
        all[q.correct].classList.add("correct");
      }

      showFB(ok,q);
    });

    opts.appendChild(btn);
  });

  card.appendChild(opts);

  makeFB(card);
  makeNext(card);

  parent.appendChild(card);
}

function renderMatch(q,parent){
  var card=makeQCard(q);

  card.innerHTML+=
    "<div class=\"q-type-badge\">Paare zuordnen</div>"+
    "<div class=\"q-prompt\">"+q.prompt+"</div>";

  var labels=document.createElement("div");
  labels.className="match-col-labels";

  labels.innerHTML=
    "<div class=\"match-col-label\">"+q.leftTitle+"</div>"+
    "<div class=\"match-col-label\">"+q.rightTitle+"</div>";

  card.appendChild(labels);

  var pairs=q.pairs.slice();

  var right=shuffle(
    pairs.map(function(p){
      return p[1];
    })
  );

  var grid=document.createElement("div");
  grid.className="match-grid";

  var selectedLeft=null;
  var selectedRight=null;
  var matched=0;

  var leftElements=[];
  var rightElements=[];

  pairs.forEach(function(pair,i){
    var left=document.createElement("button");
    left.type="button";
    left.className="match-item";
    left.textContent=pair[0];

    var rightBtn=document.createElement("button");
    rightBtn.type="button";
    rightBtn.className="match-item";
    rightBtn.textContent=right[i];

    left.addEventListener("click",function(){
      if(left.classList.contains("matched"))return;

      leftElements.forEach(function(el){
        if(!el.classList.contains("matched")){
          el.classList.remove("selected");
        }
      });

      left.classList.add("selected");
      selectedLeft=left;

      tryMatch();
    });

    rightBtn.addEventListener("click",function(){
      if(rightBtn.classList.contains("matched"))return;

      rightElements.forEach(function(el){
        if(!el.classList.contains("matched")){
          el.classList.remove("selected");
        }
      });

      rightBtn.classList.add("selected");
      selectedRight=rightBtn;

      tryMatch();
    });

    leftElements.push(left);
    rightElements.push(rightBtn);

    grid.appendChild(left);
    grid.appendChild(rightBtn);
  });

  function tryMatch(){
    if(!selectedLeft || !selectedRight)return;

    var ok=pairs.some(function(p){
      return(
        p[0]===selectedLeft.textContent &&
        p[1]===selectedRight.textContent
      );
    });

    if(ok){
      selectedLeft.classList.add("matched");
      selectedRight.classList.add("matched");

      matched++;

      if(matched===pairs.length){
        showFB(true,q);
      }

    } else {

      selectedLeft.classList.add("wrong");
      selectedRight.classList.add("wrong");

      var oldLeft=selectedLeft;
      var oldRight=selectedRight;

      setTimeout(function(){
        oldLeft.classList.remove("wrong","selected");
        oldRight.classList.remove("wrong","selected");
      },550);
    }

    selectedLeft=null;
    selectedRight=null;
  }

  card.appendChild(grid);

  makeFB(card);
  makeNext(card);

  parent.appendChild(card);
}

}
