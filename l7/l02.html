<style>

*{

}

body{

button{

/* =====================================================
   TOPBAR
===================================================== */

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 16px;
  background:rgba(26,18,8,.96);
  backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(201,168,76,.2);
}

.back-btn{
  color:var(--gold);
  text-decoration:none;
  font-size:20px;
  padding:4px 8px 4px 0;
}

.topbar-info{
  flex:1;
}

.topbar-title{
  color:var(--gold-light);
  font-size:14px;
  font-style:italic;
}

.topbar-sub{
  color:var(--stone);
  font-size:12px;
}

.topbar-progress{
  color:var(--gold);
  font-weight:800;
  font-size:13px;
  min-width:55px;
  text-align:right;
}

/* =====================================================
   INTRO
===================================================== */

.lesson-intro{
  margin:16px;
  padding:18px;
  border:1px solid rgba(201,168,76,.25);
  border-radius:18px;
  background:linear-gradient(
    135deg,
    rgba(201,168,76,.12),
    rgba(201,168,76,.03)
  );
}

.lesson-kicker{
  color:var(--gold);
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:2px;
}

.lesson-intro h1{
  color:var(--gold-light);
  font-size:24px;
  line-height:1.25;
  margin:5px 0 10px;
}

.lesson-intro p{
  color:var(--parchment-dark);
  font-size:15px;
}

.lesson-goals{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px;
}

.goal-chip{
  background:rgba(0,0,0,.18);
  border:1px solid rgba(201,168,76,.16);
  border-radius:11px;
  padding:8px 10px;
  font-size:13px;
  color:var(--parchment-dark);
}

/* =====================================================
   LERNKARTEN
===================================================== */

.teach-card{
  margin:16px;
  border-radius:18px;
  overflow:hidden;
  background:var(--parchment);
  color:#2A1F0E;
  border:1px solid rgba(201,168,76,.55);
}

.teach-head{
  padding:13px 16px;
  background:var(--parchment-dark);
  border-bottom:1px solid rgba(90,60,10,.12);
}

.teach-kicker{
  color:#735108;
  text-transform:uppercase;
  font-size:11px;
  letter-spacing:2px;
  font-weight:800;
}

.teach-head h2{
  color:#2A1F0E;
  font-size:20px;
  line-height:1.3;
  margin-top:2px;
}

.teach-body{
  padding:16px;
  font-size:15px;
}

.teach-body p + p{
  margin-top:10px;
}

.teach-body strong{
  color:#6C4B06;
}

.teach-example{
  margin-top:14px;
  padding:12px;
  background:rgba(255,255,255,.55);
  border-left:4px solid var(--gold-dark);
  border-radius:10px;
}

.teach-example .latin{
  font-size:17px;
  font-weight:800;
  font-style:italic;
  color:#2A1F0E;
}

.teach-example .german{
  margin-top:2px;
  color:#594931;
}

.mini-rule{
  margin-top:14px;
  padding:11px 12px;
  border:1px solid rgba(139,105,20,.25);
  border-radius:10px;
  background:#FFF9EA;
  color:#594006;
  font-weight:700;
}

/* =====================================================
   TABELLEN
===================================================== */

.rule-table{
  width:100%;
  border-collapse:collapse;
  margin-top:14px;
  font-size:13px;
}

.rule-table th{
  background:rgba(139,105,20,.13);
  color:#654807;
  padding:7px 6px;
  text-align:left;
  font-size:11px;
}

.rule-table td{
  color:#2E2110;
  padding:7px 6px;
  border-bottom:1px solid rgba(80,55,5,.14);
  vertical-align:top;
}

.rule-table tr:last-child td{
  border-bottom:none;
}

.rule-highlight{
  color:#694A06 !important;
  font-weight:800;
}

/* =====================================================
   TRAINING
===================================================== */

.training-intro{
  margin:16px;
  padding:16px;
  border-radius:16px;
  border:1px solid rgba(201,168,76,.25);
  background:rgba(201,168,76,.07);
}

.training-intro h2{
  color:var(--gold-light);
  font-size:19px;
  margin-bottom:5px;
}

.training-intro p{
  color:var(--parchment-dark);
  font-size:14px;
}

.question-card{
  margin:16px;
  padding:20px;
  border-radius:20px;
  background:var(--ink-mid);
  border:1px solid rgba(201,168,76,.15);
  animation:slideUp .22s ease;
}

@keyframes slideUp{
  from{
    opacity:0;
    transform:translateY(14px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.q-theme{
  color:var(--gold);
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:2px;
  margin-bottom:8px;
}

.q-type-badge{
  display:inline-block;
  padding:4px 10px;
  border-radius:99px;
  background:rgba(201,168,76,.14);
  border:1px solid rgba(201,168,76,.28);
  color:var(--gold-light);
  font-size:12px;
  margin-bottom:12px;
}

.q-prompt{
  font-size:17px;
  color:var(--parchment);
  margin-bottom:14px;
}

.q-sentence{
  font-size:18px;
  color:var(--white);
  text-align:center;
  font-style:italic;
  background:rgba(0,0,0,.2);
  border-radius:12px;
  padding:13px;
  margin-bottom:16px;
}

.q-helper{
  color:var(--stone);
  font-size:13px;
  margin-top:-6px;
  margin-bottom:14px;
}

.options{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.option-btn{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 15px;
  border-radius:14px;
  border:1.5px solid rgba(201,168,76,.25);
  background:rgba(255,255,255,.04);
  color:#fff;
  cursor:pointer;
  text-align:left;
  transition:.15s;
}

.option-btn:active{
  transform:scale(.98);
}

.option-btn.correct{
  background:rgba(76,175,125,.15);
  border-color:var(--green-ok);
  color:#9FE7BD;
}

.option-btn.wrong{
  background:rgba(224,80,80,.12);
  border-color:var(--red-wrong);
  color:#FFB6B6;
}

.option-letter{
  width:28px;
  height:28px;
  flex:0 0 28px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  background:rgba(201,168,76,.15);
  color:var(--gold-light);
  font-size:12px;
  font-weight:800;
}

.feedback{
  display:none;
  margin-top:14px;
  padding:14px;
  border-radius:14px;
  font-size:14px;
  line-height:1.55;
}

.feedback.correct{
  display:block;
  background:rgba(76,175,125,.12);
  border:1px solid rgba(76,175,125,.3);
  color:#91E2B3;
}

.feedback.wrong{
  display:block;
  background:rgba(224,80,80,.09);
  border:1px solid rgba(224,80,80,.28);
  color:#F2B0B0;
}

.feedback-title{
  font-weight:800;
  margin-bottom:5px;
}

.feedback-tip{
  margin-top:8px;
  color:#F5E7B8;
}

/* =====================================================
   BUTTONS
===================================================== */

.continue-btn,
.next-btn{
  width:calc(100% - 32px);
  margin:12px 16px 16px;
  padding:15px;
  border:none;
  border-radius:14px;
  background:linear-gradient(
    135deg,
    var(--gold-dark),
    var(--gold)
  );
  color:var(--ink);
  font-weight:800;
  cursor:pointer;
}

.next-btn{
  width:100%;
  margin:14px 0 0;
  display:none;
}

.next-btn.visible{
  display:block;
}

.continue-btn:active,
.next-btn:active{
  transform:scale(.98);
}

/* =====================================================
   COMPLETION
===================================================== */

.completion{
  display:none;
  text-align:center;
  padding:40px 24px;
}

.completion.visible{
  display:block;
}

.completion-symbol{
  font-size:60px;
  margin-bottom:12px;
}

.completion-title{
  color:var(--gold-light);
  font-size:27px;
  margin-bottom:8px;
}

.completion-score{
  color:var(--gold);
  font-size:42px;
  font-weight:800;
  margin:14px 0;
}

.completion-stars{
  font-size:32px;
  margin-bottom:18px;
  letter-spacing:6px;
}

.completion-msg{
  color:var(--parchment-dark);
  max-width:520px;
  margin:0 auto 25px;
  font-size:15px;
}

.home-btn{
  display:inline-block;
  padding:14px 25px;
  border-radius:14px;
  background:linear-gradient(
    135deg,
    var(--gold-dark),
    var(--gold)
  );
  color:var(--ink);
  font-weight:800;
  text-decoration:none;
}

button:focus-visible,
a:focus-visible{
  outline:3px solid #FFF1A8;
  outline-offset:3px;
}

@media(max-width:540px){

  .lesson-goals{
    grid-template-columns:1fr;
  }

  .rule-table{
    font-size:11.5px;
  }

  .rule-table th,
  .rule-table td{
    padding:6px 3px;
  }

}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}

<script>
"use strict";


/* =====================================================
   L02 – GRAMMATISCHER SCOPE

   L01 wird wiederholt:
   - Singular und Plural
   - Deklinationsklassen
   - Kongruenz
   - 3. Person Singular / Plural

   Neu:
   - Kasus
   - Nominativ und Akkusativ
   - Akkusativ Singular und Plural
   - Akkusativobjekt
   - Präposition + Akkusativ
   - Objekt vs. Adverbiale
   - Neutrum: Nom. = Akk.
   - Wortstellung Latein → Deutsch
===================================================== */


/* =====================================================
   DATEN
===================================================== */

const NOUNS = [

  {

    akkSg:"servam",
    nomPl:"servae",

    de:"Sklavin / Dienerin",

  },

  {

  },

  {

  },

  {

  {

  },

  {

  },

  {

    de:"Sklave / Diener",
    decl:"o-Deklination",
    genus:"m"
  },

  {
    nomSg:"amīcus",
    akkSg:"amīcum",
    nomPl:"amīcī",
    akkPl:"amīcōs",
    de:"Freund",
    decl:"o-Deklination",
    genus:"m"
  },

  {
    nomSg:"dominus",
    akkSg:"dominum",
    nomPl:"dominī",
    akkPl:"dominōs",
    de:"Herr",
    decl:"o-Deklination",
    genus:"m"
  },

  {
    nomSg:"equus",
    akkSg:"equum",
    nomPl:"equī",

  },

  {

  },

  {

    de:"Forum / Marktplatz",

  },

  {

  },

  {

  },

  {

  {

  {

  {

const VERBS = [

  {
    inf:"properāre",
    sg:"properat",
    pl:"properant",
    de:"eilen / sich beeilen"
  },

  {
    inf:"reperīre",
    sg:"reperit",

  },

  {

const PREPOSITIONS = [

  {
    lat:"ad",
    de:"zu / nach / bei",
    example:"ad dominum",
    exampleDe:"zum Herrn"
  },

  {
    lat:"per",
    de:"durch",
    example:"per forum",
    exampleDe:"durch das Forum"
  },

  {
    lat:"ante",
    de:"vor",
    example:"ante aedificium",
    exampleDe:"vor dem Gebäude"
  }

const SMALL_VOCAB = [

  {lat:"diū",de:"lange / lange Zeit"},
  {lat:"itaque",de:"deshalb"},
  {lat:"iterum",de:"wieder(um) / zum zweiten Mal"},
  {lat:"iam",de:"schon / bereits / nun"},
  {lat:"subitō",de:"plötzlich"},
  {lat:"nōn iam",de:"nicht mehr"},
  {lat:"iō!",de:"Hurra! / Ha! / Ach!"},
  {lat:"nōs",de:"uns"},
  {lat:"statim",de:"sofort / auf der Stelle"},
  {lat:"bene",de:"gut"},
  {lat:"ecce!",de:"Schau! / Schaut! / Sieh da! / Seht da!"},
  {lat:"semper",de:"immer"}

];


/* =====================================================
   HILFSFUNKTIONEN
===================================================== */

// Vokabelheft, L02, Seiten 7–9: 31 Lernwörter und sieben Eigennamen (E).
// Eigennamen haben eigene Akkusativformen und werden nicht künstlich pluralisiert.
const PROPER_NAMES = [
  {lat:"Aventīnus",akk:"Aventīnum",genus:"m",de:"der Aventin (einer der sieben Hügel Roms)"},
  {lat:"Capitōlium",akk:"Capitōlium",genus:"n",de:"das Kapitol (einer der sieben Hügel Roms)"},
  {lat:"Circus Maximus",akk:"Circum Maximum",genus:"m",de:"der Circus Maximus (Pferderennbahn)"},
  {lat:"Colossēum",akk:"Colossēum",genus:"n",de:"das Kolosseum"},
  {lat:"forum Boārium",akk:"forum Boārium",genus:"n",de:"das Forum Boarium (Rindermarkt)"},
  {lat:"Iuppiter",akk:"Iovem",genus:"m",de:"Jupiter (der höchste Gott der Römer)"},
  {lat:"Palātīnus",akk:"Palātīnum",genus:"m",de:"der Palatin (einer der sieben Hügel Roms)"}
];
const L02_NOUNS = NOUNS.filter(n=>["forum","circus","amīcus","amīca","via","aedificium","taberna","senātor","bēstia"].includes(n.nomSg));
const L02_VERBS = VERBS.filter(v=>!["vidēre","venīre"].includes(v.inf));
const MEANING_VOCAB = [
  ...NOUNS.map(n=>({lat:n.nomSg,de:n.de})),
  ...VERBS.map(v=>({lat:v.inf,de:v.de})),
  ...PROPER_NAMES
];
function vocabularyHTML(){
  const rows=[
    ...L02_NOUNS.map(n=>[n.nomSg,n.akkSg+" · "+n.genus,n.de]),
    ...L02_VERBS.map(v=>[v.inf,v.sg+(v.inf==="adiuvāre"?" · mit Akkusativ":""),v.de]),
    ...PREPOSITIONS.map(p=>[p.lat,"mit Akkusativ",p.de]),
    ...SMALL_VOCAB.map(v=>[v.lat,v.lat==="nōs"?"Akkusativ":"",v.de])
  ];
  const table=items=>`<table class="rule-table"><tr><th>Latein</th><th>Form / Hinweis</th><th>Deutsch</th></tr>${items.map(row=>`<tr>${row.map(value=>`<td>${value}</td>`).join('')}</tr>`).join('')}</table>`;
  return `<details class="teach-card"><summary class="teach-head" style="cursor:pointer;min-height:48px"><strong>Alle ${rows.length} Lernwörter und 7 Eigennamen aus L02</strong></summary><div class="teach-body"><p>Abgeglichen mit deinem Vokabelheft, Seiten 7–9. Bei Nomen steht der Akkusativ Singular mit Genus, bei Verben die 3. Person Singular.</p>${table(rows)}<h3 style="margin-top:20px">E · Eigennamen</h3>${table(PROPER_NAMES.map(n=>[n.lat,n.akk+" · "+n.genus,n.de]))}<p>Die Bedeutungen passen je nach Satz. <strong>adiuvāre</strong> steht im Lateinischen mit Akkusativ: Serva amīcam adiuvat. = Die Sklavin hilft der Freundin / unterstützt die Freundin.</p><p>Ein Training enthält eine Auswahl aus dem Wortschatz. 100 % bedeutet: alle Aufgaben dieses Durchlaufs richtig.</p></div></details>`;
}

function shuffle(arr){

  const a=arr.slice();

  for(let i=a.length-1;i>0;i--){

    const j=
      Math.floor(
        Math.random()*(i+1)
      );

    [a[i],a[j]]=
      [a[j],a[i]];

  }

  return a;
}


function one(arr){

  return arr[
    Math.floor(
      Math.random()*arr.length
    )
  ];

}


function unique(arr){

  return arr.filter(
    (value,index,array)=>
      array.indexOf(value)===index
  );

}


function distractors(
  correct,
  values,
  amount=2
){

  return shuffle(
    unique(values)
      .filter(
        value=>value!==correct
      )
  ).slice(0,amount);

}

function makeQuestion(
  theme,
  prompt,
  sentence,
  helper,
  options,
  correct,
  success,
  wrong
){

  return{
    theme,
    prompt,
    sentence,
    helper,
    options,
    correct,
    success,
    wrong
  };

}


function qMeaning(){

  const n=one(MEANING_VOCAB);

  const correct=n.de;

  const wrong=distractors(
    correct,
    MEANING_VOCAB.map(x=>x.de),
    2
  );

  const opts=shuffle([
    correct,
    ...wrong
  ]);

  return makeQuestion(
    "Vokabel + Grammatik",
    "Was bedeutet dieses Wort oder dieser Name?",
    n.lat,
    "Bevor wir die Form bestimmen, sichern wir die Wortbedeutung.",
    opts,
    opts.indexOf(correct),
    n.lat+" bedeutet „"+n.de+"“.",
    "Die richtige Bedeutung ist „"+n.de+"“."
  );

}


function qAkkSg(){

  const n=one(
    NOUNS.filter(x=>
      x.akkSg!==x.nomSg
    )
  );

  const correct=n.akkSg;

  const alternatives=distractors(
    correct,
    [
      n.nomSg,
      n.nomPl,
      n.akkPl
    ].concat(
      NOUNS.map(x=>x.akkSg)
    ),
    2
  );

  const opts=shuffle([
    correct,
    ...alternatives
  ]);

  return makeQuestion(
    "Akkusativ Singular",
    "Welche Form ist der Akkusativ Singular?",
    n.nomSg+" = "+n.de,
    "Gesucht ist die Form für „wen oder was?“ im Singular.",
    opts,
    opts.indexOf(correct),
    n.nomSg+" → Akkusativ Singular: "+correct+".",
    "Der Akkusativ Singular lautet "+correct+"."
  );

}

function qKasusNumerus(){

  const candidates=[];

  NOUNS.forEach(function(n){

    const forms=[
      {
        form:n.nomSg,
        label:"Nominativ Singular",
        de:n.de
      },
      {
        form:n.akkSg,
        label:"Akkusativ Singular",
        de:n.de
      },
      {
        form:n.nomPl,
        label:"Nominativ Plural",
        de:n.de
      },
      {
        form:n.akkPl,
        label:"Akkusativ Plural",
        de:n.de
      }
    ];

    forms.forEach(function(f){

      const equalForms=
        forms.filter(
          x=>x.form===f.form
        );

      if(equalForms.length===1){
        candidates.push(f);
      }

    });

  });

  const q=one(candidates);

  const opts=shuffle([
    "Nominativ Singular",
    "Akkusativ Singular",
    "Nominativ Plural",
    "Akkusativ Plural"
  ]);

  return makeQuestion(
    "Kasus + Numerus",
    "Bestimme die Form.",
    q.form,
    "Wortbedeutung: "+q.de,
    opts,
    opts.indexOf(q.label),
    q.form+" = "+q.label+".",
    "Die richtige Bestimmung lautet "+q.label+"."
  );

}

      sentence:"Populus clāmōrem audit.",

      de:"den Lärm / das Geschrei",
      answer:"Akkusativobjekt",
      why:"Wen oder was hört das Volk? → den Lärm."
    },

    {
      sentence:"Amīcī per forum properant.",
      word:"per forum",
      de:"durch das Forum",
      answer:"Teil einer Adverbiale",
      why:"per forum beschreibt den Weg."
    },

    {
      sentence:"Dāvus ante aedificium exspectat.",
      word:"ante aedificium",
      de:"vor dem Gebäude",
      answer:"Teil einer Adverbiale",
      why:"ante aedificium beschreibt den Ort."
    }

  ];

  const q=one(questions);

  const options=shuffle([
    "Akkusativobjekt",
    "Teil einer Adverbiale"
  ]);

  return makeQuestion(
    "Satzglieder",
    "Welche Funktion hat die markierte Wortgruppe?",
    q.sentence.replace(
      q.word,
      "<strong style=\"color:var(--gold-light)\">"+
      q.word+
      "</strong>"
    ),
    q.word+" = "+q.de,
    options,
    options.indexOf(q.answer),
    "Richtig. "+q.why,
    q.why
  );

}


function qPreposition(){

  const q=one(PREPOSITIONS);

  const options=shuffle(
    PREPOSITIONS.map(
      x=>x.lat
    )
  );

  return makeQuestion(
    "Präposition + Akkusativ",
    "Welche Präposition passt zu dieser deutschen Bedeutung?",
    q.exampleDe,
    q.example+" = "+q.exampleDe,
    options,
    options.indexOf(q.lat),
    q.lat+" bedeutet hier „"+q.de+"“.",
    "Gesucht war "+q.lat+"."
  );

}


function qPrepositionSentence(){

  const questions=[

    {
      sentence:"Amīcī _____ forum properant.",
      de:"Die Freunde eilen durch das Forum.",
      answer:"per"
    },

    {
      sentence:"Dāvus _____ dominum venit.",
      de:"Davus kommt zum Herrn.",
      answer:"ad"
    },

    {
      sentence:"Serva _____ Colossēum properat.",
      de:"Die Sklavin eilt zum Kolosseum.",
      answer:"ad"
    },

    {
      sentence:"Dāvus _____ aedificium exspectat.",
      de:"Davus wartet vor dem Gebäude.",
      answer:"ante"
    }

  ];

  const q=one(questions);

  const options=shuffle([
    "ad",
    "per",
    "ante"
  ]);

  return makeQuestion(
    "Präposition einsetzen",
    "Welche Präposition passt?",
    q.sentence,
    q.de,
    options,
    options.indexOf(q.answer),
    "Richtig. Die passende Präposition ist "+q.answer+".",
    "Die richtige Präposition ist "+q.answer+"."
  );

}


function qKongruenz(){

  const questions=[

    {
      sentence:"Amīcus _____.",
      subjectDe:"der Freund",
      verbDe:"rufen",
      answer:"clāmat",
      options:["clāmat","clāmant","clāmāre"],
      why:"amīcus steht im Singular."
    },

    {
      sentence:"Amīcī _____.",
      subjectDe:"die Freunde",
      verbDe:"eilen",
      answer:"properant",
      options:["properat","properant","properāre"],
      why:"amīcī steht im Plural."
    },

    {
      sentence:"Senātor _____.",
      subjectDe:"der Senator",
      verbDe:"lachen",
      answer:"rīdet",
      options:["rīdet","rīdent","rīdēre"],
      why:"senātor steht im Singular."
    },

    {
      sentence:"Victōrēs _____.",
      subjectDe:"die Sieger",
      verbDe:"kommen",
      answer:"veniunt",
      options:["venit","veniunt","venīre"],
      why:"victōrēs steht im Plural."
    },

    {
      sentence:"Servī ad amīcōs _____.",
      subjectDe:"die Sklaven",
      verbDe:"eilen",
      answer:"properant",
      options:["properat","properant","properāre"],
      why:"servī steht im Plural."
    }

  ];

  const q=one(questions);

  const options=shuffle(
    q.options
  );

  return makeQuestion(
    "Kongruenz",
    "Welche Verbform passt zum Subjekt?",
    q.sentence,
    q.subjectDe+" · "+q.verbDe,
    options,
    options.indexOf(q.answer),
    "Richtig. "+q.why,
    q.why
  );

}


function qWordOrder(){

  const questions=[

    {
      latin:"Amīcī per forum properant.",
      helper:"amīcī = die Freunde · per forum = durch das Forum · properant = sie eilen",
      answer:"Die Freunde eilen durch das Forum.",
      wrong:[
        "Die Freunde durch das Forum eilen.",
        "Durch die Freunde das Forum eilt."
      ]
    },

    {
      latin:"Populus equōs exspectat.",
      helper:"populus = das Volk · equōs = die Pferde · exspectat = erwartet",
      answer:"Das Volk erwartet die Pferde.",
      wrong:[
        "Das Volk die Pferde erwartet.",
        "Die Pferde das Volk erwartet."
      ]
    },

    {
      latin:"Dāvus ibi amīcum videt.",
      helper:"Dāvus = Davus · ibi = dort · amīcum = den Freund · videt = sieht",
      answer:"Davus sieht dort den Freund.",
      wrong:[
        "Davus dort den Freund sieht.",
        "Den Freund Davus dort sieht."
      ]
    },

    {
      latin:"Servī ad amīcōs properant.",
      helper:"servī = die Sklaven · ad amīcōs = zu den Freunden · properant = sie eilen",
      answer:"Die Sklaven eilen zu den Freunden.",
      wrong:[
        "Die Sklaven zu den Freunden eilen.",
        "Zu den Sklaven die Freunde eilen."
      ]
    }

  ];

  const q=one(questions);

  const options=shuffle([
    q.answer,
    ...q.wrong
  ]);

  return makeQuestion(
    "Latein → Deutsch",
    "Welche Übersetzung ist gutes Deutsch?",
    q.latin,
    q.helper,
    options,
    options.indexOf(q.answer),
    "Richtig. Beim Übersetzen wird die lateinische Wortstellung sinnvoll ins Deutsche übertragen.",
    "Nicht einfach Wort für Wort in derselben Reihenfolge übersetzen."
  );

}


function qSmallVocab(){

  const v=one(SMALL_VOCAB);

  const wrong=distractors(
    v.de,
    SMALL_VOCAB.map(x=>x.de),
    2
  );

  const options=shuffle([
    v.de,
    ...wrong
  ]);

  return makeQuestion(
    "Vokabel",
    "Was bedeutet dieses Wort?",
    v.lat,
    "",
    options,
    options.indexOf(v.de),
    v.lat+" bedeutet „"+v.de+"“.",
    "Die richtige Bedeutung ist „"+v.de+"“."
  );

}

let current=0;

let score=0;

/* =====================================================
   FRAGEN RENDERN
===================================================== */

function renderQuestion(){

  if(
    current>=
    session.length
  ){

    showCompletion();

    return;
  }


  const q=
    session[current];


  document.getElementById(
    "progressLabel"
  ).textContent=
    (current+1)+
    "/"+
    session.length;


  const main=
    document.getElementById(
      "mainContent"
    );


  main.innerHTML=
    "";


  const card=
    document.createElement(
      "div"
    );

  card.className=
    "question-card";


  card.innerHTML=`

    <div class="q-theme">
      ${q.theme}
    </div>

    <div class="q-type-badge">
      Aufgabe ${current+1}
    </div>

    <div class="q-prompt">
      ${q.prompt}
    </div>

    <div class="q-sentence">
      ${q.sentence}
    </div>

    ${
      q.helper
      ?
      `<div class="q-helper">
        ${q.helper}
      </div>`
      :
      ""
    }

  `;


  const optionWrap=
    document.createElement(
      "div"
    );

  optionWrap.className=
    "options";


  const letters=
    ["A","B","C","D"];


  let answered=
    false;


  q.options.forEach(
    function(option,index){

      const btn=
        document.createElement(
          "button"
        );

      btn.type=
        "button";

      btn.className=
        "option-btn";


      btn.innerHTML=`

        <span class="option-letter">
          ${letters[index]}
        </span>

        <span>
          ${option}
        </span>

      `;


      btn.addEventListener(
        "click",
        function(){

          if(answered){
            return;
          }


          answered=
            true;


          const buttons=
            optionWrap.querySelectorAll(
              ".option-btn"
            );


          const ok=
            index===
            q.correct;


          if(ok){

            btn.classList.add(
              "correct"
            );

            score++;

          }

          else{

            btn.classList.add(
              "wrong"
            );

            buttons[
              q.correct
            ].classList.add(
              "correct"
            );

          }


          showFeedback(
            card,
            q,
            ok
          );

        }
      );


      optionWrap.appendChild(
        btn
      );

    }
  );


  card.appendChild(
    optionWrap
  );


  const feedback=
    document.createElement(
      "div"
    );

  feedback.id=
    "feedback";

  feedback.className=
    "feedback";


  card.appendChild(
    feedback
  );


  const next=
    document.createElement(
      "button"
    );

  next.type=
    "button";

  next.id=
    "nextBtn";

  next.className=
    "next-btn";


  next.textContent=
    current===
    session.length-1
      ?
      "Lektion abschließen ✓"
      :
      "Weiter →";


  next.addEventListener(
    "click",
    function(){

      current++;

      renderQuestion();

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

    }
  );


  card.appendChild(
    next
  );


  main.appendChild(
    card
  );

}


/* =====================================================
   FEEDBACK
===================================================== */

function showFeedback(
  card,
  q,
  ok
){

  const feedback=
    card.querySelector(
      "#feedback"
    );


  feedback.className=
    "feedback "+
    (
      ok
      ?
      "correct"
      :
      "wrong"
    );


  feedback.innerHTML=`

    <div class="feedback-title">
      ${
        ok
        ?
        "Richtig."
        :
        "Noch nicht richtig."
      }
    </div>

    <div>
      ${
        ok
        ?
        q.success
        :
        q.wrong
      }
    </div>

    ${
      !ok
      ?
      `<div class="feedback-tip">
        Prüfe zuerst die Wortbedeutung,
        dann die Endung und schließlich
        die Aufgabe des Wortes im Satz.
      </div>`
      :
      ""
    }

  `;


  card
    .querySelector(
      "#nextBtn"
    )
    .classList.add(
      "visible"
    );

}


/* =====================================================
   ABSCHLUSS
===================================================== */

function showCompletion(){

  document.getElementById(
    "mainContent"
  ).style.display=
    "none";


  const screen=
    document.getElementById(
      "completionScreen"
    );


  screen.classList.add(
    "visible"
  );


  const pct=
    Math.round(
      score/
      session.length*
      100
    );


  document.getElementById(
    "finalScore"
  ).textContent=
    score+
    "/"+
    session.length+
    " · "+
    pct+
    " %";


  document.getElementById(
    "finalStars"
  ).textContent=
    pct>=90
      ?
      "★★★"
      :
      pct>=70
        ?
        "★★"
        :
        "★";


  let msg;


  if(pct>=90){

    msg=
      "Sehr sicher. Du kannst Nominativ und Akkusativ unterscheiden, Akkusativformen bestimmen und erkennen, ob ein Akkusativ als Objekt oder nach einer Präposition verwendet wird.";

  }

  else if(pct>=70){

    msg=
      "Die Grundlage sitzt. Wiederhole besonders die Akkusativendungen und die Unterscheidung zwischen Akkusativobjekt und Präposition + Akkusativ.";

  }

  else{

    msg=
      "Gehe L02 noch einmal durch. Beginne mit Nominativ und Akkusativ und arbeite dich danach erneut zu Objekt, Adverbiale und Wortstellung vor.";

  }


  document.getElementById(
    "finalMsg"
  ).textContent=
    msg;


  const oldBest=
    Number(
      localStorage.getItem(
        "magistrella-l02-best"
      )||0
    );


  if(pct>oldBest){

    localStorage.setItem(
      "magistrella-l02-best",
      pct
    );

  }

}

   START
===================================================== */

renderIntro();

</script>
