};
for(const [l,rows] of Object.entries(ROWS))for(const [lat,de] of rows)add(+l,lat,de);

const GROUPS={'12':{name:'L01–L02',lessons:[1,2]},'34':{name:'L03–L04',lessons:[3,4]},'567':{name:'L05–L07',lessons:[5,6,7]}};
const LABELS={translation:'Satzübersetzung',vocab:'Vokabelzuordnung',grammar:'Grammatik'};
const QUOTES=[['Per aspera ad astra.','Durch Schwierigkeiten zu den Sternen.'],['Repetitio est mater studiorum.','Wiederholung ist die Mutter des Lernens.'],['Cotīdiē discimus.','Wir lernen jeden Tag.']];
let selected=GROUPS[new URLSearchParams(location.search).get('gruppe')]?new URLSearchParams(location.search).get('gruppe'):'12',session=null,lastResult=null,storageWarning='',memory={};
const app=document.getElementById('app');
function escapeHTML(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function plain(v){return String(v||'').replace(/<[^>]*>/g,'');}
function normalize(v){return String(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase().replace(/\s+/g,' ');}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function key(g){return 'magistrella-exam-'+g+'-history-v1';}
function readHistory(g){if(memory[g])return memory[g];try{const a=JSON.parse(localStorage.getItem(key(g))||'[]');return memory[g]=Array.isArray(a)?a.filter(r=>r.group===g&&Number.isInteger(r.correct)&&r.correct>=0&&r.correct<=r.total&&r.total===24&&r.percentage===Math.round(r.correct/r.total*100)&&Number.isFinite(Date.parse(r.date))&&r.stats):[];}catch{storageWarning='Der Verlauf kann momentan nicht geladen oder gespeichert werden. Du kannst trotzdem trainieren.';return memory[g]=[];}}
function saveHistory(g,rows){memory[g]=rows;try{localStorage.setItem(key(g),JSON.stringify(rows));}catch{storageWarning='Speichern ist nicht möglich. Deine Ergebnisse bleiben bis zum Schließen dieser Seite sichtbar.';}}
function id(q){return [q.lesson,q.kind,q.kind==='grammar'?q.prompt:'',q.sentence].join('|');}
function pickFresh(pool,used,previous){let candidates=pool.filter(q=>!used.has(id(q)));if(!candidates.length)throw Error('Aufgabenpool zu klein');let fresh=candidates.filter(q=>!previous.has(id(q)));let q=structuredClone(shuffle(fresh.length?fresh:candidates)[0]);used.add(id(q));return q;}
function vocabPool(lesson){return DATA[lesson].vocab.map(v=>({lesson,kind:'vocab',category:'Wortbedeutung',prompt:'Ordne alle passenden Bedeutungen zu.',sentence:v.lat+(v.info?' · '+v.info:''),answer:v.de,options:[v.de,...shuffle([...new Set(DATA[lesson].vocab.filter(w=>w.de!==v.de).map(w=>w.de))]).slice(0,3)],explanation:v.lat+' – '+v.de,vocabLat:v.lat}));}
function translationPool(lesson){return SENTENCES[lesson].map(s=>({lesson,kind:'translation',category:'Satzübersetzung',prompt:'Welche Übersetzung gibt den ganzen Satz richtig wieder?',sentence:s.lat,answer:s.de,options:[s.de,...shuffle([...new Set(SENTENCES[lesson].filter(w=>w.de!==s.de).map(w=>w.de))]).slice(0,3)],explanation:s.note}));}
function buildQuestions(g){const lessons=GROUPS[g].lessons,used=new Set(),previous=new Set(readHistory(g).at(-1)?.questionIds||[]),questions=[];
 for(let i=0;i<12;i++){let q=pickFresh(translationPool(lessons[i%lessons.length]),used,previous);q.self=i>=8;if(q.self){q.options=null;q.prompt='Übersetze den ganzen Satz ins Deutsche.';}questions.push(q);}
 for(let i=0;i<4;i++)questions.push(pickFresh(vocabPool(lessons[i%lessons.length]),used,previous));
 const usedSkills=new Set();for(let i=0;i<8;i++){let lesson=lessons[(i+4)%lessons.length],pool=DATA[lesson].grammar;let diverse=pool.filter(q=>!usedSkills.has(lesson+q.skill));if(diverse.length)pool=diverse;let q=pickFresh(pool,used,previous);usedSkills.add(lesson+q.skill);questions.push(q);}
 return shuffle(questions).map(q=>({...q,options:q.options?shuffle(q.options):null}));}
function newSession(g,questions,type='full'){return {group:g,type,questions,index:0,answers:[],started:new Date().toISOString(),done:false};}
function recordAnswer(answer,correct){if(!session||session.done||session.answers.length!==session.index)return false;const q=session.questions[session.index];session.answers.push({question:q,answer,correct:!!correct,self:!!q.self});return true;}
function summarize(run){const stats={};for(const a of run.answers){const k=a.question.kind;stats[k]??={correct:0,total:0};stats[k].total++;if(a.correct)stats[k].correct++;}const correct=run.answers.filter(a=>a.correct).length;return {group:run.group,correct,total:run.answers.length,percentage:Math.round(correct/run.answers.length*100),stats,autoCorrect:run.answers.filter(a=>!a.self&&a.correct).length,autoTotal:run.answers.filter(a=>!a.self).length,selfCorrect:run.answers.filter(a=>a.self&&a.correct).length,selfTotal:run.answers.filter(a=>a.self).length};}
function complete(){if(session.done)return lastResult;if(session.answers.length!==session.questions.length)throw Error('Unvollständiger Test');session.done=true;if(session.type==='practice')return null;
 lastResult={...summarize(session),date:new Date().toISOString(),id:globalThis.crypto?.randomUUID?.()||String(Date.now())+Math.random(),questionIds:session.questions.map(id),answers:structuredClone(session.answers)};
 const {answers,...entry}=lastResult;saveHistory(session.group,[...readHistory(session.group),entry]);return lastResult;}
function tableHistory(g){const rows=readHistory(g),last=rows.at(-1),best=Math.max(0,...rows.map(r=>r.percentage));return `<h2>Dein Fortschritt · ${GROUPS[g].name}</h2><p>${rows.length} Volltests · Zuletzt: ${last?last.percentage+' %':'–'} · Bestwert: ${rows.length?best+' %':'–'}</p><div class="scroll"><table><caption>Nur vollständige Tests · Prozentwerte einschließlich Selbstbewertung</caption><thead><tr><th>Datum</th><th>Punkte</th><th>Ergebnis</th><th>Veränderung</th><th>Automatisch</th><th>Selbst bewertet</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${escapeHTML(new Date(r.date).toLocaleString('de-DE'))}</td><td>${r.correct}/${r.total}</td><td>${r.percentage} %</td><td>${i?(r.percentage-rows[i-1].percentage>0?'+':'')+(r.percentage-rows[i-1].percentage)+' Prozentpunkte':'–'}</td><td>${r.autoCorrect}/${r.autoTotal}</td><td>${r.selfCorrect}/${r.selfTotal}</td></tr>`).reverse().join('')||'<tr><td colspan="6">Noch kein Test abgeschlossen.</td></tr>'}</tbody></table></div>`;}
function home(){session=null;app.innerHTML=`<h1>Bereit für die Klassenarbeit?</h1><p>24 wechselnde Aufgaben: zwölf Satzübersetzungen, vier Vokabelzuordnungen und acht Grammatikaufgaben. Jede Lektion des gewählten Bereichs ist vertreten.</p><div class="paper"><strong>So wird bewertet</strong><p>20 Aufgaben werden automatisch gewertet. Vier Übersetzungen schreibst du selbst und vergleichst sie mit einer Musterlösung. Diese Selbstbewertungen werden separat ausgewiesen. Jede Aufgabe zählt einen Punkt.</p><p>100 % gilt für diesen Durchlauf. Die Ergebnisse sind eine Lernhilfe, keine Schulnote. Bei unterschiedlichen Aufgaben sind Veränderungen nur eine Orientierung.</p></div><div class="grid">${Object.entries(GROUPS).map(([g,v])=>`<button data-group="${g}" ${g===selected?'class="primary"':''}>${v.name}<small>Klassenarbeit vorbereiten</small></button>`).join('')}</div><section class="card"><h2>${GROUPS[selected].name}</h2><button class="primary" id="start">Neuen Test starten</button><details><summary>Inhalte vor dem Test wiederholen</summary>${GROUPS[selected].lessons.map(l=>`<p><a href="l0${l}.html">L0${l}: Regeln und Vokabeln</a></p>`).join('')}</details>${tableHistory(selected)}</section><p role="status">${escapeHTML(storageWarning)}</p>`;app.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{selected=b.dataset.group;home();});app.querySelector('#start').onclick=()=>{session=newSession(selected,buildQuestions(selected));showQuestion();};}
function showQuestion(){if(session.index===session.questions.length){const practice=session.type==='practice';complete();showResult(practice?`Fehlerübung: ${summarize(session).correct}/${session.answers.length}. Das Vollergebnis bleibt unverändert.`:'');return;}
 const q=session.questions[session.index];app.innerHTML=`<p><span class="pill">${GROUPS[session.group].name}</span> ${session.type==='practice'?'Fehlerübung':'Volltest'} · Aufgabe ${session.index+1}/${session.questions.length}</p><progress value="${session.index}" max="${session.questions.length}" aria-label="Bearbeitete Aufgaben"></progress><article class="card"><p class="muted">L0${q.lesson} · ${LABELS[q.kind]} · ${escapeHTML(q.category)}</p><h2>${escapeHTML(q.prompt)}</h2><div class="paper sentence">${q.sentence}</div><div id="answerArea"></div><div id="feedback" aria-live="polite"></div></article><button id="exit">${session.type==='practice'?'Zum Vollergebnis':'Test abbrechen und zur Auswahl'}</button>`;
 const area=app.querySelector('#answerArea');if(q.self){area.innerHTML='<label for="translation">Deine Übersetzung</label><textarea id="translation" spellcheck="true"></textarea><button id="compare" class="primary">Mit Musterlösung vergleichen</button>';area.querySelector('#compare').onclick=()=>{const val=area.querySelector('textarea').value.trim();if(!val){area.querySelector('textarea').focus();return;}area.innerHTML=`<div class="paper"><h3>Deine Übersetzung</h3><p>${escapeHTML(val)}</p><h3>Musterlösung</h3><p>${escapeHTML(q.answer)}</p><p>Gleichwertige Wörter und eine andere deutsche Wortstellung sind erlaubt. Stimmen handelnde Person, Anzahl, Handlung, Objekte und Verneinung? Nur dann ist der Satz vollständig richtig.</p><p>${escapeHTML(q.explanation)}</p></div><p>Deine ehrliche Selbstbewertung:</p><div class="actions"><button id="selfYes">✓ Inhaltlich vollständig richtig</button><button id="selfNo">✗ Noch ein Fehler oder etwas fehlt</button></div>`;area.querySelector('#selfYes').onclick=()=>submit(val,true);area.querySelector('#selfNo').onclick=()=>submit(val,false);};}
 else if(q.input){area.innerHTML='<form><label for="formAnswer">Deine Antwort · Längezeichen freiwillig</label><input id="formAnswer" autocomplete="off" autocapitalize="none" spellcheck="false" required><button class="primary">Antwort prüfen</button></form>';area.querySelector('form').onsubmit=e=>{e.preventDefault();const v=area.querySelector('input').value;if(v.trim())submit(v,normalize(v)===normalize(q.answer));};}
 else{area.className='options';q.options.forEach(o=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>submit(o,o===q.answer);area.appendChild(b);});}
 app.querySelector('#exit').onclick=()=>session.type==='practice'?showResult():home();window.scrollTo(0,0);}
function submit(answer,correct){if(!recordAnswer(answer,correct))return;const q=session.questions[session.index];app.querySelectorAll('#answerArea button,#answerArea input').forEach(b=>b.disabled=true);app.querySelector('#feedback').innerHTML=`<div class="paper ${correct?'good':'bad'}"><strong>${correct?'✓ Richtig':'✗ Noch üben'}${q.self?' · Selbstbewertung':''}</strong><p>Lösung: ${escapeHTML(q.answer)}</p><p>${escapeHTML(plain(q.explanation))}</p></div><button id="next" class="primary">${session.index+1===session.questions.length?'Ergebnis anzeigen':'Weiter'}</button>`;app.querySelector('#next').onclick=()=>{session.index++;showQuestion();};}
function buildPractice(result){return result.answers.filter(a=>!a.correct).map(a=>{const old=a.question;let pool=old.kind==='grammar'?DATA[old.lesson].grammar.filter(q=>q.skill===old.skill):old.kind==='translation'?translationPool(old.lesson):[];let fresh=pool.filter(q=>q.sentence!==old.sentence);let q=structuredClone(fresh.length?shuffle(fresh)[0]:old);if(old.kind==='vocab'){q.prompt='Welches lateinische Wort gehört zu diesen Bedeutungen?';q.sentence=old.answer;q.answer=old.vocabLat;q.options=[q.answer,...shuffle(DATA[old.lesson].vocab.filter(v=>v.lat!==q.answer).map(v=>v.lat)).slice(0,3)];}q.self=old.self;if(q.self){q.options=null;q.prompt='Übersetze den ganzen Satz ins Deutsche.';}if(q.options)q.options=shuffle(q.options);return q;});}
function showResult(message=''){const r=lastResult;if(!r){home();return;}selected=r.group;const wrong=r.answers.filter(a=>!a.correct);app.innerHTML=`<h1>Dieses Training · ${GROUPS[r.group].name}</h1>${message?`<p role="status">${escapeHTML(message)}</p>`:''}<section class="card"><h2>${r.correct}/${r.total} · ${r.percentage} %</h2><p>Automatisch: ${r.autoCorrect}/${r.autoTotal} · Selbst bewertet: ${r.selfCorrect}/${r.selfTotal}</p><p>Das Ergebnis beschreibt diesen Durchlauf, nicht die Beherrschung aller Lektionen.</p><div id="image"></div><div class="actions"><button id="share">Ergebnis teilen</button><button id="save">Bild speichern</button></div><p id="imageStatus" role="status"></p></section><h2>Deine Diagnose</h2><div class="scroll"><table><thead><tr><th>Bereich</th><th>Richtig</th><th>Versuche</th><th>Anteil</th></tr></thead><tbody>${Object.entries(r.stats).map(([k,v])=>`<tr><td>${LABELS[k]}</td><td>${v.correct}</td><td>${v.total}</td><td>${Math.round(100*v.correct/v.total)} %</td></tr>`).join('')}</tbody></table></div>${wrong.length?wrong.map(a=>`<article class="paper bad"><h3>L0${a.question.lesson} · ${escapeHTML(a.question.category)}</h3><p>${a.question.sentence}</p><p>Deine Antwort: ${escapeHTML(a.answer)}</p><p><strong>Lösung: ${escapeHTML(a.question.answer)}</strong></p><p>${escapeHTML(plain(a.question.explanation))}</p>${a.self?'<p>Als noch unsicher selbst bewertet.</p>':''}<a style="color:#58400b" href="l0${a.question.lesson}.html">Regeln und Wortschatz in L0${a.question.lesson}</a></article>`).join(''):'<p class="paper good">✓ Alles richtig in diesem Durchlauf!</p>'}<h2>Wie möchtest du weiterlernen?</h2><div class="actions">${wrong.length?'<button id="practice">Nur meine Fehler trainieren</button>':''}<button id="restart" class="primary">Neuer vollständiger Test</button><button id="menu">Andere Lektionsgruppe</button></div>${tableHistory(r.group)}<p role="status">${escapeHTML(storageWarning)}</p>`;
 try{app.querySelector('#image').appendChild(createCanvas(r));}catch{app.querySelector('#imageStatus').textContent='Das Ergebnisbild ist hier nicht verfügbar. Dein Testergebnis bleibt erhalten.';}
 app.querySelector('#restart').onclick=()=>{session=newSession(r.group,buildQuestions(r.group));showQuestion();};app.querySelector('#menu').onclick=home;if(wrong.length)app.querySelector('#practice').onclick=()=>{session=newSession(r.group,buildPractice(r),'practice');showQuestion();};app.querySelector('#share').onclick=()=>exportImage(r,true);app.querySelector('#save').onclick=()=>exportImage(r,false);window.scrollTo(0,0);}
function createCanvas(r){const c=document.createElement('canvas');c.width=1080;c.height=1080;const x=c.getContext('2d');if(!x)throw Error('Kein Canvas');x.fillStyle='#19140e';x.fillRect(0,0,1080,1080);x.strokeStyle='#e7c66a';x.lineWidth=4;x.strokeRect(35,35,1010,1010);x.textAlign='center';x.fillStyle='#e7c66a';x.font='bold 56px sans-serif';x.fillText('MAGISTRELLA',540,135);x.fillStyle='#fff5df';x.font='34px sans-serif';x.fillText('Klassenarbeit vorbereiten · '+GROUPS[r.group].name,540,215);x.font='bold 118px sans-serif';x.fillText(r.correct+' / '+r.total,540,395);x.fillStyle='#e7c66a';x.font='bold 95px sans-serif';x.fillText(r.percentage+' %',540,530);x.fillStyle='#fff5df';x.font='27px sans-serif';x.fillText('Automatisch: '+r.autoCorrect+'/'+r.autoTotal+' · Selbst bewertet: '+r.selfCorrect+'/'+r.selfTotal,540,610);x.font='25px sans-serif';x.fillText('Ergebnis dieses Durchlaufs',540,655);const quote=QUOTES[r.group==='12'?0:r.group==='34'?1:2];x.fillStyle='#e7c66a';x.font='italic 36px Georgia';x.fillText(quote[0],540,780);x.fillStyle='#fff5df';x.font='29px sans-serif';x.fillText(quote[1],540,840);x.font='26px sans-serif';x.fillText(new Date(r.date).toLocaleDateString('de-DE'),540,965);return c;}
function png(r){return new Promise((resolve,reject)=>{try{createCanvas(r).toBlob(b=>b?resolve(b):reject(Error('PNG fehlgeschlagen')),'image/png');}catch(e){reject(e);}});}
function download(blob,r){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Magistrella-Klassenarbeit-'+GROUPS[r.group].name+'-'+r.date.slice(0,10)+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);}
async function exportImage(r,share){const status=app.querySelector('#imageStatus');try{const blob=await png(r);if(share&&typeof File==='function'){const file=new File([blob],'Magistrella.png',{type:'image/png'});if(navigator.canShare?.({files:[file]})&&navigator.share){try{await navigator.share({files:[file],title:'Magistrella · Klassenarbeit'});status.textContent='Ergebnis geteilt.';return;}catch(e){if(e.name==='AbortError')return;}}}download(blob,r);status.textContent='Das PNG-Bild wurde zum Speichern bereitgestellt.';}catch{status.textContent='Bild konnte nicht erzeugt werden. Dein Ergebnis bleibt gespeichert, soweit Browserspeicher verfügbar ist.';}}
home();
